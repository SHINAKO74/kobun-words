  { id:366, word:"けしからず", pos:"連語", meaning:"けしからん・不届きだ・普通でない", etym:"「怪(け)しからず」。「けし」=異様な、の否定形だが、「異様だ」の意味で使う。", example:"けしからぬことを言ふ。", translation:"とんでもないことを言う。", highlight:"けしからぬ", source:"(作例)", trivia:null, related:[] },
  { id:367, word:"まほし", pos:"助動", meaning:"〜たい・〜してほしい(希望)", etym:"助動詞「まほし」。未然形接続。話し手の希望を表す。「あらまほし」は「ありたい」。", example:"見まほしき花。", translation:"見たい花。", highlight:"まほしき", source:"(作例)", trivia:"「ばや」(自己の希望)・「なむ」(他者への希望)と使い分ける。", related:[{id:46,type:"類"}] },
  { id:368, word:"たし", pos:"助動", meaning:"〜たい(希望)", etym:"助動詞「たし」。連用形接続。「まほし」と同義だが、中世以降より一般化。", example:"花見に行きたし。", translation:"花見に行きたい。", highlight:"たし", source:"(作例)", trivia:"「まほし」が雅語、「たし」がやや日常語。", related:[] },
  { id:369, word:"ばや", pos:"終助", meaning:"〜したいなあ(自己の願望)", etym:"終助詞「ばや」。未然形接続。話し手自身の希望を表す。", example:"いかで見ばや。", translation:"なんとかして見たいなあ。", highlight:"ばや", source:"竹取物語", trivia:"「なむ」(他者への願望)と区別する。", related:[{"id":370,"type":"対"}] },
  { id:370, word:"なむ", pos:"終助", meaning:"〜してほしい(他者への願望)", etym:"終助詞「なむ」。未然形接続。他者に対する話し手の願望を表す。係助詞「なむ」とは別。", example:"花咲かなむ。", translation:"花が咲いてほしい。", highlight:"なむ", source:"(作例)", trivia:"「ばや」(自分が〜したい)と「なむ」(〜してほしい)の区別は頻出。", related:[{"id":369,"type":"対"}] },

  { id:371, word:"つかうまつる", pos:"動ラ四", meaning:"お仕えする・いたす(「す」の謙譲語)", etym:"「仕(つか)うまつる」。「する」「仕える」の謙譲語。", example:"殿に年ごろつかうまつる。", translation:"殿に長年お仕えする。", highlight:"つかうまつる", source:"源氏物語", trivia:null, related:[] },
  { id:372, word:"たちまち", pos:"副", meaning:"たちまち・すぐに", etym:"「立ち+待ち」由来説。間を置かず瞬時に変化する様。", example:"たちまちに風変はる。", translation:"たちまち風が変わる。", highlight:"たちまちに", source:"(作例)", trivia:null, related:[] },
  { id:373, word:"しろしめす", pos:"動サ四", meaning:"お治めになる・ご存知である(「知る」の尊敬語)", etym:"「知ろしめす」。「知る」「治める」の最高敬語。帝・上皇に用いる。", example:"天の下しろしめす帝。", translation:"天下をお治めになる帝。", highlight:"しろしめす", source:"(作例)", trivia:null, related:[] },
  { id:374, word:"いたす", pos:"動サ四", meaning:"いたす(「す」の謙譲語)・至らせる", etym:"「致す」。自分の行為をへりくだって言う謙譲語。", example:"御礼をいたす。", translation:"お礼を申し上げる。", highlight:"いたす", source:"(作例)", trivia:null, related:[] },
  { id:375, word:"おもてなし", pos:"名", meaning:"もてなし・接待・ふるまい", etym:"「表無し」説(表裏のない心)と「持て成し」説。客への真心込めた対応。", example:"おもてなしいとよし。", translation:"もてなしがたいそう良い。", highlight:"おもてなし", source:"(作例)", trivia:null, related:[] },
{ id:376, word:"あり", pos:"動ラ変", meaning:"①ある・いる ②生きている ③暮らしている", etym:"ラ行変格活用の代表語。「あり・をり・はべり・いまそかり」がラ変四語。", example:"昔、男ありけり。｜いかにしてありけむ。｜世にあり。", translation:"昔、男がいた。｜どのように暮らしていたのだろうか。｜世に生きている。", highlight:"あり｜あり｜あり", source:"伊勢物語｜(作例)｜(作例)", trivia:null, related:[] },
  { id:377, word:"なる", pos:"動ラ四", meaning:"①なる・変化する ②(音が)聞こえる", etym:"「成る・為る」。状態変化の基本動詞。「鳴る」と同形で文脈判断が必要。", example:"春になる。｜鐘の音のなる。", translation:"春になる。｜鐘の音が聞こえる。", highlight:"なる｜なる", source:"(作例)｜(作例)", trivia:null, related:[] },
  { id:378, word:"まつ", pos:"動タ四", meaning:"待つ・期待する", etym:"「待つ」。和歌では「松」との掛詞が頻出。待ち焦がれる恋心を詠む定型表現。", example:"人をまつ宵。", translation:"人を待つ夕暮れ。", highlight:"まつ", source:"(作例)", trivia:"「松」との掛詞で和歌に頻出。「待つとし聞かば今帰り来む」(万葉集)。", related:[] },
  { id:379, word:"なく", pos:"動カ四", meaning:"①泣く ②鳴く", etym:"「泣く・鳴く」。人が泣くのも鳥が鳴くのも同じ語。和歌では掛詞的に両義を含む。", example:"いみじう泣く。｜鳥のなく声。", translation:"ひどく泣く。｜鳥が鳴く声。", highlight:"泣く｜なく", source:"源氏物語｜(作例)", trivia:null, related:[] },
  { id:380, word:"うちいづ", pos:"動ダ下二", meaning:"口に出す・言い出す", etym:"「打ち出づ」=内から外へ出す。心の中のことを口に出す動作。", example:"かくなむとうちいでむことの。", translation:"このようにと口に出すことが。", highlight:"うちいで", source:"源氏物語", trivia:null, related:[] },
  { id:381, word:"おほす", pos:"動サ下二", meaning:"お命じになる・おっしゃる(「言ふ」の尊敬語)", etym:"「仰す(おほす)」。下二段活用。命令・発言の尊敬語。「おほせ」は名詞形(仰せ)。", example:"帝おほせあり。", translation:"帝がお命じになる。", highlight:"おほせ", source:"(作例)", trivia:null, related:[{"id":69,"type":"類"}] },
  { id:382, word:"おほせ", pos:"名", meaning:"仰せ・お言葉・ご命令", etym:"動詞「おほす(仰す)」の名詞形。上位者のお言葉・命令を指す。", example:"おほせを承る。", translation:"ご命令をお受けする。", highlight:"おほせ", source:"(作例)", trivia:null, related:[{"id":381,"type":"類"}] },
  { id:383, word:"しかれども", pos:"接続", meaning:"しかしながら・そうではあるけれども", etym:"「然(しか)れども」=「そうであるけれど」。逆接の接続詞。「されど」と同義。", example:"しかれどもなほ止まず。", translation:"しかしながらやはり止まない。", highlight:"しかれども", source:"(作例)", trivia:null, related:[] },
{ id:384, word:"じげ", pos:"名", meaning:"地下(じげ)。殿上の間に昇れない身分の低い官人", etym:"「地下」=殿上(てんじょう)に対する地上の意。四位以下で昇殿を許されない者。", example:"じげの人にはあらず。", translation:"殿上の間に昇れぬ(低い身分の)者ではない。", highlight:"じげ", source:"(作例)", trivia:"「殿上人(うへびと)」の対概念。身分を即座に見分ける指標。", related:[{"id":135,"type":"対"}] },
  { id:385, word:"とのゐ", pos:"名", meaning:"宿直(とのゐ)。宮中に泊まり込んで夜間の警護や勤務をすること", etym:"「殿居(とのゐ)」=殿に居ること。宮中で夜番をする勤務形態。", example:"今宵はとのゐなり。", translation:"今夜は宮中の宿直だ。", highlight:"とのゐ", source:"(作例)", trivia:null, related:[] },
  { id:386, word:"にょうばう", pos:"名", meaning:"女房。宮中や貴族に仕える女性の総称", etym:"「女房」=女の部屋。もとは部屋を与えられた宮仕えの女性を指す。侍女より格上。", example:"にょうばうたちさぶらふ。", translation:"女房たちがお仕えしている。", highlight:"にょうばう", source:"枕草子", trivia:"清少納言・紫式部も「女房」。単なる召使いではなく教養ある知識人。", related:[] },
  { id:387, word:"ごけん", pos:"名", meaning:"後見(ごけん)。後ろ盾となって世話をする人・こと", etym:"「後見」=後ろを見て守る。政治的庇護者・養育係の意。", example:"はかばかしき御後見もなくて。", translation:"しっかりした後見人もなくて。", highlight:"後見", source:"源氏物語", trivia:"光源氏が紫の上の「後見」となるように、親に代わる養育者を指すことも多い。", related:[] },
  { id:388, word:"きちやう", pos:"名", meaning:"几帳(きちょう)。室内を仕切る移動式の垂れ幕", etym:"「几帳」=台に帷(とばり)を垂らしたもの。貴族の室内で女性を隠す重要な調度品。", example:"きちやうの陰にゐ給ふ。", translation:"几帳の陰にいらっしゃる。", highlight:"きちやう", source:"源氏物語", trivia:"御簾(みす)が外と内を隔てるのに対し、几帳は室内をさらに仕切る。女性の姿を隠す「垣間見」の舞台装置。", related:[{"id":197,"type":"参"}] },
  { id:389, word:"だいり", pos:"名", meaning:"内裏(だいり)。天皇の住む宮殿・宮中", etym:"「内裏」=大内(おほうち)の中の意。天皇の御所。転じて天皇そのものを指すことも。", example:"だいりにまゐる。", translation:"宮中に参上する。", highlight:"だいり", source:"(作例)", trivia:null, related:[] },
  { id:390, word:"にょうご", pos:"名", meaning:"女御(にょうご)。天皇の后妃の一つ。中宮に次ぐ地位", etym:"「女御」。天皇の妃の位の一つ。皇后(中宮)の下、更衣の上に位する。", example:"にょうごまゐり給ふ。", translation:"女御が参上なさる。", highlight:"にょうご", source:"(作例)", trivia:"桐壺更衣(源氏物語)は女御より低い更衣の身分で帝の寵愛を受けたため嫉妬された。", related:[] },
  { id:391, word:"こうい", pos:"名", meaning:"更衣(こうい)。天皇の后妃の一つ。女御より低い地位", etym:"「更衣」=もとは天皇の衣服を管理する女官。後に后妃の称号に。", example:"いづれの御時にか、にょうご・こういあまたさぶらひ給ひけるなかに。", translation:"いつの帝の御代であったか、女御・更衣が大勢お仕えしていた中に。", highlight:"こうい", source:"源氏物語", trivia:"『源氏物語』冒頭の有名な一文。共通テスト・東大ともに頻出の出典。", related:[{"id":390,"type":"参"}] },
  { id:392, word:"つぼね", pos:"名", meaning:"局(つぼね)。宮中で女房に与えられた個室", etym:"「局」=仕切られた小部屋。女房の住居・勤務場所。転じて、局を持つ女房自身を指すことも。", example:"つぼねにかへる。", translation:"局(自室)に戻る。", highlight:"つぼね", source:"(作例)", trivia:null, related:[] },
  { id:393, word:"ずりやう", pos:"名", meaning:"受領(ずりょう)。地方に赴任する中級貴族の国司", etym:"「受領」=国の事務を前任者から受け取る意。四位・五位の中流貴族が任じられた。", example:"ずりやうの娘。", translation:"受領(地方官)の娘。", highlight:"ずりやう", source:"(作例)", trivia:"清少納言の父や紫式部の父は受領階級。物語で「地方から上京する姫」はだいたい受領の娘。", related:[] },
  { id:394, word:"むじやう", pos:"名・形動", meaning:"無常(むじょう)。万物は移り変わり永遠のものはないという仏教思想", etym:"仏教用語「無常」。一切の存在は変化し続けるという根本教義。古文の最重要テーマ。", example:"ゆく河の流れは絶えずして、しかももとの水にあらず。よどみに浮かぶうたかたは…", translation:"流れる川の流れは絶えることなく、しかもその水はもとの水ではない。", highlight:"河の流れ", source:"方丈記", trivia:"『方丈記』冒頭。「無常」を象徴する最も有名な一節。『平家物語』冒頭「祇園精舎」も無常の表現。", related:[] },
  { id:395, word:"すくせ", pos:"名", meaning:"宿世(すくせ)。前世からの因縁・運命・宿命", etym:"仏教用語「宿世」=前世。現世の幸不幸は前世の行いで決まるという考え。", example:"すくせのあさからぬ御契り。", translation:"前世からの浅くない(=深い)因縁。", highlight:"すくせ", source:"源氏物語", trivia:"古文で「すくせ」「前の世」「契り」が出たら、登場人物の運命的なつながりを示すサイン。", related:[{"id":180,"type":"類"}] },
  { id:396, word:"くどく", pos:"名", meaning:"功徳(くどく)。善い行いの報い・仏道修行による恩恵", etym:"仏教用語「功徳」。善行・布施・読経などで積まれる善報。", example:"くどくを積む。", translation:"善行の報いを積む。", highlight:"くどく", source:"(作例)", trivia:null, related:[] },
  { id:397, word:"ほっしん", pos:"名・動サ変", meaning:"発心(ほっしん)。仏道に入ろうと志すこと・出家を決意すること", etym:"「発菩提心(ほつぼだいしん)」の略。悟りを求める心を起こすこと。", example:"ほっしんして山にこもる。", translation:"出家を決意して山にこもる。", highlight:"ほっしん", source:"(作例)", trivia:null, related:[] },
  { id:398, word:"ごう", pos:"名", meaning:"業(ごう)。前世の行いが現世に及ぼす影響・因果の法則", etym:"仏教用語「業(カルマ)」。身体・言葉・心で行った行為が未来の結果を生むという思想。", example:"前の世のごうなり。", translation:"前世の業(=因果応報)である。", highlight:"ごう", source:"(作例)", trivia:"「業が深い」=前世の罪が深い。古文では不幸な運命の説明に使われる。", related:[{"id":179,"type":"類"}] },
  { id:399, word:"えしゃうじゃうり", pos:"名", meaning:"会者定離(えしゃじょうり)。会う者は必ず別れるという仏教の教え", etym:"仏教の四苦八苦のうち「愛別離苦」と対をなす無常観。出会いと別れの必然性。", example:"えしゃうじゃうり、世のならひなり。", translation:"会う者は必ず別れる、世の常である。", highlight:"えしゃうじゃうり", source:"(作例)", trivia:null, related:[{"id":394,"type":"類"}] },
  { id:400, word:"よをそむく", pos:"連語", meaning:"世を背く。出家する・俗世を離れる", etym:"「世(よ)を背(そむ)く」。仏門に入って俗世間と縁を切ること。", example:"世をそむきて山に入る。", translation:"出家して山に入る。", highlight:"世をそむき", source:"(作例)", trivia:"出家表現は多彩:「世を背く」「世を捨つ(id:376参照)」「世を厭ふ(id:150)」「やつす(id:429)」「発心す(id:397)」。いずれも「俗世を離れ仏門に入る」意。", related:[] },
  { id:401, word:"さりとて", pos:"接続", meaning:"そうかといって・だからといって", etym:"「然(さ)りとて」=「そうであるとしても」。前件を認めつつ安易な結論を否定する譲歩の接続詞。", example:"さりとて止むべきにもあらず。", translation:"だからといってやめるわけにもいかない。", highlight:"さりとて", source:"(作例)", trivia:null, related:[] },
  { id:402, word:"さはれ", pos:"感・接続", meaning:"ままよ・どうにでもなれ・それはさておき", etym:"「さ(然)+はれ」=「そうであれ」。諦め・覚悟の感嘆詞、または話題転換の接続詞。", example:"さはれ、ただ言ひてむ。", translation:"ええい、かまわず言ってしまおう。", highlight:"さはれ", source:"(作例)", trivia:null, related:[] },
  { id:403, word:"そもそも", pos:"接続", meaning:"そもそも・いったい・ところで", etym:"「そも+そも」=「それにしても」の強調。話の根本に立ち返る接続詞。", example:"そもそも、この事のおこりは。", translation:"そもそも、この事の始まりは。", highlight:"そもそも", source:"(作例)", trivia:null, related:[] },
  { id:404, word:"およそ", pos:"副", meaning:"①おおよそ・だいたい ②(打消で)まったく〜ない", etym:"「凡(およ)そ」。物事の概略を示す。打消と呼応すると全面否定になる。", example:"およそ人の心ざま。｜およそあるまじきこと。", translation:"だいたい人の気質というものは。｜まったくあるはずのないこと。", highlight:"およそ｜およそ", source:"(作例)｜(作例)", trivia:null, related:[] },
  { id:405, word:"そうす", pos:"動サ変", meaning:"奏す。天皇に申し上げる(天皇専用の謙譲語)", etym:"漢語「奏(そう)」+「す」。天皇に対してのみ使う最高の謙譲語。", example:"帝にそうす。", translation:"天皇に申し上げる。", highlight:"そうす", source:"(作例)", trivia:"「奏す」=天皇に、「啓す」=中宮・東宮に、「申す」=一般貴族に。敬語の「方向」が問われる頻出知識。", related:[{"id":407,"type":"対"}] },
  { id:406, word:"けいす", pos:"動サ変", meaning:"啓す。中宮・皇太子に申し上げる(中宮・東宮専用の謙譲語)", etym:"漢語「啓(けい)」+「す」。中宮(皇后)・東宮(皇太子)に対して使う謙譲語。", example:"中宮にけいす。", translation:"中宮(皇后)に申し上げる。", highlight:"けいす", source:"(作例)", trivia:"奏す(天皇)→啓す(中宮・東宮)→申す(一般)の使い分けは東大頻出。", related:[{"id":406,"type":"対"}] },
  { id:407, word:"せっしやう", pos:"名", meaning:"摂政(せっしょう)。天皇が幼少の時に代わって政務を行う最高位の官職", etym:"「摂政」=天皇の政務を摂(と)り行う。藤原氏が独占し権力の源泉とした。", example:"せっしやう・くわんぱくの御おぼえ。", translation:"摂政・関白の(帝からの)ご信頼。", highlight:"せっしやう", source:"(作例)", trivia:"摂政(幼帝の代理)と関白(成人帝の補佐)は藤原摂関政治の根幹。", related:[{"id":409,"type":"参"}] },
  { id:408, word:"くわんぱく", pos:"名", meaning:"関白(かんぱく)。天皇を補佐して政務を統括する最高位の官職", etym:"「関白」=「あづかり申す」の漢語訳。天皇に代わり万事を関(あずか)り白(もう)す。", example:"くわんぱくの御方。", translation:"関白のお方。", highlight:"くわんぱく", source:"(作例)", trivia:null, related:[{"id":408,"type":"参"}] },

<script>
// =============== SRS CORE ===============
const STORAGE_KEY = 'kogo_lexicon_v02';
const MIN = 60 * 1000;
const DAY = 24 * 60 * 60 * 1000;

// Learning steps (minutes): 1min → 10min → graduate
const LEARN_STEPS = [1, 10];
const GRADUATING_INTERVAL = 1;   // days, after last learning step with "good"
const EASY_INTERVAL = 4;          // days, "easy" from learning graduates here
const MASTERED_THRESHOLD = 21;    // days


function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}

function defaultState() {
  const cards = {};
  WORDS.forEach(w => {
    cards[w.id] = {
      phase: 'new',       // new | learning | review | mastered
      step: 0,            // index into LEARN_STEPS
      ease: 2.5,
      interval: 0,        // days (review phase)
      due: 0,             // ms timestamp
      reps: 0,
      lapses: 0,
      quizPassed: false,  // whether the most recent quiz was answered correctly
      lastReviewedAt: 0,  // ms timestamp of last review
    };
  });
  return {
    cards,
    daily: { date: todayStr(), newDone: 0, reviewDone: 0 },
    history: {},
    streak: { current: 0, longest: 0, lastDate: null },
    totalReviews: 0,
    lastShownId: null,
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s.daily?.date !== todayStr()) {
        s.daily = { date: todayStr(), newDone: 0, reviewDone: 0 };
      }
      WORDS.forEach(w => {
        if (!s.cards[w.id]) {
          s.cards[w.id] = { phase:'new', step:0, ease:2.5, interval:0, due:0, reps:0, lapses:0, quizPassed:false, lastReviewedAt:0 };
        } else {
          // Migration: handle old quizDone field
          if (s.cards[w.id].quizDone !== undefined) {
            s.cards[w.id].quizPassed = s.cards[w.id].quizDone;
            delete s.cards[w.id].quizDone;
          }
          if (s.cards[w.id].quizPassed === undefined) {
            s.cards[w.id].quizPassed = s.cards[w.id].phase !== 'new';
          }
          if (s.cards[w.id].lastReviewedAt === undefined) {
            s.cards[w.id].lastReviewedAt = 0;
          }
        }
      });
      if (!s.history) s.history = {};
      if (!s.streak) s.streak = { current: 0, longest: 0, lastDate: null };
      if (s.totalReviews == null) s.totalReviews = 0;
      return s;
    }
  } catch(e) {}
  return defaultState();
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

let state = loadState();

// Apply rating. q: 0=again 1=hard 2=good 3=easy
function applyRating(c, q) {
  const now = Date.now();

  if (c.phase === 'new' || c.phase === 'learning') {
    if (c.phase === 'new') { c.phase = 'learning'; c.step = 0; }

    if (q === 0) {
      c.step = 0;
      c.due = now + LEARN_STEPS[0] * MIN;
    } else if (q === 1) {
      // hard: stay on current step but with 1.5x delay (distinct from again)
      c.due = now + Math.round(LEARN_STEPS[c.step] * 1.5 + 1) * MIN;
    } else if (q === 2) {
      if (c.step + 1 < LEARN_STEPS.length) {
        c.step += 1;
        c.due = now + LEARN_STEPS[c.step] * MIN;
      } else {
        // graduate
        c.phase = 'review';
        c.interval = GRADUATING_INTERVAL;
        c.due = now + c.interval * DAY;
        c.reps += 1;
      }
    } else if (q === 3) {
      // easy: graduate immediately with longer interval
      c.phase = 'review';
      c.interval = EASY_INTERVAL;
      c.due = now + c.interval * DAY;
      c.reps += 1;
    }
  } else if (c.phase === 'review' || c.phase === 'mastered') {
    if (q === 0) {
      // lapse
      c.lapses += 1;
      c.ease = Math.max(1.3, c.ease - 0.2);
      c.phase = 'learning';
      c.step = 0;
      c.interval = 0;
      c.due = now + LEARN_STEPS[0] * MIN;
    } else {
      let mult;
      if (q === 1) { mult = 1.2; c.ease = Math.max(1.3, c.ease - 0.15); }
      else if (q === 2) { mult = c.ease; }
      else { mult = c.ease * 1.3; c.ease = c.ease + 0.15; }
      c.interval = Math.max(1, Math.round(c.interval * mult));
      c.due = now + c.interval * DAY;
      c.reps += 1;
      c.phase = c.interval >= MASTERED_THRESHOLD ? 'mastered' : 'review';
    }
  }
}

// Preview the next interval for display on rating buttons
function previewInterval(card, q) {
  const c = JSON.parse(JSON.stringify(card));
  applyRating(c, q);
  const diff = c.due - Date.now();
  if (diff < 60*1000) return '<1分';
  if (diff < 60*MIN) return Math.round(diff/MIN) + '分';
  if (diff < DAY) return Math.round(diff/(60*MIN)) + '時間';
  const days = Math.round(diff/DAY);
  if (days < 30) return days + '日';
  if (days < 365) return Math.round(days/30) + 'ヶ月';
  return Math.round(days/365) + '年';
}

// Pick the next card to study, honoring daily limits and anti-repeat
function pickNextCard() {
  const now = Date.now();
  const d = state.daily;

  // 1) learning cards (no daily limit, always show if due)
  const learning = WORDS
    .filter(w => state.cards[w.id].phase === 'learning' && state.cards[w.id].due <= now)
    .sort((a,b) => state.cards[a.id].due - state.cards[b.id].due);

  // 2) review cards (subject to limit)
  const canReview = d.reviewDone < settings.reviewLimit;
  const reviews = canReview ? WORDS
    .filter(w => (state.cards[w.id].phase === 'review' || state.cards[w.id].phase === 'mastered') && state.cards[w.id].due <= now)
    .sort((a,b) => state.cards[a.id].due - state.cards[b.id].due) : [];

  // 3) new cards (subject to limit)
  const canNew = d.newDone < settings.newLimit;
  const news = canNew ? WORDS.filter(w => state.cards[w.id].phase === 'new') : [];

  // Merge with priority: learning > review > new, but avoid immediate repeat
  const queue = [...learning, ...reviews, ...news];
  if (queue.length === 0) return null;

  // anti-repeat: if first is same as last shown and there's an alternative, skip to next
  if (queue.length > 1 && queue[0].id === state.lastShownId) {
    return queue[1];
  }
  return queue[0];
}

function getStats() {
  const now = Date.now();
  let newC = 0, learnC = 0, dueC = 0, masteredC = 0;
  WORDS.forEach(w => {
    const c = state.cards[w.id];
    if (c.phase === 'new') newC++;
    else if (c.phase === 'learning') learnC++;
    else if (c.phase === 'mastered') masteredC++;
    if ((c.phase === 'review' || c.phase === 'mastered') && c.due <= now) dueC++;
  });
  return { newC, learnC, dueC, masteredC };
}

  document.getElementById('stat-learn').textContent = s.learnC;

}

// =============== HISTORY / STREAK ===============
function dateKey(d) {
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}
function daysBetween(a, b) {
  const A = new Date(a.getFullYear(), a.getMonth(), a.getDate());
  const B = new Date(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((B - A) / DAY);
}

function recordReview(wasNew) {
  const today = todayStr();
  if (!state.history[today]) state.history[today] = { reviews: 0, news: 0 };
  state.history[today].reviews += 1;
  if (wasNew) state.history[today].news += 1;
  state.totalReviews += 1;

  // streak update
  const last = state.streak.lastDate;
  if (last !== today) {
    if (!last) {
      state.streak.current = 1;
    } else {
      const lastD = parseDateKey(last);
      const todayD = new Date();
      const diff = daysBetween(lastD, todayD);
      if (diff === 1) state.streak.current += 1;
      else if (diff > 1) state.streak.current = 1;
      // diff === 0 shouldn't happen since last !== today
    }
    state.streak.lastDate = today;
    if (state.streak.current > state.streak.longest) {
      state.streak.longest = state.streak.current;
    }
  }
}
function parseDateKey(k) {
  const [y, m, d] = k.split('-').map(Number);
  return new Date(y, m - 1, d);
}

// =============== AUDIO ===============
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e) { return null; }
  }
  return audioCtx;
}
function playTone(freq, duration, type, vol) {
  if (!settings.sound) return;
  const ctx = getAudioCtx();
  if (!ctx) return;
  try {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    const v = vol || 0.12;
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(v, ctx.currentTime + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration + 0.02);
  } catch(e) {}
}
function sfxFlip()  { playTone(523, 0.07, 'triangle', 0.10); }
function sfxAgain() { playTone(196, 0.20, 'sawtooth', 0.08); }

// =============== HIGHLIGHT ===============
function highlightExample(text, hl) {
  if (!hl) return escapeHtml(text);
  const idx = text.indexOf(hl);
  if (idx === -1) return escapeHtml(text);
  return escapeHtml(text.slice(0, idx)) +
    `<mark>${escapeHtml(text.slice(idx, idx + hl.length))}</mark>` +
    escapeHtml(text.slice(idx + hl.length));
}

// Render example(s) — supports ｜-separated multiple examples
function renderExamples(w) {
  const exs = w.example.split('｜');
  const trs = (w.translation || '').split('｜');
  const hls = (w.highlight || '').split('｜');
  const srcs = (w.source || '').split('｜');
  const multi = exs.length > 1;

  return exs.map((ex, i) => {
    const tr = (trs[i] || '').trim();
    const hl = (hls[i] || '').trim();
    const src = (srcs[i] || srcs[0] || '').trim();
    const label = multi ? `例${'①②③④⑤⑥'[i] || (i+1)}` : '例';
    return `
      <div class="detail${i > 0 ? ' mt-8' : ''}">
        <span class="detail-label shu">${label}</span>
        <div class="example-jp" lang="ja">${highlightExample(ex.trim(), hl)}</div>
        <div class="example-src">— 『${src}』</div>
        ${settings.showTranslation && tr ? `<div class="translation">${escapeHtml(tr)}</div>` : ''}
      </div>
    `;
  }).join('');
}
function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// =============== RELATED ===============
function relatedHtml(w) {
  if (!w.related || w.related.length === 0) return '';
  const chips = w.related.map(r => {

    if (!target) return '';

    return `<button class="chip" onclick="event.stopPropagation();openWordModal(${r.id})"><span class="chip-type ${cls}">${r.type}</span>${target.word}</button>`;
  }).join('');
  return `<div class="related-block"><span class="related-label">関連語</span>${chips}</div>`;
}

let lastFocused = null;
function trapFocus(e) {
  const modal = document.querySelector('.modal');
  if (!modal) return;
  if (e.key !== 'Tab') return;
  const focusable = modal.querySelectorAll(
    'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
  );
  if (focusable.length === 0) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  if (e.shiftKey) {
    if (document.activeElement === first) { e.preventDefault(); last.focus(); }
  } else {
    if (document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
}
function closeModal() {
  document.getElementById('modal-root').innerHTML = '';
  document.removeEventListener('keydown', modalKeyHandler);
  document.removeEventListener('keydown', trapFocus);
  if (lastFocused && document.contains(lastFocused)) {
    lastFocused.focus();
  }
  lastFocused = null;
}
function modalKeyHandler(e) {
  if (e.key === 'Escape') closeModal();
}
function activateModal() {
  document.addEventListener('keydown', modalKeyHandler);
  document.addEventListener('keydown', trapFocus);
  setTimeout(() => {

        <div class="progress-fill" style="width:${masteryPct}%;"></div>
        <div class="progress-segments">${segmentBars}</div>
      </div>
      <div class="progress-meta">
        <span><b>${s.masteredC}</b> / ${WORDS.length} 習得</span>
        <span>${masteryPct}%</span>
      </div>
      <div class="stats-sub">
        着手済み: ${studiedC} 語 (${studiedPct}%)
      </div>
    </div>
  `;

  // === Phase distribution ===
  const total = WORDS.length;
  const phasePct = (n) => total > 0 ? (n / total) * 100 : 0;
  const phaseHtml = `
    <div class="panel">
      <h2 class="panel-title">状 態 内 訳 <span class="panel-title-en">phase distribution</span></h2>
      <div class="phase-bar">
        ${s.newC > 0 ? `<div class="phase-seg new" style="flex:${phasePct(s.newC)};">${s.newC}</div>` : ''}
        ${s.learnC > 0 ? `<div class="phase-seg learning" style="flex:${phasePct(s.learnC)};">${s.learnC}</div>` : ''}
        ${(WORDS.length - s.newC - s.learnC - s.masteredC) > 0 ? `<div class="phase-seg review" style="flex:${phasePct(WORDS.length - s.newC - s.learnC - s.masteredC)};">${WORDS.length - s.newC - s.learnC - s.masteredC}</div>` : ''}
        ${s.masteredC > 0 ? `<div class="phase-seg mastered" style="flex:${phasePct(s.masteredC)};">${s.masteredC}</div>` : ''}
      </div>
      <div class="phase-legend">
        <div class="phase-legend-item"><div class="dot new"></div>新出 ${s.newC}</div>
        <div class="phase-legend-item"><div class="dot learning"></div>学習中 ${s.learnC}</div>
        <div class="phase-legend-item"><div class="dot review"></div>復習 ${WORDS.length - s.newC - s.learnC - s.masteredC}</div>
        <div class="phase-legend-item"><div class="dot mastered"></div>習得 ${s.masteredC}</div>
      </div>
    </div>
  `;

  // === Heatmap (last 13 weeks = 91 days) ===
  const HM_DAYS = 91;
  const today = new Date();
  today.setHours(0,0,0,0);
  const cells = [];
  let maxDay = 0;
  for (let i = HM_DAYS - 1; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(today.getDate() - i);
    const k = dateKey(d);
    const h = state.history[k];
    const n = h ? h.reviews : 0;
    if (n > maxDay) maxDay = n;
    cells.push({ date: d, key: k, n });
  }
  const levelOf = (n) => {
    if (n === 0) return 0;
    if (n <= 5) return 1;
    if (n <= 15) return 2;
    if (n <= 30) return 3;
    return 4;
  };
  const monthLabels = ['睦','如','弥','卯','皐','水','文','葉','長','神','霜','師'];
  const cellsHtml = cells.map(c => {
    const lv = levelOf(c.n);
    const tip = `${c.date.getMonth()+1}/${c.date.getDate()}・${c.n}回`;
    const ariaLabel = `${c.date.getMonth()+1}月${c.date.getDate()}日: ${c.n}回の復習`;
    return `<div class="hm-cell ${lv?'l'+lv:''}" data-tip="${tip}" title="${tip}" role="img" aria-label="${ariaLabel}"></div>`;
  }).join('');
  const heatmapHtml = `
    <div class="panel">
      <h2 class="panel-title">学 習 履 歴 <span class="panel-title-en">last 13 weeks</span></h2>
      <div class="heatmap">${cellsHtml}</div>
      <div class="hm-scale">
        少 <div class="hm-cell"></div>
        <div class="hm-cell l1"></div>
        <div class="hm-cell l2"></div>
        <div class="hm-cell l3"></div>
        <div class="hm-cell l4"></div>
        多
      </div>
    </div>
  `;

  // === Forecast (next 7 days due) — review/mastered only ===
  const now = Date.now();
  const buckets = Array(7).fill(0);
  WORDS.forEach(w => {
    const c = state.cards[w.id];
    if (c.phase !== 'review' && c.phase !== 'mastered') return;
    const diff = c.due - now;
    const dayIdx = Math.floor(diff / DAY);
    if (dayIdx < 0) buckets[0] += 1;
    else if (dayIdx < 7) buckets[dayIdx] += 1;
  });
  const fcMax = Math.max(...buckets, 1);
  const dayLabels = ['今日','+1','+2','+3','+4','+5','+6'];
  const fcHtml = `
    <div class="panel">
      <h2 class="panel-title">復 習 予 測 <span class="panel-title-en">next 7 days</span></h2>
      <div class="forecast">
        ${buckets.map((n, i) => `
          <div class="fc-col">
            <div class="fc-bar-wrap">
              <div class="fc-bar ${n===0?'zero':''}" style="height:${(n/fcMax)*100}%;" data-val="${n}"></div>
            </div>
            <div class="fc-label">${dayLabels[i]}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;

  // === Difficult words ===
  const studied = WORDS.filter(w => {
    const c = state.cards[w.id];
    return c.phase !== 'new' && (c.lapses > 0 || c.reps > 0);
  });
  studied.sort((a,b) => {
    const ca = state.cards[a.id], cb = state.cards[b.id];
    const sa = ca.lapses * 3 - ca.ease + (ca.reps > 0 ? ca.lapses / ca.reps : 0);
    const sb = cb.lapses * 3 - cb.ease + (cb.reps > 0 ? cb.lapses / cb.reps : 0);
    return sb - sa;
  });
  const top = studied.slice(0, 5);
  const hardHtml = `
    <div class="panel">
      <h2 class="panel-title">苦 手 な 語 <span class="panel-title-en">hardest 5</span></h2>
      ${top.length === 0 ? '<div class="stats-empty">まだデータがありません</div>' :
        '<div class="hard-list">' + top.map((w, i) => {
          const c = state.cards[w.id];
          const meaningShort = w.meaning.replace(/。.*$/,'').slice(0,22);
          const rate = c.reps > 0 ? Math.round((c.lapses / (c.reps + c.lapses)) * 100) : 0;
          return `
            <div class="hard-row" role="button" tabindex="0" onclick="openWordModal(${w.id})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openWordModal(${w.id})}" aria-label="${i+1}位 ${w.word}, 失敗 ${c.lapses}回, 失敗率 ${rate}パーセント">
              <div class="hard-rank" aria-hidden="true">${i+1}</div>
              <div>
                <div class="hard-word" lang="ja">${w.word}</div>
                <div class="hard-meaning">${meaningShort}</div>
              </div>
              <div class="hard-stat" aria-hidden="true">
                失敗 <b>${c.lapses}</b> / ${rate}%<br>
                ease ${c.ease.toFixed(2)}
              </div>
            </div>
          `;
        }).join('') + '</div>'
      }
    </div>
  `;

  // === Recent reviews (last 30) ===
  function timeAgo(ts) {
    if (!ts) return '';
    const diff = Date.now() - ts;
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return 'たった今';
    if (mins < 60) return mins + '分前';
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + '時間前';
    const days = Math.floor(hrs / 24);
    return days + '日前';
  }
  const recent = WORDS
    .filter(w => state.cards[w.id].lastReviewedAt > 0)
    .sort((a,b) => state.cards[b.id].lastReviewedAt - state.cards[a.id].lastReviewedAt)
    .slice(0, 30);
  const recentHtml = `
    <div class="panel">
      <h2 class="panel-title">最 近 の 学 習 <span class="panel-title-en">recent ${recent.length}</span></h2>
      ${recent.length === 0 ? '<div class="stats-empty">まだ学習していません</div>' :
        '<div class="recent-list">' + recent.map(w => {
          const c = state.cards[w.id];
          const meaningShort = w.meaning.replace(/[①②③④⑤⑥]/g,'').replace(/。.*$/,'').slice(0,20);
          return `
            <div class="recent-item" onclick="openWordModal(${w.id})">
              <span class="recent-word">${w.word}</span>
              <span class="recent-meaning">${meaningShort}</span>
              <span class="card-phase ${c.phase} recent-phase">${phaseLabel(c.phase)}</span>
              <span class="recent-time">${timeAgo(c.lastReviewedAt)}</span>
            </div>
          `;
        }).join('') + '</div>'
      }
    </div>
  `;

  area.innerHTML = `
    <div class="stats-wrap">
      ${streakHtml}
      ${masteryHtml}
      ${phaseHtml}
      ${fcHtml}
      ${heatmapHtml}
      ${hardHtml}
      ${recentHtml}
    </div>
  `;
}

function renderList() {
  updateStats();
  const area = document.getElementById('card-area');
  let words = WORDS.slice();

  // search filter
  if (searchQuery.trim()) {
    const q = searchQuery.trim().toLowerCase();
    words = words.filter(w =>
      w.word.toLowerCase().includes(q) ||
      w.meaning.toLowerCase().includes(q) ||
      w.pos.toLowerCase().includes(q)
    );
  }

  // phase filter
  if (listFilter !== 'all') {
    words = words.filter(w => state.cards[w.id].phase === listFilter);
  }

  // sort
  if (sortMode === 'index') {
    words.sort((a,b) => a.id - b.id);
  } else if (sortMode === 'phase') {
    words.sort((a,b) => {
      const ca = state.cards[a.id], cb = state.cards[b.id];
      const order = { learning: 0, review: 1, new: 2, mastered: 3 };
      if (order[ca.phase] !== order[cb.phase]) return order[ca.phase] - order[cb.phase];
      return ca.due - cb.due;
    });
  } else if (sortMode === 'aiueo') {
    words.sort((a,b) => a.word.localeCompare(b.word, 'ja'));
  } else if (sortMode === 'difficulty') {
    words.sort((a,b) => {
      const ca = state.cards[a.id], cb = state.cards[b.id];
      const da = ca.lapses * 2 - ca.ease;
      const db = cb.lapses * 2 - cb.ease;
      return db - da;
    });
  } else if (sortMode === 'due') {
    words.sort((a,b) => {
      const ca = state.cards[a.id], cb = state.cards[b.id];
      if (ca.phase === 'new' && cb.phase !== 'new') return 1;
      if (cb.phase === 'new' && ca.phase !== 'new') return -1;
      return ca.due - cb.due;
    });
  }

  const counts = {
    all: WORDS.length,
    new: WORDS.filter(w => state.cards[w.id].phase === 'new').length,
    learning: WORDS.filter(w => state.cards[w.id].phase === 'learning').length,
    review: WORDS.filter(w => state.cards[w.id].phase === 'review').length,
    mastered: WORDS.filter(w => state.cards[w.id].phase === 'mastered').length,
  };

  const rows = words.map(w => {
    const cs = state.cards[w.id];
    const idx = WORDS.findIndex(x => x.id === w.id) + 1;
    const meaningShort = w.meaning.replace(/。.*$/,'').slice(0,28);
    const metaText = cs.phase === 'new' ? 'new' : `i${cs.interval} · ${fmtDue(cs)}`;
    const phaseText = phaseLabel(cs.phase);
    return `
      <div class="row" role="button" tabindex="0" onclick="openWordModal(${w.id})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openWordModal(${w.id})}" aria-label="${w.word}, ${meaningShort}, 状態 ${phaseText}">
        <div class="row-num" aria-hidden="true">${String(idx).padStart(2,'0')}</div>
        <div>
          <div class="row-word" lang="ja">${w.word}</div>
          <div class="row-meaning">${meaningShort}</div>
        </div>
        <div class="row-status">
          <div class="row-meta" aria-hidden="true">${metaText}</div>
          <div class="dot ${cs.phase}" aria-hidden="true"></div>
        </div>
      </div>`;
  }).join('');

  // Check if list shell already exists (to preserve search input during IME)
  const existingRows = area.querySelector('#list-rows');
  if (existingRows) {
    // Only update rows + filter counts — don't touch search input
    existingRows.innerHTML = rows || '<div class="no-results">該当する単語がありません</div>';
    // Update filter button counts
    const filterBtns = area.querySelectorAll('.list-filter button');
    const countVals = [counts.all, counts.new, counts.learning, counts.review, counts.mastered];
    const countKeys = ['all', 'new', 'learning', 'review', 'mastered'];
    filterBtns.forEach((btn, i) => {
      btn.textContent = ['すべて','新出','学習中','復習','習得'][i] + ' ' + countVals[i];
      btn.className = listFilter === countKeys[i] ? 'active' : '';
      btn.setAttribute('aria-pressed', listFilter === countKeys[i]);
    });
    return;
  }

  // First render: create full list shell
  area.innerHTML = `
    <div class="list">
      <div class="controls">
        <label class="sr-only" for="search-input">単語検索</label>
        <input id="search-input" class="search-input" type="search" placeholder="検索 (語・意味・品詞)" value="${searchQuery.replace(/"/g,'&quot;')}" oninput="onSearchInput(this)" oncompositionstart="searchComposing=true" oncompositionend="onSearchCompositionEnd(this)" aria-label="単語を検索">
        <label class="sr-only" for="sort-select">並び替え</label>
        <select id="sort-select" class="sort-select" onchange="setSort(this.value)" aria-label="並び替え">
          <option value="index" ${sortMode==='index'?'selected':''}>収録順</option>
          <option value="aiueo" ${sortMode==='aiueo'?'selected':''}>五十音順</option>
          <option value="phase" ${sortMode==='phase'?'selected':''}>状態順</option>
          <option value="due" ${sortMode==='due'?'selected':''}>期限順</option>
          <option value="difficulty" ${sortMode==='difficulty'?'selected':''}>難易度順</option>
        </select>
      </div>
      <div class="list-filter" role="group" aria-label="状態フィルター">
        <button class="${listFilter==='all'?'active':''}" onclick="setFilter('all')" aria-pressed="${listFilter==='all'}" type="button">すべて ${counts.all}</button>
        <button class="${listFilter==='new'?'active':''}" onclick="setFilter('new')" aria-pressed="${listFilter==='new'}" type="button">新出 ${counts.new}</button>
        <button class="${listFilter==='learning'?'active':''}" onclick="setFilter('learning')" aria-pressed="${listFilter==='learning'}" type="button">学習中 ${counts.learning}</button>
        <button class="${listFilter==='review'?'active':''}" onclick="setFilter('review')" aria-pressed="${listFilter==='review'}" type="button">復習 ${counts.review}</button>
        <button class="${listFilter==='mastered'?'active':''}" onclick="setFilter('mastered')" aria-pressed="${listFilter==='mastered'}" type="button">習得 ${counts.mastered}</button>
      </div>
      <div id="list-rows">${rows || '<div class="no-results">該当する単語がありません</div>'}</div>
      <div class="legend">
        <div class="legend-item"><div class="dot new"></div>新出</div>
        <div class="legend-item"><div class="dot learning"></div>学習中</div>
        <div class="legend-item"><div class="dot review"></div>復習</div>
        <div class="legend-item"><div class="dot mastered"></div>習得</div>
      </div>
    </div>
  `;

  if (searchFocused) {
    const inp = area.querySelector('.search-input');
    if (inp) {
      inp.focus();
      const len = inp.value.length;
      inp.setSelectionRange(len, len);
    }
  }
}

let searchFocused = false;
let searchDebounce = null;
let searchComposing = false;
function onSearchInput(el) {
  if (searchComposing) return;
  searchQuery = el.value;
  searchFocused = true;
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => { renderList(); }, 300);
}
function onSearchCompositionEnd(el) {
  searchComposing = false;
  searchQuery = el.value;
  searchFocused = true;
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => { renderList(); }, 50);
}
function setSort(v) { sortMode = v; renderList(); }

  if (currentView === 'list') { renderList(); return; }
  if (currentView === 'stats') { renderStats(); return; }
  searchFocused = false;
  updateStats();
  const area = document.getElementById('card-area');

  if (!currentCard) {
    currentCard = pickNextCard();
    currentDirection = pickDirection();

  }

  if (!currentCard) {
    const s = getStats();
    const d = state.daily;
    const msg = (d.newDone >= settings.newLimit && s.newC > 0)
      ? '本日の新出上限に到達しました。'

// =============== FIRST-ENCOUNTER QUIZ ===============
let quizState = null; // { word, options, correctIdx, answeredIdx, isCorrect }

function shortenMeaning(m) {
  let s = m.replace(/。\s*\(.*?\)\s*$/, '');
  s = s.replace(/。\s*\(.*?\)\s*$/, '');
  if (s.length > 38) s = s.slice(0, 36) + '…';
  return s;
}

// Extract keywords for similarity check
function meaningKeywords(m) {
  return m.replace(/[①②③④⑤⑥()（）「」〜]/g, '')
    .split(/[・、。\s\/]+/)
    .map(k => k.replace(/だ$|な$|する$|い$|を伴って$|の$/,'').trim())
    .filter(k => k.length >= 2);
}

// Check if two meanings share any keyword
function meaningOverlaps(a, b) {
  const kwA = meaningKeywords(a);
  const kwB = meaningKeywords(b);
  return kwA.some(ka => kwB.some(kb =>
    ka === kb || (ka.length >= 3 && kb.includes(ka)) || (kb.length >= 3 && ka.includes(kb))
  ));
}

function buildQuizOptions(targetWord) {
  const correctMeaning = shortenMeaning(targetWord.meaning);
  // Pick 3 distractors: prefer same pos, but exclude words with overlapping meanings
  const samePos = WORDS.filter(w => w.id !== targetWord.id && w.pos === targetWord.pos);
  const others  = WORDS.filter(w => w.id !== targetWord.id && w.pos !== targetWord.pos);
  const pool = [...shuffle(samePos), ...shuffle(others)];
  const seenMeanings = new Set([correctMeaning]);
  const distractors = [];
  for (const w of pool) {
    const m = shortenMeaning(w.meaning);
    if (seenMeanings.has(m)) continue;
    // Skip if meaning shares keywords with correct answer
    if (meaningOverlaps(correctMeaning, m)) continue;
    seenMeanings.add(m);
    distractors.push(m);
    if (distractors.length === 3) break;
  }
  const options = shuffle([correctMeaning, ...distractors]);
  return { options, correctIdx: options.indexOf(correctMeaning) };
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderQuizFace() {
  const area = document.getElementById('card-area');
  const w = currentCard;
  const c = state.cards[w.id];

  if (!quizState || quizState.wordId !== w.id) {
    const built = buildQuizOptions(w);
    quizState = {
      wordId: w.id,
      options: built.options,
      correctIdx: built.correctIdx,
      answeredIdx: null,
      isCorrect: null,
      dontKnow: false,
    };
  }

  const answered = quizState.answeredIdx !== null || quizState.dontKnow;

  const optsHtml = quizState.options.map((opt, i) => {
    let cls = 'quiz-opt';
    if (answered) {
      if (i === quizState.correctIdx) cls += ' correct';
      else if (i === quizState.answeredIdx) cls += ' wrong';
    }
    return `<button class="${cls}" onclick="answerQuiz(${i})" ${answered?'disabled':''} type="button">
      <span class="quiz-opt-num">${'①②③④'[i]}</span><span>${opt}</span>
    </button>`;
  }).join('');

  const dontKnowHtml = answered ? '' : `
    <button class="quiz-opt dontknow" onclick="answerQuiz(-1)" type="button">わからない</button>
  `;

  let resultHtml = '';
  let continueHtml = '';
  if (answered) {
    if (quizState.isCorrect) {
      resultHtml = `<div class="quiz-result">正解。「${w.word}」=${shortenMeaning(w.meaning)}</div>`;
    } else if (quizState.dontKnow) {
      resultHtml = `<div class="quiz-result wrong">「${w.word}」=${shortenMeaning(w.meaning)}<br><small class="text-muted">焦らずいきましょう</small></div>`;
    } else {
      resultHtml = `<div class="quiz-result wrong">不正解。正しくは「${w.word}」=${shortenMeaning(w.meaning)}</div>`;
    }
    const btnLabel = (!quizState.isCorrect && !settings.showDetailOnWrong) ? '次 へ' : '詳 細 を 見 る';
    continueHtml = `<button class="quiz-continue" onclick="finishQuiz()" type="button">${btnLabel}</button>`;
  }

  area.innerHTML = `
    <div class="card">
      ${cardHeaderHtml(c, wordIdx(w), {badge: c.phase === 'new' ? '初出 4択' : '再確認 4択', mb8: true})}
      <div class="word-pos">${w.pos}</div>
      <div class="word-jp">${w.word}</div>
      <div class="quiz-prompt">意 味 は ど れ か</div>
      <div class="quiz-options">
        ${optsHtml}
        ${dontKnowHtml}
      </div>
      ${resultHtml}
      ${continueHtml}
    </div>
  `;
}

function answerQuiz(idx) {
  if (!quizState) return;
  if (idx === -1) {
    quizState.dontKnow = true;
    quizState.isCorrect = false;
    sfxAgain();
  } else {
    quizState.answeredIdx = idx;
    quizState.isCorrect = (idx === quizState.correctIdx);
    if (quizState.isCorrect) sfxGood(); else sfxAgain();
  }
  renderQuizFace();
}

function finishQuiz() {
  if (!currentCard || !quizState) return;
  const c = state.cards[currentCard.id];
  const wasNew = c.phase === 'new';
  const wasReview = c.phase === 'review' || c.phase === 'mastered';
  const wasCorrect = !!quizState.isCorrect;
  c.quizPassed = wasCorrect;
  const q = wasCorrect ? 2 : 0;
  applyRating(c, q);
  c.lastReviewedAt = Date.now();
  state.lastShownId = currentCard.id;
  if (wasNew) state.daily.newDone += 1;
  else if (wasReview) state.daily.reviewDone += 1;
  recordReview(wasNew);
  saveState();
  quizState = null;

  if (!wasCorrect && !settings.showDetailOnWrong) {
    currentCard = null;
    cardStage = 0;
    render();
    return;
  }

  renderQuizDetail();
}

function renderQuizDetail() {
  const area = document.getElementById('card-area');
  const w = currentCard;
  const c = state.cards[w.id];

  area.innerHTML = `
    <div class="stage-card" id="quiz-detail">
      ${cardHeaderHtml(c, wordIdx(w), {})}
      <div class="word-pos">${w.pos}</div>
      <div class="word-jp">${w.word}</div>
      <div class="meaning-block mt-14">
        <div class="meaning-label">意　味</div>
        <div class="meaning-text">${w.meaning}</div>
      </div>
      <div class="mt-14">${wordInfoHtml(w)}</div>
      <button class="quiz-continue mt-auto" onclick="advanceFromDetail()" type="button">次 へ</button>
    </div>
  `;
}

function advanceFromDetail() {
  currentCard = null;
  cardStage = 0;
  render();
}


// Stage-based card state (Lexicon-style)
let cardStage = 0; // 0=word only, 1=full reveal
const STAGE_COUNT = 2;

function renderCardFace() {
  const area = document.getElementById('card-area');
  const w = currentCard;
  const c = state.cards[w.id];

  if (!c.quizPassed) {
    renderQuizFace();
    return;
  }

  const dirTag = currentDirection === 'word2meaning' ? 'word → meaning' : 'meaning → word';
  const fullyOpen = cardStage >= 1;

  // Stage progress dots (2 dots)
  const dots = Array.from({length: STAGE_COUNT}, (_, i) =>
    `<div class="stage-dot ${i < cardStage ? 'passed' : i === cardStage ? 'active' : ''}"></div>`
  ).join('');

  // === Stage 0: prompt ===
  let stage0;
  if (currentDirection === 'word2meaning') {
    stage0 = `
      <div class="stage-section">
        <div class="word-pos">${w.pos}</div>
        <div class="word-jp">${w.word}</div>
      </div>
    `;
  } else {
    stage0 = `
      <div class="stage-section">
        <div class="word-pos">${w.pos}</div>
        <div class="meaning-prompt">${w.meaning}</div>
      </div>
    `;
  }

  // === Stage 1: full reveal ===
  let stage1 = '';
  if (cardStage >= 1) {
    let revealTop;
    if (currentDirection === 'word2meaning') {
      revealTop = `
        <div class="meaning-block">
          <div class="meaning-label">意　味</div>
          <div class="meaning-text">${w.meaning}</div>
        </div>
      `;
    } else {
      revealTop = `
        <div class="text-center">
          <div class="word-back">${w.word}</div>
          <div class="word-back-pos">${w.pos}</div>
        </div>
      `;
    }

    stage1 = `
      <div class="stage-section mt-14">
        ${revealTop}
        <div class="mt-14">${wordInfoHtml(w)}</div>
      </div>
    `;
  }

  // Footer
  let footer;
  if (!fullyOpen) {
    footer = `<div class="tap-hint mt-auto">tap / space to reveal</div>`;
  } else {
    footer = `
      <div class="ratings two-btn mt-auto" role="group" aria-label="評価">
        <button class="rate-btn" data-q="0" onclick="rate(0)" aria-label="あし(忘れた)、次回は${previewInterval(c,0)}後" type="button"><span class="jp" aria-hidden="true">あし</span><span class="interval" aria-hidden="true">${previewInterval(c,0)}</span></button>
        <button class="rate-btn" data-q="2" onclick="rate(2)" aria-label="よし、次回は${previewInterval(c,2)}後" type="button"><span class="jp" aria-hidden="true">よし</span><span class="interval" aria-hidden="true">${previewInterval(c,2)}</span></button>
      </div>
    `;
  }

  area.innerHTML = `
    <div class="stage-card" id="stage-card">
      <span class="swipe-indicator left" id="swipe-left">あし</span>
      <span class="swipe-indicator right" id="swipe-right">よし</span>
      ${cardHeaderHtml(c, wordIdx(w), {dirTag})}
      <div class="stage-progress" aria-hidden="true">${dots}</div>
      ${stage0}
      ${stage1}
      ${footer}
    </div>
  `;

  attachStageInteractions();
}

let swipeAbort = null; // AbortController for document-level swipe listeners

function attachStageInteractions() {
  const card = document.getElementById('stage-card');
  if (!card) return;

  // Clean up previous document-level listeners
  if (swipeAbort) { swipeAbort.abort(); swipeAbort = null; }

  // Tap-to-advance (only on the card surface, not on rate buttons / chips)
  card.addEventListener('click', (e) => {
    if (e.target.closest('.rate-btn')) return;
    if (e.target.closest('.chip')) return;
    if (cardStage < STAGE_COUNT - 1) {
      advanceStage();
    }
  });

  // Swipe handling (only when fully open)
  if (cardStage < STAGE_COUNT - 1) return;

  swipeAbort = new AbortController();
  const signal = swipeAbort.signal;

  let startX = 0, startY = 0, currentX = 0, dragging = false;
  const SWIPE_THRESHOLD = 90;

  function onStart(e) {
    if (e.target.closest('.rate-btn') || e.target.closest('.chip')) return;
    const t = e.touches ? e.touches[0] : e;
    startX = t.clientX;
    startY = t.clientY;
    currentX = 0;
    dragging = true;
    card.classList.add('dragging');
  }
  function onMove(e) {
    if (!dragging) return;
    const t = e.touches ? e.touches[0] : e;
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;
    if (Math.abs(dy) > Math.abs(dx) * 1.4 && Math.abs(dy) > 10) {
      dragging = false;
      card.classList.remove('dragging');
      card.style.transform = '';
      const sl = document.getElementById('swipe-left');
      const sr = document.getElementById('swipe-right');
      if (sl) sl.classList.remove('show');
      if (sr) sr.classList.remove('show');
      return;
    }
    if (e.cancelable && Math.abs(dx) > 8) e.preventDefault();
    currentX = dx;
    const rot = dx * 0.05;
    card.style.transform = `translateX(${dx}px) rotate(${rot}deg)`;
    const sl = document.getElementById('swipe-left');
    const sr = document.getElementById('swipe-right');
    if (sl) sl.classList.toggle('show', dx < -30);
    if (sr) sr.classList.toggle('show', dx > 30);
  }
  function onEnd() {
    if (!dragging) return;
    dragging = false;
    card.classList.remove('dragging');
    if (currentX < -SWIPE_THRESHOLD) {
      card.classList.add('swipe-left');
      setTimeout(() => rate(0), 180);
    } else if (currentX > SWIPE_THRESHOLD) {
      card.classList.add('swipe-right');
      setTimeout(() => rate(2), 180);
    } else {
      card.style.transform = '';
      const sl = document.getElementById('swipe-left');
      const sr = document.getElementById('swipe-right');
      if (sl) sl.classList.remove('show');
      if (sr) sr.classList.remove('show');
    }
  }

  card.addEventListener('touchstart', onStart, { passive: true });
  card.addEventListener('touchmove', onMove, { passive: false });
  card.addEventListener('touchend', onEnd);
  card.addEventListener('mousedown', onStart);
  document.addEventListener('mousemove', onMove, { signal });
  document.addEventListener('mouseup', onEnd, { signal });
}

function advanceStage() {
  if (cardStage >= STAGE_COUNT - 1) return;
  cardStage += 1;
  sfxFlip();
  renderCardFace();
}

function rate(q) {
  if (!currentCard) return;
  const c = state.cards[currentCard.id];
  const wasNew = c.phase === 'new';
  const wasReview = c.phase === 'review' || c.phase === 'mastered';

  if (q === 0) sfxAgain();
  else if (q === 1) sfxHard();
  else if (q === 2) sfxGood();
  else if (q === 3) sfxEasy();

  applyRating(c, q);
  if (q === 0) c.quizPassed = false;
  c.lastReviewedAt = Date.now();
  state.lastShownId = currentCard.id;

  if (wasNew) state.daily.newDone += 1;
  else if (wasReview) state.daily.reviewDone += 1;

  recordReview(wasNew);

  saveState();
  currentCard = null;
  render();
}

function resetProgress() {
  if (!confirm('学習履歴をすべてリセットしますか?')) return;
  localStorage.removeItem(STORAGE_KEY);
  state = defaultState();
  render();
}

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
  if (document.querySelector('.modal-overlay')) return;

  // Tab arrow navigation when focus is on a tab
  if (e.target.getAttribute('role') === 'tab') {
    const tabs = ['tab-study','tab-list','tab-stats'];
    const idx = tabs.indexOf(e.target.id);
    if (idx === -1) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      e.preventDefault();
      const next = e.key === 'ArrowRight' ? (idx + 1) % tabs.length : (idx - 1 + tabs.length) % tabs.length;
      const view = next === 0 ? 'study' : next === 1 ? 'list' : 'stats';
      switchView(view);
      document.getElementById(tabs[next]).focus();
      return;
    }
    if (e.key === 'Home') { e.preventDefault(); switchView('study'); document.getElementById('tab-study').focus(); return; }
    if (e.key === 'End')  { e.preventDefault(); switchView('stats'); document.getElementById('tab-stats').focus(); return; }
  }

  if (currentView !== 'study') return;
  if (!currentCard) return;
  if (cardStage < 1) {
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); advanceStage(); }
  } else {
    if (e.key === '1') rate(0);
    else if (e.key === '2') rate(2);
  }
});

loadTheme();
render();
</script>
</body>
