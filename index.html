  { id:334, word:"さすがに", pos:"副", meaning:"そうはいっても・やはり・さすがに", etym:"「然(さ)すがに」=「そう」+「すがに(=でありつつも)」。前言と矛盾する気持ちを表す。", example:"さすがに心細し。", translation:"そうはいっても(やはり)心細い。", highlight:"さすがに", source:"源氏物語", trivia:null, related:[{id:333,type:"参"},{id:543,type:"類"}] },
  { id:335, word:"しひて", pos:"副", meaning:"無理に・強いて・あえて", etym:"「強(し)ひて」。動詞「しふ(強いる)」の連用形+接続助詞「て」。", example:"しひて言はせければ。", translation:"無理に言わせたところ。", highlight:"しひて", source:"竹取物語", trivia:null, related:[{id:522,type:"類"},{id:339,type:"類"},{id:483,type:"類"},{id:484,type:"類"}] },
  { id:336, word:"さだめて", pos:"副", meaning:"きっと・必ず・間違いなく", etym:"「定(さだ)めて」。動詞「定む」の連用形+「て」。確信を表す。", example:"さだめて思ひしことなれど。", translation:"きっとそうなると思っていたことだが。", highlight:"さだめて", source:"源氏物語", trivia:null, related:[{id:337,type:"参"}] },
  { id:337, word:"おのおの", pos:"副・名", meaning:"めいめい・それぞれ・各自", etym:"「己(おの)+己(おの)」の重ね。一人一人をそれぞれ指す。", example:"おのおの立ち帰りぬ。", translation:"めいめい引き返した。", highlight:"おのおの", source:"竹取物語", trivia:null, related:[{id:336,type:"参"}] },
  { id:338, word:"さながら", pos:"副", meaning:"①そのまま・全部 ②まるで〜のように", etym:"「然(さ)+ながら」=そのままの状態で。全体を保った状態を表す。", example:"都も春のけしきさながら残れり。｜さながら夢のごとし。", translation:"都も春の景色がそのまま残っている。｜そっくりそのまま夢のようだ。", highlight:"さながら｜さながら", source:"古今集｜平家物語", trivia:null, related:[{id:57,type:"参"}] },
  { id:339, word:"ひたすら", pos:"副・形動", meaning:"ひたすら・もっぱら・ただただ", etym:"「直(ひた)+すら(=ずっと)」。一つのことに集中する様。", example:"ひたすら出家の心深くなりゆく。", translation:"ひたすら出家の心が深まっていく。", highlight:"ひたすら", source:"源氏物語", trivia:null, related:[{id:335,type:"類"}] },
  { id:340, word:"さま", pos:"名", meaning:"①様子・姿 ②方角・方面 ③身分 ④方法・やり方", etym:"「様(さま)」。外に現れた形・様子を広く指す最基本語。", example:"いとよきさまなり。｜東のさまへ行く。｜さまことなる人なり。｜さまざまにたばかりける。", translation:"たいそうよい様子だ。｜東の方角へ行く。｜普通でない(特別な)人だ。｜さまざまに謀った。", highlight:"さま｜さま｜さま｜さま", source:"源氏物語｜伊勢物語｜源氏物語｜今昔物語集", trivia:null, related:[{id:104,type:"類"},{id:105,type:"類"}] },
  { id:341, word:"かたち", pos:"名", meaning:"容貌・顔立ち・姿形", etym:"「形(かたち)」。古文では「顔の美醜」を中心に指すことが多い。", example:"かたちいとうつくし。", translation:"容貌がとても美しい。", highlight:"かたち", source:"竹取物語", trivia:null, related:[{id:358,type:"類"},{id:476,type:"参"}] },
  { id:342, word:"なさけ", pos:"名", meaning:"①情愛・思いやり ②風流心・情趣を解する心", etym:"「情(なさけ)」。もののあはれを感じる心から、恋愛の情、人への思いやりまで広い。", example:"なさけ深き人のこころ。｜なさけなき御心かな。", translation:"情趣を解する人の心。｜薄情なお心よ。", highlight:"なさけ｜なさけ", source:"源氏物語｜源氏物語", trivia:null, related:[{id:1,type:"参"},{id:202,type:"類"}] },
  { id:343, word:"おり", pos:"名", meaning:"時・場合・折", etym:"「折(おり)」。時間の流れの中の一点・一区切りを指す。", example:"よきをりを待ちて申すべき。", translation:"よい機会を待って申し上げるべきだ。", highlight:"をり", source:"徒然草", trivia:null, related:[{id:541,type:"類"}] },
  { id:344, word:"つね", pos:"名・形動", meaning:"普通・いつも・日常", etym:"「常(つね)」。変わらず続く日常の状態。「例(つね)ならず」=いつもと違う→病気。", example:"つねの御ありさまにもあらず。", translation:"いつものご様子でもなく。", highlight:"つねの", source:"源氏物語", trivia:"「例ならず」は病気を婉曲に表す定型表現。", related:[{id:21,type:"類"},{id:549,type:"類"}] },
  { id:345, word:"なごり", pos:"名", meaning:"名残・余韻・別れの後の寂しさ", etym:"「波残(なごり)」=波が引いた後に残るもの。転じて過ぎ去った事柄の余韻。", example:"なごり惜しうおぼさるる。", translation:"別れが惜しくお思いになる。", highlight:"なごり", source:"源氏物語", trivia:null, related:[{id:190,type:"参"},{id:202,type:"参"}] },
  { id:346, word:"されど", pos:"接続", meaning:"しかし・けれども", etym:"「然(さ)れど」=「そうであるけれど」の縮約。逆接の接続詞。", example:"されど、なほおぼつかなし。", translation:"しかしながら、やはり気がかりだ。", highlight:"されど", source:"源氏物語", trivia:null, related:[{id:164,type:"類"},{id:231,type:"類"},{id:232,type:"類"},{id:347,type:"類"},{id:348,type:"類"},{id:364,type:"類"},{id:365,type:"類"},{id:401,type:"類"},{id:403,type:"類"},{id:383,type:"類"}] },
  { id:347, word:"されば", pos:"接続", meaning:"①だから・それゆえ ②ところで", etym:"「然(さ)れば」=「そうであるから」。順接の接続詞。話題転換にも。", example:"されば言はむかたなし。｜されば、かくなりにけり。", translation:"だから言いようがない。｜それだから、このようになってしまった。", highlight:"されば｜されば", source:"徒然草｜伊勢物語", trivia:null, related:[{id:164,type:"類"},{id:231,type:"類"},{id:232,type:"類"},{id:346,type:"類"},{id:348,type:"類"},{id:364,type:"類"},{id:365,type:"類"},{id:401,type:"類"},{id:403,type:"類"},{id:383,type:"類"}] },
  { id:348, word:"さるは", pos:"接続", meaning:"そうはいうものの・実は", etym:"「然(さ)るは」=「そうではあるが、実情は」。補足・逆接的な接続詞。", example:"さるは、よき人なりけり。", translation:"実は、立派な人だったのだ。", highlight:"さるは", source:"徒然草", trivia:null, related:[{id:164,type:"類"},{id:231,type:"類"},{id:232,type:"類"},{id:346,type:"類"},{id:347,type:"類"},{id:364,type:"類"},{id:365,type:"類"},{id:401,type:"類"},{id:403,type:"類"},{id:383,type:"類"},{id:545,type:"類"}] },
  { id:349, word:"おこす", pos:"動サ下二", meaning:"①寄こす・送ってくる ②起こす", etym:"「遣(お)こす」。こちらへ向けて送る意。手紙・使い・贈り物を寄こす場面で頻出。", example:"御文おこせたまひたり。｜風をおこす雲の動き。", translation:"お手紙をよこしてくださった。｜風を起こす雲の動き。", highlight:"おこせ｜おこす", source:"源氏物語｜枕草子", trivia:null, related:[{id:315,type:"類"}] },
  { id:350, word:"おくる", pos:"動ラ下二", meaning:"①先立たれる・取り残される ②遅れる", etym:"「後(おく)る」。先に去った人の後に残される意。現代語「送る」とは異なる。", example:"人におくれて泣き暮らす。｜時においていかれたるやう。", translation:"人に先立たれて泣き暮らす。｜時勢に取り残されたよう。", highlight:"おくれ｜おい", source:"源氏物語｜徒然草", trivia:"現代語「送る」の意味はない。「死別で取り残される」が頻出義。", related:[{id:140,type:"参"}] },
  { id:351, word:"わきまふ", pos:"動ハ下二", meaning:"区別する・判断する・わきまえる", etym:"「弁(わきま)ふ」。物事の違いを識別し、適切に判断する。", example:"ものの筋をわきまへぬ人。", translation:"物事の道理をわきまえない人。", highlight:"わきまへ", source:"徒然草", trivia:null, related:[{id:115,type:"類"}] },
  { id:352, word:"うしなふ", pos:"動ハ四", meaning:"失う・なくす・殺す", etym:"「失(うしな)ふ」。大切なものを失う意。人を殺す意にも用いる。", example:"親をうしなひて後。", translation:"親を亡くした後。", highlight:"うしなひ", source:"源氏物語", trivia:null, related:[{id:500,type:"参"}] },
  { id:353, word:"くまなし", pos:"形ク", meaning:"隈なく明るい・曇りがない・欠点がない", etym:"「隈(くま)+無し」=暗い隅がない。月の光が隅々まで届く様子によく用いる。", example:"くまなき月の光。", translation:"曇りなく輝く月の光。", highlight:"くまなき", source:"源氏物語", trivia:null, related:[{id:123,type:"参"}] },
  { id:354, word:"あはつけし", pos:"形ク", meaning:"軽々しい・浅はかだ・落ち着きがない", etym:"「淡(あは)つけし」=薄っぺらい感じ→軽率だ。「あわ(慌)てる」とは別語。", example:"あはつけき御ふるまひ。", translation:"軽率なご行動。", highlight:"あはつけき", source:"源氏物語", trivia:"「あはつけき」=軽率な・落ち着きのない。言動が軽くて信用できない様子。", related:[{id:39,type:"類"},{id:267,type:"類"}] },
  { id:355, word:"すくよかなり", pos:"形動ナリ", meaning:"しっかりしている・頑丈だ・こわばっている", etym:"「健(すく)やかなり」。身体・精神の強さ。ただし古文では「風情がない」の否定的ニュアンスも。", example:"すくよかなる御心。", translation:"しっかりした(頑固な)お心。", highlight:"すくよかなる", source:"源氏物語", trivia:null, related:[{id:245,type:"参"}] },
  { id:356, word:"ことさらなり", pos:"形動ナリ", meaning:"わざとらしい・故意だ・特別だ", etym:"「殊更(ことさら)なり」=「殊(こと)+更(さら)」。意図的にそうする様。", example:"ことさらに言ひ出だして。", translation:"わざわざ言い出して。", highlight:"ことさらに", source:"徒然草", trivia:null, related:[{id:464,type:"類"}] },
  { id:357, word:"おとなげなし", pos:"形ク", meaning:"大人げない・思慮がない・未熟だ", etym:"「大人(おとな)+げ(様子)+無し」。分別ある大人らしさがないこと。", example:"おとなげなくのみふるまふ。", translation:"大人げなくばかりふるまう。", highlight:"おとなげなく", source:"源氏物語", trivia:null, related:[{id:245,type:"類"}] },
  { id:358, word:"すがた", pos:"名", meaning:"姿・容姿・ありさま", etym:"「姿(すがた)」。外から見える全体の形。衣装を含む見た目の印象。", example:"いとめでたきすがた。", translation:"とても素晴らしいお姿。", highlight:"すがた", source:"源氏物語", trivia:null, related:[{id:341,type:"類"},{id:476,type:"参"}] },
  { id:359, word:"かぎり", pos:"名", meaning:"①限度・限り ②最期・最後 ③できるだけ", etym:"「限(かぎ)り」。範囲の端。「かぎりなし」=際限がない。「今をかぎり」=これを最後に。", example:"かぎりなく美しき姫君。｜命のかぎりを尽くして。｜力のかぎりを尽くして。", translation:"限りなく美しい姫君。｜命の限りを尽くして。｜力の限りを尽くして。", highlight:"かぎり｜かぎり｜かぎり", source:"竹取物語｜源氏物語｜今昔物語集", trivia:null, related:[{id:307,type:"参"}] },
  { id:360, word:"かたみ", pos:"名", meaning:"形見・思い出の品", etym:"「形見(かたみ)」。亡き人や別れた人を偲ぶよすがとなる品物。", example:"かたみとて残しおきし形見。", translation:"形見として残しておいた品。", highlight:"かたみ", source:"古今集", trivia:null, related:[{id:202,type:"参"},{id:529,type:"参"}] },
  { id:361, word:"のち", pos:"名", meaning:"後・将来・来世", etym:"「後(のち)」。時間的な後方。仏教的文脈では「来世」の意にも。", example:"のちの世の中をも思ひやれ。", translation:"来世のことも想像しなさい。", highlight:"のちの世", source:"源氏物語", trivia:null, related:[{id:206,type:"参"}] },
  { id:362, word:"はじめ", pos:"名", meaning:"最初・初め・はじめとして", etym:"「始(はじ)め」。物事の起点。「〜をはじめ(として)」=〜を筆頭に。", example:"国のはじめより書き置かれたる。", translation:"国の初めから書き置かれた。", highlight:"はじめ", source:"土佐日記", trivia:null, related:[{id:472,type:"参"},{id:103,type:"類"}] },
  { id:363, word:"たぐひ", pos:"名", meaning:"類・同類・匹敵するもの", etym:"「類(たぐひ)」。同じ種類に属するもの。「たぐひなし」=比類がない。", example:"たぐひなき御さまかな。", translation:"比類のないお姿だなあ。", highlight:"たぐひ", source:"源氏物語", trivia:null, related:[{id:414,type:"参"}] },
  { id:364, word:"しかるに", pos:"接続", meaning:"ところが・しかしながら", etym:"「然(しか)るに」=「そうであるのに」。予想に反する事態を導く逆接。", example:"しかるに、思ひの外なることにて。｜しかるに、世は変はりにけり。", translation:"ところが、思いの外のことで。｜ところが、世の中は変わってしまった。", highlight:"しかるに｜しかるに", source:"源氏物語｜平家物語", trivia:null, related:[{id:164,type:"類"},{id:231,type:"類"},{id:232,type:"類"},{id:346,type:"類"},{id:347,type:"類"},{id:348,type:"類"},{id:365,type:"類"},{id:401,type:"類"},{id:403,type:"類"},{id:383,type:"類"}] },
  { id:365, word:"さても", pos:"接続", meaning:"それにしても・そうはいっても・ところで", etym:"「さて+も」。先行する事態を受けつつ、感慨や話題転換を表す。", example:"さても、いかがし給ふ。｜さても、やがて帰りにき。", translation:"ところで、どうなさるのか。｜それにしてもまあ、すぐに帰ってしまった。", highlight:"さても｜さても", source:"源氏物語｜徒然草", trivia:null, related:[{id:164,type:"類"},{id:231,type:"類"},{id:232,type:"類"},{id:346,type:"類"},{id:347,type:"類"},{id:348,type:"類"},{id:364,type:"類"},{id:401,type:"類"},{id:403,type:"類"},{id:383,type:"類"}] },
  { id:366, word:"けしからず", pos:"連語", meaning:"けしからん・不届きだ・普通でない", etym:"「怪(け)しからず」。「けし」=異様な、の否定形だが、「異様だ」の意味で使う。", example:"けしからぬことのたまふ。", translation:"不届きなことをおっしゃる。", highlight:"けしからぬ", source:"源氏物語", trivia:null, related:[{id:265,type:"類"}] },
  { id:367, word:"まほし", pos:"助動", meaning:"〜たい・〜してほしい(希望)", etym:"助動詞「まほし」。未然形接続。話し手の希望を表す。「あらまほし」は「ありたい」。", example:"見まほしき花の色かな。｜いかで参らまほしき。", translation:"見たいと思う花の色よ。｜なんとかして参上したい。", highlight:"まほし｜まほし", source:"源氏物語｜源氏物語", trivia:"「ばや」(自己の希望)・「なむ」(他者への希望)と使い分ける。", related:[{id:46,type:"類"}] },
  { id:368, word:"たし", pos:"助動", meaning:"〜たい(希望)", etym:"助動詞「たし」。連用形接続。「まほし」と同義だが、中世以降より一般化。", example:"都に帰り行きたし。｜花見に行きたし。", translation:"都に帰って行きたい。｜花見に行きたい。", highlight:"行きたし｜行きたし", source:"土佐日記｜(作例)", trivia:"「まほし」が雅語、「たし」がやや日常語。", related:[{id:221,type:"類"}] },
  { id:369, word:"ばや", pos:"終助", meaning:"〜したいなあ(自己の願望)", etym:"終助詞「ばや」。未然形接続。話し手自身の希望を表す。", example:"いかで見ばや。", translation:"なんとかして見たいなあ。", highlight:"ばや", source:"竹取物語", trivia:"「なむ」(他者への願望)と区別する。", related:[{id:370,type:"対"}] },
  { id:370, word:"なむ", pos:"終助", meaning:"〜してほしい(他者への願望)", etym:"終助詞「なむ」。未然形接続。他者に対する話し手の願望を表す。係助詞「なむ」とは別。", example:"こゆるぎの磯の浪なむ立ちかへり見まほしき。", translation:"こゆるぎの磯の波よ、引いてはまた見たいものよ(波が他者への願望を表す)。", highlight:"まほし", source:"万葉集", trivia:"「ばや」(自分が〜したい)と「なむ」(〜してほしい)の区別は頻出。", related:[{id:369,type:"対"}] },

  { id:371, word:"つかうまつる", pos:"動ラ四", meaning:"お仕えする・いたす(「す」の謙譲語)", etym:"「仕(つか)うまつる」。「する」「仕える」の謙譲語。", example:"殿に年ごろつかうまつる。", translation:"殿に長年お仕えする。", highlight:"つかうまつる", source:"源氏物語", trivia:"「つかまつる」(id:322)と同一語。音便によりuが挿入された形。現代語では「つかまつる」が一般的。", related:[{id:77,type:"類"},{id:322,type:"類"}] },
  { id:372, word:"たちまち", pos:"副", meaning:"たちまち・すぐに", etym:"「立ち+待ち」由来説。間を置かず瞬時に変化する様。", example:"たちまちに色変はりけり。", translation:"たちまち色が変わった。", highlight:"たちまちに", source:"今昔物語集", trivia:null, related:[{id:233,type:"類"}] },
  { id:373, word:"しろしめす", pos:"動サ四", meaning:"お治めになる・ご存知である(「知る」の尊敬語)", etym:"「知ろしめす」。「知る」「治める」の最高敬語。帝・上皇に用いる。", example:"天の下しろしめす帝。", translation:"天下をお治めになる帝。", highlight:"しろしめす", source:"源氏物語", trivia:null, related:[{id:219,type:"類"},{id:217,type:"類"}] },
  { id:374, word:"いたす", pos:"動サ四", meaning:"いたす(「す」の謙譲語)・至らせる", etym:"「致す」。自分の行為をへりくだって言う謙譲語。", example:"御礼をいたし申す。｜御前にいたす。", translation:"お礼を申し上げる。｜御前に差し出す。", highlight:"いたし｜いたす", source:"源氏物語｜源氏物語", trivia:null, related:[{id:310,type:"類"}] },
  { id:375, word:"おもてなし", pos:"名", meaning:"もてなし・接待・ふるまい", etym:"「表無し」説(表裏のない心)と「持て成し」説。客への真心込めた対応。", example:"おもてなしいとよし。", translation:"もてなしがたいそう良い。", highlight:"おもてなし", source:"(作例)", trivia:null, related:[{id:432,type:"参"}] },
{ id:376, word:"あり", pos:"動ラ変", meaning:"①ある・いる ②生きている ③暮らしている", etym:"ラ行変格活用の代表語。「あり・をり・はべり・いまそかり」がラ変四語。", example:"昔、男ありけり。｜いかにしてありけるぞ。｜世にありてものし給ふ。", translation:"昔、男がいた。｜どのようにして生きていたのか。｜世に存命でいらっしゃる。", highlight:"あり｜あり｜あり", source:"伊勢物語｜今昔物語集｜源氏物語", trivia:null, related:[{id:150,type:"類"},{id:495,type:"類"},{id:155,type:"類"},{id:312,type:"類"},{id:397,type:"類"},{id:400,type:"類"},{id:429,type:"類"},{id:138,type:"類"}] },
  { id:377, word:"なる", pos:"動ラ四", meaning:"①なる・変化する ②(音が)聞こえる", etym:"「成る・為る」。状態変化の基本動詞。「鳴る」と同形で文脈判断が必要。", example:"春になりにけり。｜鐘のなるを聞く。", translation:"春になった。｜鐘の音が鳴るのを聞く。", highlight:"なり｜なる", source:"古今集｜枕草子", trivia:null, related:[{id:113,type:"参"},{id:151,type:"参"}] },
  { id:378, word:"まつ", pos:"動タ四", meaning:"待つ・期待する", etym:"「待つ」。和歌では「松」との掛詞が頻出。待ち焦がれる恋心を詠む定型表現。", example:"来むといふも来ぬ時あるを待つといふ。", translation:"来ようと言っても来ない時もある、それでも待つという。", highlight:"待つ", source:"古今集・素性法師", trivia:"和歌では「待つ」と「松」が掛詞になる定番表現。「君を待つ」=「君を松(立って待つ)」。万葉以来の掛詞技法。", related:[{id:57,type:"参"}] },
  { id:379, word:"なく", pos:"動カ四", meaning:"①泣く ②鳴く", etym:"「泣く・鳴く」。人が泣くのも鳥が鳴くのも同じ語。和歌では掛詞的に両義を含む。", example:"鳥のなく声す。｜子のなく声。", translation:"鳥が鳴く声がする。｜子どもが泣く声。", highlight:"なく｜なく", source:"源氏物語｜源氏物語", trivia:null, related:[{id:314,type:"参"},{id:469,type:"参"}] },
  { id:380, word:"うちいづ", pos:"動ダ下二", meaning:"口に出す・言い出す", etym:"「打ち出づ」=内から外へ出す。心の中のことを口に出す動作。", example:"かくなむとうちいでむことの。", translation:"このようにと口に出すことが。", highlight:"うちいで", source:"源氏物語", trivia:null, related:[{id:147,type:"類"}] },
  { id:381, word:"おほす", pos:"動サ下二", meaning:"お命じになる・おっしゃる(「言ふ」の尊敬語)", etym:"「仰す(おほす)」。下二段活用。命令・発言の尊敬語。「おほせ」は名詞形(仰せ)。", example:"帝、しかおほせあり。", translation:"帝がそのようにお命じになる。", highlight:"おほせ", source:"竹取物語", trivia:null, related:[{id:69,type:"類"},{id:382,type:"類"}] },
  { id:382, word:"おほせ", pos:"名", meaning:"仰せ・お言葉・ご命令", etym:"動詞「おほす(仰す)」の名詞形。上位者のお言葉・命令を指す。", example:"おほせのままに申しはべりぬ。", translation:"仰せのとおりに申し上げました。", highlight:"おほせ", source:"源氏物語", trivia:null, related:[{id:381,type:"類"}] },
  { id:383, word:"しかれども", pos:"接続", meaning:"しかしながら・そうではあるけれども", etym:"「然(しか)れども」=「そうであるけれど」。逆接の接続詞。「されど」と同義。", example:"しかれども、心ばへあり。", translation:"しかしながら、心がけがある。", highlight:"しかれども", source:"徒然草", trivia:null, related:[{id:218,type:"対"},{id:164,type:"類"},{id:231,type:"類"},{id:232,type:"類"},{id:346,type:"類"},{id:347,type:"類"},{id:348,type:"類"},{id:364,type:"類"},{id:365,type:"類"},{id:401,type:"類"},{id:403,type:"類"},{id:305,type:"参"}] },
{ id:384, word:"じげ", pos:"名", meaning:"地下(じげ)。殿上の間に昇れない身分の低い官人", etym:"「地下」=殿上(てんじょう)に対する地上の意。四位以下で昇殿を許されない者。", example:"じげの者のまゐり来たる。", translation:"地下の者が参上した。", highlight:"じげ", source:"枕草子", trivia:"「殿上人(うへびと)」の対概念。身分を即座に見分ける指標。", related:[{id:135,type:"対"},{id:479,type:"対"}] },
  { id:385, word:"とのゐ", pos:"名", meaning:"宿直(とのゐ)。宮中に泊まり込んで夜間の警護や勤務をすること", etym:"「殿居(とのゐ)」=殿に居ること。宮中で夜番をする勤務形態。", example:"今宵はとのゐをすべし。", translation:"今夜は宿直をすべきだ。", highlight:"とのゐ", source:"源氏物語", trivia:null, related:[{id:135,type:"参"},{id:386,type:"参"},{id:392,type:"参"}] },
  { id:386, word:"にょうばう", pos:"名", meaning:"女房。宮中や貴族に仕える女性の総称", etym:"「女房」=女の部屋。もとは部屋を与えられた宮仕えの女性を指す。侍女より格上。", example:"にょうばうたちさぶらふ。", translation:"女房たちがお仕えしている。", highlight:"にょうばう", source:"枕草子", trivia:"清少納言・紫式部も「女房」。単なる召使いではなく教養ある知識人。", related:[{id:135,type:"参"},{id:392,type:"参"},{id:409,type:"参"},{id:385,type:"参"}] },
  { id:387, word:"ごけん", pos:"名", meaning:"後見(ごけん)。後ろ盾となって世話をする人・こと", etym:"「後見」=後ろを見て守る。政治的庇護者・養育係の意。", example:"はかばかしき御後見もなくて。", translation:"しっかりした後見人もなくて。", highlight:"後見", source:"源氏物語", trivia:"光源氏が紫の上の「後見」となるように、親に代わる養育者を指すことも多い。", related:[{id:135,type:"参"},{id:316,type:"参"}] },
  { id:388, word:"きちやう", pos:"名", meaning:"几帳(きちょう)。室内を仕切る移動式の垂れ幕", etym:"「几帳」=台に帷(とばり)を垂らしたもの。貴族の室内で女性を隠す重要な調度品。", example:"きちやうの陰にゐ給ふ。", translation:"几帳の陰にいらっしゃる。", highlight:"きちやう", source:"源氏物語", trivia:"御簾(みす)が外と内を隔てるのに対し、几帳は室内をさらに仕切る。女性の姿を隠す「垣間見」の舞台装置。", related:[{id:197,type:"参"},{id:196,type:"参"}] },
  { id:389, word:"だいり", pos:"名", meaning:"内裏(だいり)。天皇の住む宮殿・宮中", etym:"「内裏」=大内(おほうち)の中の意。天皇の御所。転じて天皇そのものを指すことも。", example:"うちにぞまゐり給ひける。", translation:"内裏にこそ参上なさったのだった。", highlight:"うちに", source:"竹取物語", trivia:null, related:[{id:111,type:"参"},{id:390,type:"参"},{id:391,type:"参"},{id:461,type:"参"},{id:526,type:"類"}] },
  { id:390, word:"にょうご", pos:"名", meaning:"女御(にょうご)。天皇の后妃の一つ。中宮に次ぐ地位", etym:"「女御」。天皇の妃の位の一つ。皇后(中宮)の下、更衣の上に位する。", example:"にょうごまゐり給ふ。", translation:"女御が参上なさる。", highlight:"にょうご", source:"源氏物語", trivia:"桐壺更衣(源氏物語)は女御より低い更衣の身分で帝の寵愛を受けたため嫉妬された。", related:[{id:391,type:"参"},{id:389,type:"参"},{id:327,type:"類"}] },
  { id:391, word:"こうい", pos:"名", meaning:"更衣(こうい)。天皇の后妃の一つ。女御より低い地位", etym:"「更衣」=もとは天皇の衣服を管理する女官。後に后妃の称号に。", example:"いづれの御時にか、にょうご・こういあまたさぶらひ給ひけるなかに。", translation:"いつの帝の御代であったか、女御・更衣が大勢お仕えしていた中に。", highlight:"こうい", source:"源氏物語", trivia:"『源氏物語』冒頭の有名な一文。共通テスト・東大ともに頻出の出典。", related:[{id:390,type:"参"},{id:389,type:"参"}] },
  { id:392, word:"つぼね", pos:"名", meaning:"局(つぼね)。宮中で女房に与えられた個室", etym:"「局」=仕切られた小部屋。女房の住居・勤務場所。転じて、局を持つ女房自身を指すことも。", example:"つぼねにかへりたれば。", translation:"局に戻ったところが。", highlight:"つぼね", source:"枕草子", trivia:null, related:[{id:386,type:"参"},{id:385,type:"参"}] },
  { id:393, word:"ずりやう", pos:"名", meaning:"受領(ずりょう)。地方に赴任する中級貴族の国司", etym:"「受領」=国の事務を前任者から受け取る意。四位・五位の中流貴族が任じられた。", example:"ずりやうの娘として上りぬ。", translation:"受領の娘として上京した。", highlight:"ずりやう", source:"更級日記", trivia:"清少納言の父や紫式部の父は受領階級。物語で「地方から上京する姫」はだいたい受領の娘。", related:[{id:252,type:"類"},{id:325,type:"類"}] },
  { id:394, word:"むじやう", pos:"名・形動", meaning:"無常(むじょう)。万物は移り変わり永遠のものはないという仏教思想", etym:"仏教用語「無常」。一切の存在は変化し続けるという根本教義。古文の最重要テーマ。", example:"ゆく河の流れは絶えずして、しかももとの水にあらず。よどみに浮かぶうたかたは…", translation:"流れる川の流れは絶えることなく、しかもその水はもとの水ではない。", highlight:"河の流れ", source:"方丈記", trivia:"『方丈記』冒頭。「無常」を象徴する最も有名な一節。『平家物語』冒頭「祇園精舎」も無常の表現。", related:[{id:399,type:"類"}] },
  { id:395, word:"すくせ", pos:"名", meaning:"宿世(すくせ)。前世からの因縁・運命・宿命", etym:"仏教用語「宿世」=前世。現世の幸不幸は前世の行いで決まるという考え。", example:"すくせのあさからぬ御契り。", translation:"前世からの浅くない(=深い)因縁。", highlight:"すくせ", source:"源氏物語", trivia:"古文で「すくせ」「前の世」「契り」が出たら、登場人物の運命的なつながりを示すサイン。", related:[{id:180,type:"類"},{id:412,type:"類"}] },
  { id:396, word:"くどく", pos:"名", meaning:"功徳(くどく)。善い行いの報い・仏道修行による恩恵", etym:"仏教用語「功徳」。善行・布施・読経などで積まれる善報。", example:"くどくを積みたる人。", translation:"功徳を積んだ人。", highlight:"くどく", source:"今昔物語集", trivia:null, related:[{id:179,type:"類"}] },
  { id:397, word:"ほっしん", pos:"名・動サ変", meaning:"発心(ほっしん)。仏道に入ろうと志すこと・出家を決意すること", etym:"「発菩提心(ほつぼだいしん)」の略。悟りを求める心を起こすこと。", example:"ほっしんして、いとど深く思ひなりぬ。", translation:"出家を決意して、いっそう深く思うようになった。", highlight:"ほっしん", source:"源氏物語", trivia:null, related:[{id:400,type:"類"},{id:212,type:"類"},{id:150,type:"類"},{id:155,type:"類"},{id:312,type:"類"},{id:376,type:"類"},{id:429,type:"類"}] },
  { id:398, word:"ごう", pos:"名", meaning:"業(ごう)。前世の行いが現世に及ぼす影響・因果の法則", etym:"仏教用語「業(カルマ)」。身体・言葉・心で行った行為が未来の結果を生むという思想。", example:"前の世のごうと見えたり。", translation:"前世の業と見えた。", highlight:"ごう", source:"今昔物語集", trivia:"「業が深い」=前世の罪が深い。古文では不幸な運命の説明に使われる。", related:[{id:179,type:"類"}] },
  { id:399, word:"えしゃうじゃうり", pos:"名", meaning:"会者定離(えしゃじょうり)。会う者は必ず別れるという仏教の教え", etym:"仏教の四苦八苦のうち「愛別離苦」と対をなす無常観。出会いと別れの必然性。", example:"えしゃうじゃうり、これ世の定めなり。", translation:"会者定離、これが世の理だ。", highlight:"えしゃうじゃうり", source:"平家物語", trivia:null, related:[{id:394,type:"類"}] },
  { id:400, word:"よをそむく", pos:"連語", meaning:"世を背く。出家する・俗世を離れる", etym:"「世(よ)を背(そむ)く」。仏門に入って俗世間と縁を切ること。", example:"世をそむきて山に入りぬ。", translation:"出家して山に入った。", highlight:"世をそむき", source:"源氏物語", trivia:"出家表現は多彩:「世を背く」「世を捨つ(id:376参照)」「世を厭ふ(id:150)」「やつす(id:429)」「発心す(id:397)」。いずれも「俗世を離れ仏門に入る」意。", related:[{id:150,type:"類"},{id:397,type:"類"},{id:429,type:"類"},{id:155,type:"類"},{id:312,type:"類"},{id:376,type:"類"},{id:548,type:"参"}] },
  { id:401, word:"さりとて", pos:"接続", meaning:"そうかといって・だからといって", etym:"「然(さ)りとて」=「そうであるとしても」。前件を認めつつ安易な結論を否定する譲歩の接続詞。", example:"さりとて、このままにもあるべからず。", translation:"だからといって、このままでもあるべきではない。", highlight:"さりとて", source:"徒然草", trivia:null, related:[{id:164,type:"類"},{id:231,type:"類"},{id:232,type:"類"},{id:346,type:"類"},{id:347,type:"類"},{id:348,type:"類"},{id:364,type:"類"},{id:365,type:"類"},{id:403,type:"類"},{id:383,type:"類"}] },
  { id:402, word:"さはれ", pos:"感・接続", meaning:"ままよ・どうにでもなれ・それはさておき", etym:"「さ(然)+はれ」=「そうであれ」。諦め・覚悟の感嘆詞、または話題転換の接続詞。", example:"さはれ、ただ言はむ。", translation:"ままよ、ただ言おう。", highlight:"さはれ", source:"枕草子", trivia:null, related:[{id:231,type:"参"}] },
  { id:403, word:"そもそも", pos:"接続", meaning:"そもそも・いったい・ところで", etym:"「そも+そも」=「それにしても」の強調。話の根本に立ち返る接続詞。", example:"そもそも、いかなる者ぞ。", translation:"そもそも、どのような者か。", highlight:"そもそも", source:"平家物語", trivia:null, related:[{id:164,type:"類"},{id:231,type:"類"},{id:232,type:"類"},{id:346,type:"類"},{id:347,type:"類"},{id:348,type:"類"},{id:364,type:"類"},{id:365,type:"類"},{id:401,type:"類"},{id:383,type:"類"}] },
  { id:404, word:"およそ", pos:"副", meaning:"①おおよそ・だいたい ②(打消で)まったく〜ない", etym:"「凡(およ)そ」。物事の概略を示す。打消と呼応すると全面否定になる。", example:"およそ人の心ざまを見れば。｜およそあるまじきことなり。", translation:"だいたい人の気質を見ると。｜まったくあるはずのないことだ。", highlight:"およそ｜およそ", source:"徒然草｜徒然草", trivia:null, related:[{id:255,type:"類"}] },
  { id:405, word:"そうす", pos:"動サ変", meaning:"奏す。天皇に申し上げる(天皇専用の謙譲語)", etym:"漢語「奏(そう)」+「す」。天皇に対してのみ使う最高の謙譲語。", example:"帝にそうし申す。", translation:"帝に申し上げる。", highlight:"そうし", source:"源氏物語", trivia:"「奏す」=天皇に、「啓す」=中宮・東宮に、「申す」=一般貴族に。敬語の「方向」が問われる頻出知識。", related:[{id:407,type:"対"},{id:406,type:"対"}] },
  { id:406, word:"けいす", pos:"動サ変", meaning:"啓す。中宮・皇太子に申し上げる(中宮・東宮専用の謙譲語)", etym:"漢語「啓(けい)」+「す」。中宮(皇后)・東宮(皇太子)に対して使う謙譲語。", example:"中宮にけいし申す。", translation:"中宮に申し上げる。", highlight:"けいし", source:"源氏物語", trivia:"奏す(天皇)→啓す(中宮・東宮)→申す(一般)の使い分けは東大頻出。", related:[{id:405,type:"対"}] },
  { id:407, word:"せっしやう", pos:"名", meaning:"摂政(せっしょう)。天皇が幼少の時に代わって政務を行う最高位の官職", etym:"「摂政」=天皇の政務を摂(と)り行う。藤原氏が独占し権力の源泉とした。", example:"せっしやうの御子なり。", translation:"摂政のお子だ。", highlight:"せっしやう", source:"源氏物語", trivia:"摂政(幼帝の代理)と関白(成人帝の補佐)は藤原摂関政治の根幹。", related:[{id:409,type:"参"},{id:408,type:"類"},{id:111,type:"参"},{id:405,type:"対"}] },
  { id:408, word:"くわんぱく", pos:"名", meaning:"関白(かんぱく)。天皇を補佐して政務を統括する最高位の官職", etym:"「関白」=「あづかり申す」の漢語訳。天皇に代わり万事を関(あずか)り白(もう)す。", example:"くわんぱく殿、黒戸より出でさせ給ひて。", translation:"関白殿が黒戸からお出になられて。", highlight:"くわんぱく", source:"枕草子", trivia:null, related:[{id:407,type:"類"}] },
  { id:409, word:"ないし", pos:"名", meaning:"尚侍(ないし)・典侍(ないしのすけ)。天皇の側近くに仕える女官の総称", etym:"「内侍(ないし)」=内裏の中で天皇に仕える女官。最高位が尚侍(ないしのかみ)。", example:"ないしのすけ参りたり。", translation:"典侍が参上した。", highlight:"ないしのすけ", source:"枕草子", trivia:null, related:[{id:386,type:"参"},{id:407,type:"参"}] },
{ id:410, word:"としごろ", pos:"名", meaning:"①数年来・長年 ②年頃・ふさわしい年齢", etym:"「年ごろ」=年の頃合い。長い年月を漠然と指す。", example:"としごろ願ひ奉りける。｜としごろになり給ふ。", translation:"長年お祈り申し上げた。｜(婚期の)年頃におなりになる。", highlight:"としごろ｜としごろ", source:"更級日記｜源氏物語", trivia:null, related:[{id:207,type:"参"},{id:528,type:"参"}] },
  { id:411, word:"かげ", pos:"名", meaning:"①光(月の光など) ②姿・面影(鏡・水面に映る姿を含む) ③影・暗がり", etym:"「影・光」。古文では「光」の意が中心。月の光=月のかげ。現代語とほぼ逆。", example:"月のかげ冴えわたりて。｜鏡のかげを見て恥づ。｜木のかげに隠れたり。", translation:"月の光が冴え渡って。｜鏡に映る自分の姿を見て恥じる。｜木の陰に隠れた。", highlight:"かげ｜かげ｜かげ", source:"源氏物語｜源氏物語｜今昔物語集", trivia:"「光」と「影」が同じ語であることに注意。文脈判断が必要。", related:[{id:123,type:"参"}] },
  { id:412, word:"ちぎり", pos:"名", meaning:"①約束 ②前世からの因縁 ③夫婦・男女の関係", etym:"動詞「契(ちぎ)る」の名詞形。古文では前世の因縁・宿命の意が重要。", example:"すくせのちぎり深し。｜かたきちぎりを結ぶ。｜かたくちぎりて別れにき。", translation:"前世からの因縁が深い。｜固い約束を結ぶ。｜固く誓って別れた。", highlight:"ちぎり｜ちぎり｜ちぎり", source:"源氏物語｜源氏物語｜伊勢物語", trivia:null, related:[{id:202,type:"参"},{id:395,type:"類"}] },
  { id:413, word:"めづ", pos:"動ダ下二", meaning:"愛でる・感嘆する・褒める", etym:"「愛(め)づ」。美しいもの・素晴らしいものに心を惹かれる。", example:"花をめでて歌よみたる。", translation:"花を愛でて歌を詠んだ。", highlight:"めで", source:"古今集", trivia:null, related:[{id:56,type:"参"},{id:2,type:"参"}] },
  { id:414, word:"まもる", pos:"動ラ四", meaning:"①じっと見つめる ②守る", etym:"「目(ま)+守る」=目で守る→じっと見つめる。古文では「凝視する」が中心義。", example:"御顔をまもり給ふ。｜国をまもらせ給ふ。", translation:"お顔をじっと見つめられる。｜国をお守りになる。", highlight:"まもり｜まもら", source:"源氏物語｜源氏物語", trivia:"古文で「まもる」=「じっと見つめる」。平安貴族は御簾(みす)・几帳(きちょう)越しに相手を見る生活で、直接「まもる(凝視する)」のは特別な行為だった。", related:[{id:551,type:"類"},{id:320,type:"参"},{id:363,type:"参"}] },
  { id:415, word:"まうく", pos:"動カ下二", meaning:"①準備する・用意する ②設ける ③子を得る(=授かる)", etym:"「設(まう)く」。あらかじめ整えておく動作。", example:"さるべきものどもまうけたる。｜男子をまうけ給ひぬ。｜宴をまうけて待つ。", translation:"しかるべき品々を用意した。｜男の子をお授かりになった。｜宴を設けて待つ。", highlight:"まうけ｜まうけ｜まうけ", source:"源氏物語｜源氏物語｜源氏物語", trivia:null, related:[{id:97,type:"類"}] },
  { id:416, word:"いぬ", pos:"動ナ変", meaning:"①去る・行ってしまう ②死ぬ", etym:"ナ行変格活用。活用:いな・いに・いぬ・いぬる・いぬれ・いね。「死ぬ」と同じ活用型。", example:"人みないにけり。｜はかなくいぬる命かな。", translation:"人は皆去ってしまった。｜はかなく亡くなる命よ。", highlight:"いに｜いぬる", source:"源氏物語｜伊勢物語", trivia:"ナ変動詞は「死ぬ・往(い)ぬ」の2語のみ。「去る」「亡くなる」の両義を文脈で判断。", related:[{id:263,type:"参"}] },
  { id:417, word:"やむごとなし", pos:"形ク", meaning:"高貴だ・並々でない・やんごとない", etym:"「止(や)む+事+無し」=止めることができない→捨て置けないほど尊い。", example:"やむごとなき御方々。", translation:"高貴な方々。", highlight:"やむごとなき", source:"源氏物語", trivia:null, related:[{id:100,type:"参"},{id:135,type:"参"}] },

  { id:419, word:"つれなし", pos:"形ク", meaning:"①平然としている ②冷淡だ ③変わらない", etym:"「連(つ)れ+無し」=心が通い合わない。相手に対して無関心・冷淡な態度。", example:"つれなき人の心。｜月のつれなく照れるかな。｜つれなき御けしきなり。", translation:"冷淡な人の心。｜月が変わらず照っているよ。｜平然としたご様子だ。", highlight:"つれなき｜つれなく｜つれなき", source:"古今集｜後撰集｜源氏物語", trivia:null, related:[{id:32,type:"類"},{id:40,type:"類"}] },
  { id:420, word:"びんなし", pos:"形ク", meaning:"都合が悪い・不便だ・具合が悪い", etym:"「便(びん)+無し」=便宜がない。場面にふさわしくない状況を指す。", example:"びんなき所に入りゐたる。", translation:"都合の悪い場所に入って座っている。", highlight:"びんなき", source:"枕草子", trivia:null, related:[{id:275,type:"参"}] },
  { id:421, word:"あだなり", pos:"形動ナリ", meaning:"①はかない ②不誠実だ・浮気だ", etym:"「徒(あだ)なり」=実を結ばない。はかなさ・不実さの両義。", example:"あだなる人の心は。｜あだなる花の散るがごとし。", translation:"浮気な人の心は。｜はかない花が散るようだ。", highlight:"あだなる｜あだなる", source:"伊勢物語｜平家物語", trivia:null, related:[{id:101,type:"類"},{id:202,type:"参"}] },

  { id:423, word:"おほやけ", pos:"名", meaning:"①朝廷・天皇 ②公の場・表向き", etym:"「大宅(おほやけ)」=大きな家→天皇の家→朝廷。「わたくし(私)」の対。", example:"おほやけの御こと申す。｜おほやけざまに仰せ出だす。", translation:"朝廷のことを申し上げる。｜公式に命令を出す。", highlight:"おほやけ｜おほやけ", source:"源氏物語｜源氏物語", trivia:null, related:[{id:111,type:"参"},{id:526,type:"参"}] },
  { id:424, word:"きは", pos:"名", meaning:"①身分・階級 ②程度 ③際・時", etym:"「際(きは)」=境目。身分の境界線→身分・地位。古文では身分の意が最頻出。", example:"きはやむごとなき御方々。｜きはきはしく見ゆる人。｜そのきはにいたりて。", translation:"身分のご高貴な方々。｜程度がはっきりして見える人。｜その際に至って。", highlight:"きは｜きは｜きは", source:"源氏物語｜源氏物語｜源氏物語", trivia:null, related:[{id:247,type:"類"},{id:273,type:"参"},{id:527,type:"類"}] },
  { id:425, word:"つごもり", pos:"名", meaning:"月末・晦日(みそか)", etym:"「月隠(つきごも)り」=月が隠れる日→月末。旧暦では月末に月が見えなくなる。", example:"十二月のつごもり。", translation:"十二月の月末。", highlight:"つごもり", source:"枕草子", trivia:null, related:[{id:8,type:"参"},{id:488,type:"対"}] },
  { id:426, word:"わざ", pos:"名", meaning:"①行い・しわざ ②仏事・法事 ③こと・物事", etym:"「業(わざ)」。人為的な行為全般。特に仏事・法要の意で頻出。", example:"かかるわざをしつるものかな。｜御わざのこと申す。｜わざとがましき心。", translation:"こんなことをしてしまったものよ。｜ご法事のことを申し上げる。｜もったいぶった心。", highlight:"わざ｜わざ｜わざ", source:"竹取物語｜源氏物語｜源氏物語", trivia:null, related:[{id:179,type:"参"}] },

  { id:429, word:"やつす", pos:"動サ四", meaning:"①みすぼらしい姿にする・目立たない服装をする ②出家する", etym:"「窶(やつ)す」。本来の姿を隠すために地味にする→出家する。", example:"人目を避けてやつれたまふ。｜世をやつして山に入る。", translation:"人目を避けてやつれていらっしゃる。｜出家して山に入る。", highlight:"やつれ｜やつし", source:"源氏物語｜源氏物語", trivia:null, related:[{id:400,type:"類"},{id:150,type:"類"},{id:155,type:"類"},{id:312,type:"類"},{id:376,type:"類"},{id:397,type:"類"},{id:289,type:"類"}] },
  { id:430, word:"そばむ", pos:"動マ四", meaning:"横を向く・そっぽを向く・背く", etym:"「側(そば)+む」=横の方を向く。顔をそむける不快・拒絶の動作。", example:"そばみてゐる人あり。", translation:"横を向いて座っている人がいる。", highlight:"そばみ", source:"枕草子", trivia:null, related:[{id:509,type:"参"},{id:534,type:"参"}] },
  { id:431, word:"すむ", pos:"動マ四", meaning:"①住む ②澄む ③(通い婚で)通い定まる・夫として落ち着く", etym:"「住む」と「澄む」は同源。一か所に落ち着く→清く透き通る。文脈で判断。", example:"山里に住みはじめたる。｜月の光すみわたる夜。｜この女のもとに住みにけり。", translation:"山里に住み始めた。｜月の光が澄みわたる夜。｜この女性のもとに通い定まった。", highlight:"住み｜すみ｜住み", source:"源氏物語｜源氏物語｜伊勢物語", trivia:"通い婚の時代、「住む」=「特定の女性のもとに落ち着く」は男女関係を示す重要な手がかり。", related:[{id:551,type:"類"}] },
  { id:432, word:"あるじす", pos:"動サ変", meaning:"主人として饗応する・もてなしをする", etym:"「主(あるじ)す」=主人として客をもてなす。宴会・饗応の場面で使う。", example:"いとめでたくあるじしたり。", translation:"たいそう立派にもてなした。", highlight:"あるじし", source:"源氏物語", trivia:null, related:[{id:313,type:"類"},{id:375,type:"参"}] },

  { id:434, word:"かこつ", pos:"動タ四", meaning:"①不平を言う・嘆く ②口実にする・かこつける", etym:"「託(かこ)つ」。不満を口に出す→口実にする。", example:"世をかこちて泣く。｜雨にかこつけて来ず。", translation:"世の中を恨み嘆いて泣く。｜雨を口実にして来ない。", highlight:"かこち｜かこつけ", source:"源氏物語｜伊勢物語", trivia:null, related:[{id:513,type:"類"},{id:310,type:"類"}] },

  { id:436, word:"なやむ", pos:"動マ四", meaning:"①病気になる ②苦しむ", etym:"「悩む」。古文では「病む」の意が中心。現代語の「迷う」ではない。", example:"いたうなやみ給ひて。｜思ひなやみてわびしがる。", translation:"ひどくご病気でいらっしゃって。｜思い悩んで嘆く。", highlight:"なやみ｜なやみ", source:"源氏物語｜源氏物語", trivia:null, related:[{id:278,type:"類"},{id:513,type:"類"},{id:95,type:"対"},{id:451,type:"類"},{id:450,type:"類"},{id:514,type:"類"}] },
  { id:437, word:"かたじけなし", pos:"形ク", meaning:"①恐れ多い ②もったいない ③ありがたい", etym:"「忝(かたじけな)し」。自分にはもったいないほどの恩恵を感じる敬意の表現。", example:"かたじけなき仰せ言かな。｜かたじけなき御恵み。｜かたじけなくも参り来たり。", translation:"恐れ多いお言葉よ。｜もったいない御恩。｜ありがたくも参上した。", highlight:"かたじけなき｜かたじけなき｜かたじけなく", source:"源氏物語｜源氏物語｜今昔物語集", trivia:null, related:[{id:100,type:"参"}] },

  { id:439, word:"めやすし", pos:"形ク", meaning:"見苦しくない・感じがよい・無難だ", etym:"「目(め)+安(やす)し」=目に安らかだ。積極的な美ではなく「悪くない」のニュアンス。", example:"めやすきほどの人。", translation:"感じのよい(無難な)程度の人。", highlight:"めやすき", source:"源氏物語", trivia:null, related:[{id:28,type:"参"},{id:170,type:"参"}] },

  { id:448, word:"わりなし", pos:"形ク", meaning:"①道理に合わない ②どうしようもない ③むやみだ", etym:"「理(わり)+無し」=道理がない。理屈では説明できない状態。", example:"わりなくあはれとぞ思ふ。｜わりなきことを言ひければ。｜わりなく思し召す。", translation:"どうしようもなくしみじみと思う。｜道理に合わないことを言ったので。｜むやみにお思いになる。", highlight:"わりなく｜わりなき｜わりなく", source:"源氏物語｜源氏物語｜源氏物語", trivia:null, related:[{id:52,type:"類"},{id:449,type:"類"}] },

  { id:450, word:"あつし", pos:"形ク", meaning:"病気が重い・病み重る", etym:"「篤(あつ)し」。病状が深刻な様子。「篤くわづらふ」が定型表現。", example:"いとあつくなり給ひて。", translation:"たいそうご病気が重くなられて。", highlight:"あつく", source:"源氏物語", trivia:null, related:[{id:449,type:"参"},{id:436,type:"類"}] },

  { id:453, word:"あやにくなり", pos:"形動ナリ", meaning:"①意地悪だ ②折悪しく ③皮肉にも", etym:"「あや(文)+にく(憎)し」。あいにくの語源。期待に反して都合が悪い状況。", example:"あやにくに雨ぞ降りける。｜あやにくなる人の心かな。｜あやにくにつらきことなり。", translation:"折悪しく雨が降った。｜意地悪な人の心よ。｜皮肉にもつらいことだ。", highlight:"あやにくに｜あやにくなる｜あやにくに", source:"源氏物語｜源氏物語｜枕草子", trivia:null, related:[{id:327,type:"類"}] },

  { id:459, word:"ひま", pos:"名", meaning:"①すきま ②暇 ③機会 ④不仲", etym:"「隙(ひま)」。物理的な隙間→時間の空き→人間関係の隙間(不仲)。", example:"ひまもなくさぶらひて。｜御仲のひまを見て。｜ひまを求めて申す。｜ひまより光さし入る。", translation:"暇もなくお仕えして。｜お二人の不仲を見て。｜機会を求めて申し上げる。｜隙間から光が差し入る。", highlight:"ひま｜ひま｜ひま｜ひま", source:"枕草子｜源氏物語｜徒然草｜源氏物語", trivia:null, related:[{id:506,type:"参"}] },

  { id:461, word:"くもゐ", pos:"名", meaning:"①雲のある所・空 ②宮中", etym:"「雲居(くもゐ)」=雲のいる所→はるか遠い所→宮中(雲の上の世界)。", example:"くもゐはるかに見ゆ。｜くもゐの月さやかなり。", translation:"宮中がはるかに見える。｜空の月が明るい。", highlight:"くもゐ｜くもゐ", source:"源氏物語｜源氏物語", trivia:null, related:[{id:389,type:"参"},{id:526,type:"類"}] },
  { id:462, word:"せうそこ", pos:"名", meaning:"①手紙 ②訪問 ③様子を尋ねること", etym:"「消息(せうそこ)」。人の安否を問う→手紙・伝言・訪問。", example:"せうそこを遣はして問ふ。｜せうそこして御前に入る。｜せうそこを聞きてまゐる。", translation:"手紙を送って尋ねる。｜取り次ぎをして御前に入る。｜様子を聞いて参上する。", highlight:"せうそこ｜せうそこ｜せうそこ", source:"源氏物語｜枕草子｜源氏物語", trivia:null, related:[{id:292,type:"参"},{id:200,type:"類"},{id:537,type:"類"}] },
  { id:463, word:"かしこまり", pos:"名", meaning:"①恐縮すること・畏まること ②お礼・お詫び", etym:"動詞「畏(かしこ)まる」の名詞形。謹んで恐れ入る態度。", example:"かしこまりて承りぬ。｜かしこまりを申す。", translation:"謹んでお受けした。｜お礼を申し上げる。", highlight:"かしこまり｜かしこまり", source:"源氏物語｜源氏物語", trivia:null, related:[{id:100,type:"参"}] },
  { id:464, word:"わざと", pos:"副・形動", meaning:"①わざわざ ②特別に ③本格的に", etym:"「態(わざ)と」=意図を持って。古文では「わざわざ」「特別に」の意が中心。", example:"わざとの御よそほひにて。｜わざと参り給ひたり。｜わざとならぬさまにて。", translation:"本格的なお支度で。｜わざわざご参上になった。｜さりげない様子で。", highlight:"わざと｜わざと｜わざと", source:"源氏物語｜源氏物語｜源氏物語", trivia:null, related:[{id:57,type:"参"},{id:356,type:"類"}] },

  { id:472, word:"たのし", pos:"形シク", meaning:"①裕福だ・豊かだ(古文中心義) ②楽しい(近世以降)", etym:"「楽し」。古文では「裕福・豊か」が中心義。現代語の「楽しい」とは異なる。", example:"いとたのしき人なり。｜たのしき宴かな。", translation:"たいそう裕福な人だ。｜楽しい宴よ。", highlight:"たのしき｜たのしき", source:"今昔物語集｜源氏物語", trivia:"現代語の「楽しい」の意で使われるのは中世以降。", related:[{id:362,type:"参"}] },

  { id:476, word:"いろ", pos:"名", meaning:"①色 ②容貌・美しさ ③恋愛・色事", etym:"「色」。古文では特に「美貌」「恋愛」の意が重要。「色好み」=恋愛好き。", example:"いろに出でにけりな。｜いろ好みなる人なり。｜いろいろの花さく。", translation:"表情に出てしまったなあ。｜恋愛好きな人だ。｜いろいろな花が咲く。", highlight:"いろ｜いろ｜いろ", source:"古今集｜伊勢物語｜枕草子", trivia:null, related:[{id:438,type:"類"},{id:128,type:"参"},{id:202,type:"類"},{id:341,type:"参"},{id:358,type:"参"}] },

  { id:482, word:"はやく", pos:"副", meaning:"①はやく・以前から ②実は・そもそも(文の冒頭で)", etym:"形容詞「早し」の連用形。「実は以前から」の意で過去の事実を示す。", example:"はやく聞きしこと。｜はやくより、かかることあり。", translation:"以前から聞いていたこと。｜実は前々から、このようなことがある。", highlight:"はやく｜はやく", source:"(作例)｜(作例)", trivia:"「はやく」には「早(は)や+く」=既に以前から、の意と、文頭で「実は・そもそも」の意がある。文脈で区別。", related:[{id:206,type:"参"}] },
  { id:483, word:"せめて", pos:"副", meaning:"①無理に ②せめて ③非常に", etym:"動詞「責む」の連用形。古文では「無理に」が中心義。現代語とズレやすい。", example:"せめて言ひければ従ひぬ。｜せめて一目見ばや。｜せめてつらき御心なり。", translation:"無理に言ったので従った。｜せめて一目見たい。｜たいそうつらいお心だ。", highlight:"せめて｜せめて｜せめて", source:"今昔物語集｜竹取物語｜源氏物語", trivia:null, related:[{id:335,type:"類"}] },

  { id:485, word:"かずならず", pos:"連語", meaning:"数に入らない・取るに足りない・物の数ではない", etym:"「数(かず)+なら+ず」=数に含まれない。身分や能力が低い自嘲の表現。", example:"かずならぬ身と思へば。", translation:"物の数でもない身と思うと。", highlight:"かずならぬ", source:"源氏物語", trivia:null, related:[{id:486,type:"類"}] },

  { id:491, word:"まうづ", pos:"動ダ下二", meaning:"参上する・参詣する(「行く」の謙譲語)", etym:"「詣(まう)づ」=ダ行下二段。活用:まうで・まうで・まうづ・まうづる・まうづれ・まうでよ。「まゐる」より出向く先への敬意が高い。", example:"初瀬にまうづ。", translation:"初瀬(長谷寺)に参詣する。", highlight:"まうづ", source:"更級日記", trivia:null, related:[{id:78,type:"類"},{id:79,type:"参"}] },

  { id:494, word:"ぎやうかう", pos:"名", meaning:"行幸(ぎょうこう)。天皇のお出かけ", etym:"「行幸」=天皇の外出。中宮・皇太子は「行啓(ぎょうけい)」、上皇は「御幸(ごこう)」。", example:"ぎやうかうなりける折に。", translation:"天皇のお出かけの折に。", highlight:"ぎやうかう", source:"枕草子", trivia:"行幸=天皇、行啓=中宮・東宮、御幸=上皇・法皇。主体で語が変わる。", related:[{id:493,type:"参"}] },

            delete s.cards[w.id].quizDone;

          if (s.cards[w.id].quizPassed === undefined) {
            s.cards[w.id].quizPassed = s.cards[w.id].phase !== 'new';
          }
          if (s.cards[w.id].lastReviewedAt === undefined) {
            s.cards[w.id].lastReviewedAt = 0;
          }
        }
      });
      if (!s.history) s.history = {};
      if (!s.streak) s.streak = { current: 0, longest: 0, lastDate: null };
      if (s.totalReviews == null) s.totalReviews = 0;
      return s;
    }
  } catch(e) {}
  return defaultState();
}

  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const payload = JSON.parse(ev.target.result);
        if (!payload.state || !payload.state.cards) {
          alert('ファイルの形式が正しくありません。');
          return;
        }
        // Merge: only import cards that exist in current WORDS
        const idSet = new Set(WORDS.map(w => w.id));
        const importedCards = payload.state.cards;
        Object.keys(importedCards).forEach(id => {
          if (!idSet.has(parseInt(id))) delete importedCards[id];
        });
        state = { ...loadState(), ...payload.state, cards: importedCards };
        // Re-migrate new cards if word count expanded
        WORDS.forEach(w => {
          if (!state.cards[w.id]) {
            state.cards[w.id] = { phase:'new', step:0, ease:2.5, interval:0, due:0, reps:0, lapses:0, quizPassed:false, lastReviewedAt:0 };
          }
        });
        if (payload.settings) {
          settings = { ...loadSettings(), ...payload.settings };
          saveSettings();
        }
        saveState();
        closeModal();
        render();
        setTimeout(() => alert(`インポート完了。${Object.keys(importedCards).length}語のデータを復元しました。`), 100);
      } catch(err) {
        alert('ファイルの読み込みに失敗しました: ' + err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

// Apply rating. q: 0=again 1=hard 2=good 3=easy
function applyRating(c, q) {
  const now = Date.now();

  if (c.phase === 'new' || c.phase === 'learning') {
    if (c.phase === 'new') { c.phase = 'learning'; c.step = 0; }

    if (q === 0) {
      c.step = 0;
      c.due = now + LEARN_STEPS[0] * MIN;
    } else if (q === 1) {
      // hard: stay on current step but with 1.5x delay (distinct from again)
      c.due = now + Math.round(LEARN_STEPS[c.step] * 1.5 + 1) * MIN;
    } else if (q === 2) {
      if (c.step + 1 < LEARN_STEPS.length) {
        c.step += 1;
        c.due = now + LEARN_STEPS[c.step] * MIN;
      } else {
        // graduate
        c.phase = 'review';
        c.interval = GRADUATING_INTERVAL;
        c.due = now + c.interval * DAY;
        c.reps += 1;
      }
    } else if (q === 3) {
      // easy: graduate immediately with longer interval
      c.phase = 'review';
      c.interval = EASY_INTERVAL;
      c.due = now + c.interval * DAY;
      c.reps += 1;
    }
  } else if (c.phase === 'review' || c.phase === 'mastered') {
    if (q === 0) {
      // lapse
      c.lapses += 1;
      c.ease = Math.max(1.3, c.ease - 0.2);
      c.phase = 'learning';
      c.step = 0;
      c.interval = 0;
      c.due = now + LEARN_STEPS[0] * MIN;
    } else {
      let mult;
      if (q === 1) { mult = 1.2; c.ease = Math.max(1.3, c.ease - 0.15); }
      else if (q === 2) { mult = c.ease; }
      else { mult = c.ease * 1.3; c.ease = c.ease + 0.15; }
      c.interval = Math.max(1, Math.round(c.interval * mult));
      c.due = now + c.interval * DAY;
      c.reps += 1;
      c.phase = c.interval >= MASTERED_THRESHOLD ? 'mastered' : 'review';
    }
  }
}

// Preview the next interval for display on rating buttons
function previewInterval(card, q) {
  const c = JSON.parse(JSON.stringify(card));
  applyRating(c, q);
  const diff = c.due - Date.now();
  if (diff < 60*1000) return '<1分';
  if (diff < 60*MIN) return Math.round(diff/MIN) + '分';
  if (diff < DAY) return Math.round(diff/(60*MIN)) + '時間';
  const days = Math.round(diff/DAY);
  if (days < 30) return days + '日';
  if (days < 365) return Math.round(days/30) + 'ヶ月';
  return Math.round(days/365) + '年';
}

// Pick the next card to study, honoring daily limits and anti-repeat
function pickNextCard() {
  const now = Date.now();
  const d = state.daily;

  // 1) learning cards (no daily limit, always show if due)
  const learning = WORDS
    .filter(w => state.cards[w.id].phase === 'learning' && state.cards[w.id].due <= now)
    .sort((a,b) => state.cards[a.id].due - state.cards[b.id].due);

  // 2) review cards (subject to limit)
  const canReview = d.reviewDone < settings.reviewLimit;
  const reviews = canReview ? WORDS
    .filter(w => (state.cards[w.id].phase === 'review' || state.cards[w.id].phase === 'mastered') && state.cards[w.id].due <= now)
    .sort((a,b) => state.cards[a.id].due - state.cards[b.id].due) : [];

  // 3) new cards (subject to limit)
  const canNew = d.newDone < settings.newLimit;
  const news = canNew ? WORDS.filter(w => state.cards[w.id].phase === 'new') : [];

  // Merge with priority: learning > review > new, but avoid immediate repeat
  const queue = [...learning, ...reviews, ...news];
  if (queue.length === 0) return null;

  // anti-repeat: if first is same as last shown and there's an alternative, skip to next
  if (queue.length > 1 && queue[0].id === state.lastShownId) {
    return queue[1];
  }
  return queue[0];
}

function getStats() {
  const now = Date.now();
  let newC = 0, learnC = 0, dueC = 0, masteredC = 0;
  WORDS.forEach(w => {
    const c = state.cards[w.id];
    if (c.phase === 'new') newC++;
    else if (c.phase === 'learning') learnC++;
    else if (c.phase === 'mastered') masteredC++;
    if ((c.phase === 'review' || c.phase === 'mastered') && c.due <= now) dueC++;
  });
  return { newC, learnC, dueC, masteredC };
}

  document.getElementById('stat-learn').textContent = s.learnC;

}

// =============== HISTORY / STREAK ===============
function dateKey(d) {
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}
function daysBetween(a, b) {
  const A = new Date(a.getFullYear(), a.getMonth(), a.getDate());
  const B = new Date(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((B - A) / DAY);
}

function recordReview(wasNew) {
  const today = todayStr();
  if (!state.history[today]) state.history[today] = { reviews: 0, news: 0 };
  state.history[today].reviews += 1;
  if (wasNew) state.history[today].news += 1;
  state.totalReviews += 1;

  // streak update
  const last = state.streak.lastDate;
  if (last !== today) {
    if (!last) {
      state.streak.current = 1;
    } else {
      const lastD = parseDateKey(last);
      const todayD = new Date();
      const diff = daysBetween(lastD, todayD);
      if (diff === 1) state.streak.current += 1;
      else if (diff > 1) state.streak.current = 1;
      // diff === 0 shouldn't happen since last !== today
    }
    state.streak.lastDate = today;
    if (state.streak.current > state.streak.longest) {
      state.streak.longest = state.streak.current;
    }
  }
}
function parseDateKey(k) {
  const [y, m, d] = k.split('-').map(Number);
  return new Date(y, m - 1, d);
}

let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e) { return null; }
  }
  return audioCtx;
}
function playTone(freq, duration, type, vol) {
  if (!settings.sound) return;
  const ctx = getAudioCtx();
  if (!ctx) return;
  try {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    const v = vol || 0.12;
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(v, ctx.currentTime + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration + 0.02);
  } catch(e) {}
}

// =============== HIGHLIGHT ===============
function highlightExample(text, hl) {
  if (!hl) return escapeHtml(text);
  const idx = text.indexOf(hl);
  if (idx === -1) return escapeHtml(text);
  return escapeHtml(text.slice(0, idx)) +
    `<mark>${escapeHtml(text.slice(idx, idx + hl.length))}</mark>` +
    escapeHtml(text.slice(idx + hl.length));
}

// Render example(s) — supports ｜-separated multiple examples
function renderExamples(w) {
  const exs = w.example.split('｜');
  const trs = (w.translation || '').split('｜');
  const hls = (w.highlight || '').split('｜');
  const srcs = (w.source || '').split('｜');
  const multi = exs.length > 1;

  return exs.map((ex, i) => {
    const tr = (trs[i] || '').trim();
    const hl = (hls[i] || '').trim();
    const src = (srcs[i] || srcs[0] || '').trim();
    const label = multi ? `例${'①②③④⑤⑥'[i] || (i+1)}` : '例';
    return `
      <div class="detail${i > 0 ? ' mt-8' : ''}">
        <span class="detail-label shu">${label}</span>
        <div class="example-jp" lang="ja">${highlightExample(ex.trim(), hl)}</div>
        <div class="example-src">— 『${src}』</div>
        ${settings.showTranslation && tr ? `<div class="translation">${escapeHtml(tr)}</div>` : ''}
      </div>
    `;
  }).join('');
}
function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// =============== RELATED ===============
function relatedHtml(w) {
  if (!w.related || w.related.length === 0) return '';
  const chips = w.related.map(r => {
    const target = WORDS.find(x => x.id === r.id);
    if (!target) return '';
    const cls = r.type === '対' ? 'tai' : r.type === '参' ? 'san' : '';
    return `<button class="chip" onclick="event.stopPropagation();openWordModal(${r.id})"><span class="chip-type ${cls}">${r.type}</span>${target.word}</button>`;
  }).join('');
  return `<div class="related-block"><span class="related-label">関連語</span>${chips}</div>`;
}

// Modal
let lastFocused = null;
function trapFocus(e) {
  const modal = document.querySelector('.modal');
  if (!modal) return;
  if (e.key !== 'Tab') return;
  const focusable = modal.querySelectorAll(
    'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
  );
  if (focusable.length === 0) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  if (e.shiftKey) {
    if (document.activeElement === first) { e.preventDefault(); last.focus(); }
  } else {
    if (document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
}
function closeModal() {
  document.getElementById('modal-root').innerHTML = '';
  document.removeEventListener('keydown', modalKeyHandler);
  document.removeEventListener('keydown', trapFocus);
  if (lastFocused && document.contains(lastFocused)) {
    lastFocused.focus();
  }
  lastFocused = null;
}
function modalKeyHandler(e) {
  if (e.key === 'Escape') closeModal();
}

function studyNow(id) {
  closeModal();
  currentCard = WORDS.find(w => w.id === id);
  currentDirection = pickDirection();
  currentView = 'study';
  document.getElementById('tab-study').classList.add('active');
  document.getElementById('tab-list').classList.remove('active');
  cardStage = 0;
  renderCardFace();
}

function switchView(v) {
  currentView = v;
  const tabs = {study:'tab-study', list:'tab-list', stats:'tab-stats'};
  Object.entries(tabs).forEach(([key, id]) => {
    const el = document.getElementById(id);
    const active = key === v;
    el.classList.toggle('active', active);
    el.setAttribute('aria-selected', active ? 'true' : 'false');
    el.setAttribute('tabindex', active ? '0' : '-1');
  });
  render();
}
function setFilter(f) { listFilter = f; render(); }

function fmtDue(c) {
  if (c.phase === 'new') return '—';
  const diff = c.due - Date.now();
  if (diff <= 0) return 'now';
  if (diff < 60*MIN) return Math.max(1, Math.round(diff/MIN)) + 'm';
  if (diff < DAY) return Math.round(diff/(60*MIN)) + 'h';
  return Math.round(diff/DAY) + 'd';
}

function phaseLabel(p) {
  return { new:'新出', learning:'学習中', review:'復習', mastered:'習得' }[p];
}

  // === Streak ===

  const phasePct = (n) => total > 0 ? (n / total) * 100 : 0;
  const phaseHtml = `
    <div class="panel">
      <h2 class="panel-title">状 態 内 訳 <span class="panel-title-en">phase distribution</span></h2>
      <div class="phase-bar">
        ${s.newC > 0 ? `<div class="phase-seg new" style="flex:${phasePct(s.newC)};">${s.newC}</div>` : ''}

        ${(WORDS.length - s.newC - s.learnC - s.masteredC) > 0 ? `<div class="phase-seg review" style="flex:${phasePct(WORDS.length - s.newC - s.learnC - s.masteredC)};">${WORDS.length - s.newC - s.learnC - s.masteredC}</div>` : ''}
        ${s.masteredC > 0 ? `<div class="phase-seg mastered" style="flex:${phasePct(s.masteredC)};">${s.masteredC}</div>` : ''}
      </div>

        <div class="phase-legend-item"><div class="dot review"></div>復習 ${WORDS.length - s.newC - s.learnC - s.masteredC}</div>

  // === Heatmap (last 13 weeks = 91 days) ===

  const cells = [];
  let maxDay = 0;
  for (let i = HM_DAYS - 1; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(today.getDate() - i);
    const k = dateKey(d);
    const h = state.history[k];

    if (n <= 5) return 1;
    if (n <= 15) return 2;

  const fcMax = Math.max(...buckets, 1);
  const dayLabels = ['今日','+1','+2','+3','+4','+5','+6'];

function renderList() {
  updateStats();
  const area = document.getElementById('card-area');
  let words = WORDS.slice();

  // search filter
  if (searchQuery.trim()) {
    const q = searchQuery.trim().toLowerCase();
    words = words.filter(w =>
      w.word.toLowerCase().includes(q) ||
      w.meaning.toLowerCase().includes(q) ||
      w.pos.toLowerCase().includes(q)
    );
  }

  // phase filter
  if (listFilter !== 'all') {
    words = words.filter(w => state.cards[w.id].phase === listFilter);
  }

  // sort
  if (sortMode === 'index') {
    words.sort((a,b) => a.id - b.id);
  } else if (sortMode === 'phase') {
    words.sort((a,b) => {
      const ca = state.cards[a.id], cb = state.cards[b.id];
      const order = { learning: 0, review: 1, new: 2, mastered: 3 };
      if (order[ca.phase] !== order[cb.phase]) return order[ca.phase] - order[cb.phase];
      return ca.due - cb.due;
    });
  } else if (sortMode === 'aiueo') {
    words.sort((a,b) => a.word.localeCompare(b.word, 'ja'));
  } else if (sortMode === 'difficulty') {
    words.sort((a,b) => {
      const ca = state.cards[a.id], cb = state.cards[b.id];
      const da = ca.lapses * 2 - ca.ease;
      const db = cb.lapses * 2 - cb.ease;
      return db - da;
    });
  } else if (sortMode === 'due') {
    words.sort((a,b) => {
      const ca = state.cards[a.id], cb = state.cards[b.id];
      if (ca.phase === 'new' && cb.phase !== 'new') return 1;
      if (cb.phase === 'new' && ca.phase !== 'new') return -1;
      return ca.due - cb.due;
    });
  }

  const counts = {
    all: WORDS.length,
    new: WORDS.filter(w => state.cards[w.id].phase === 'new').length,
    learning: WORDS.filter(w => state.cards[w.id].phase === 'learning').length,
    review: WORDS.filter(w => state.cards[w.id].phase === 'review').length,
    mastered: WORDS.filter(w => state.cards[w.id].phase === 'mastered').length,
  };

  const rows = words.map(w => {
    const cs = state.cards[w.id];
    const idx = WORDS.findIndex(x => x.id === w.id) + 1;
    const meaningShort = w.meaning.replace(/。.*$/,'').slice(0,28);
    const metaText = cs.phase === 'new' ? 'new' : `i${cs.interval} · ${fmtDue(cs)}`;
    const phaseText = phaseLabel(cs.phase);
    return `
      <div class="row" role="button" tabindex="0" onclick="openWordModal(${w.id})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openWordModal(${w.id})}" aria-label="${w.word}, ${meaningShort}, 状態 ${phaseText}">
        <div class="row-num" aria-hidden="true">${String(idx).padStart(2,'0')}</div>
        <div>
          <div class="row-word" lang="ja">${w.word}</div>
          <div class="row-meaning">${meaningShort}</div>
        </div>
        <div class="row-status">
          <div class="row-meta" aria-hidden="true">${metaText}</div>
          <div class="dot ${cs.phase}" aria-hidden="true"></div>
        </div>
      </div>`;
  }).join('');

  // Check if list shell already exists (to preserve search input during IME)
  const existingRows = area.querySelector('#list-rows');
  if (existingRows) {
    // Only update rows + filter counts — don't touch search input
    existingRows.innerHTML = rows || '<div class="no-results">該当する単語がありません</div>';
    // Update filter button counts
    const filterBtns = area.querySelectorAll('.list-filter button');
    const countVals = [counts.all, counts.new, counts.learning, counts.review, counts.mastered];
    const countKeys = ['all', 'new', 'learning', 'review', 'mastered'];
    filterBtns.forEach((btn, i) => {
      btn.textContent = ['すべて','新出','学習中','復習','習得'][i] + ' ' + countVals[i];
      btn.className = listFilter === countKeys[i] ? 'active' : '';
      btn.setAttribute('aria-pressed', listFilter === countKeys[i]);
    });
    return;
  }

  // First render: create full list shell
  area.innerHTML = `
    <div class="list">
      <div class="controls">
        <label class="sr-only" for="search-input">単語検索</label>
        <input id="search-input" class="search-input" type="search" placeholder="検索 (語・意味・品詞)" value="${searchQuery.replace(/"/g,'&quot;')}" oninput="onSearchInput(this)" oncompositionstart="searchComposing=true" oncompositionend="onSearchCompositionEnd(this)" aria-label="単語を検索">
        <label class="sr-only" for="sort-select">並び替え</label>
        <select id="sort-select" class="sort-select" onchange="setSort(this.value)" aria-label="並び替え">
          <option value="index" ${sortMode==='index'?'selected':''}>収録順</option>
          <option value="aiueo" ${sortMode==='aiueo'?'selected':''}>五十音順</option>
          <option value="phase" ${sortMode==='phase'?'selected':''}>状態順</option>
          <option value="due" ${sortMode==='due'?'selected':''}>期限順</option>
          <option value="difficulty" ${sortMode==='difficulty'?'selected':''}>難易度順</option>
        </select>
      </div>
      <div class="list-filter" role="group" aria-label="状態フィルター">
        <button class="${listFilter==='all'?'active':''}" onclick="setFilter('all')" aria-pressed="${listFilter==='all'}" type="button">すべて ${counts.all}</button>
        <button class="${listFilter==='new'?'active':''}" onclick="setFilter('new')" aria-pressed="${listFilter==='new'}" type="button">新出 ${counts.new}</button>
        <button class="${listFilter==='learning'?'active':''}" onclick="setFilter('learning')" aria-pressed="${listFilter==='learning'}" type="button">学習中 ${counts.learning}</button>
        <button class="${listFilter==='review'?'active':''}" onclick="setFilter('review')" aria-pressed="${listFilter==='review'}" type="button">復習 ${counts.review}</button>
        <button class="${listFilter==='mastered'?'active':''}" onclick="setFilter('mastered')" aria-pressed="${listFilter==='mastered'}" type="button">習得 ${counts.mastered}</button>
      </div>
      <div id="list-rows">${rows || '<div class="no-results">該当する単語がありません</div>'}</div>
      <div class="legend">
        <div class="legend-item"><div class="dot new"></div>新出</div>
        <div class="legend-item"><div class="dot learning"></div>学習中</div>
        <div class="legend-item"><div class="dot review"></div>復習</div>
        <div class="legend-item"><div class="dot mastered"></div>習得</div>
      </div>
    </div>
  `;

  if (searchFocused) {
    const inp = area.querySelector('.search-input');
    if (inp) {
      inp.focus();
      const len = inp.value.length;
      inp.setSelectionRange(len, len);
    }
  }
}

let searchFocused = false;

  if (!currentCard) {
    currentCard = pickNextCard();

// =============== FIRST-ENCOUNTER QUIZ ===============
let quizState = null; // { word, options, correctIdx, answeredIdx, isCorrect }

function shortenMeaning(m) {
  let s = m.replace(/。\s*\(.*?\)\s*$/, '');
  s = s.replace(/。\s*\(.*?\)\s*$/, '');
  if (s.length > 38) s = s.slice(0, 36) + '…';
  return s;
}

// Extract keywords for similarity check
function meaningKeywords(m) {
  return m.replace(/[①②③④⑤⑥()（）「」〜]/g, '')
    .split(/[・、。\s\/]+/)
    .map(k => k.replace(/だ$|な$|する$|い$|を伴って$|の$/,'').trim())
    .filter(k => k.length >= 2);
}

// Check if two meanings share any keyword
function meaningOverlaps(a, b) {
  const kwA = meaningKeywords(a);
  const kwB = meaningKeywords(b);
  return kwA.some(ka => kwB.some(kb =>
    ka === kb || (ka.length >= 3 && kb.includes(ka)) || (kb.length >= 3 && ka.includes(kb))
  ));
}

function buildQuizOptions(targetWord) {
  const correctMeaning = shortenMeaning(targetWord.meaning);
  // Pick 3 distractors: prefer same pos, but exclude words with overlapping meanings
  const samePos = WORDS.filter(w => w.id !== targetWord.id && w.pos === targetWord.pos);
  const others  = WORDS.filter(w => w.id !== targetWord.id && w.pos !== targetWord.pos);
  const pool = [...shuffle(samePos), ...shuffle(others)];
  const seenMeanings = new Set([correctMeaning]);
  const distractors = [];
  for (const w of pool) {
    const m = shortenMeaning(w.meaning);
    if (seenMeanings.has(m)) continue;
    // Skip if meaning shares keywords with correct answer
    if (meaningOverlaps(correctMeaning, m)) continue;
    seenMeanings.add(m);
    distractors.push(m);
    if (distractors.length === 3) break;
  }
  const options = shuffle([correctMeaning, ...distractors]);
  return { options, correctIdx: options.indexOf(correctMeaning) };
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderQuizFace() {
  const area = document.getElementById('card-area');
  const w = currentCard;
  const c = state.cards[w.id];

  if (!quizState || quizState.wordId !== w.id) {
    const built = buildQuizOptions(w);
    quizState = {
      wordId: w.id,
      options: built.options,
      correctIdx: built.correctIdx,
      answeredIdx: null,
      isCorrect: null,
      dontKnow: false,
    };
  }

  const answered = quizState.answeredIdx !== null || quizState.dontKnow;

  const optsHtml = quizState.options.map((opt, i) => {
    let cls = 'quiz-opt';
    if (answered) {
      if (i === quizState.correctIdx) cls += ' correct';
      else if (i === quizState.answeredIdx) cls += ' wrong';
    }
    return `<button class="${cls}" onclick="answerQuiz(${i})" ${answered?'disabled':''} type="button">
      <span class="quiz-opt-num">${'①②③④'[i]}</span><span>${opt}</span>
    </button>`;
  }).join('');

  const dontKnowHtml = answered ? '' : `
    <button class="quiz-opt dontknow" onclick="answerQuiz(-1)" type="button">わからない</button>
  `;

  let resultHtml = '';
  let continueHtml = '';
  if (answered) {
    if (quizState.isCorrect) {
      resultHtml = `<div class="quiz-result">正解。「${w.word}」=${shortenMeaning(w.meaning)}</div>`;
    } else if (quizState.dontKnow) {
      resultHtml = `<div class="quiz-result wrong">「${w.word}」=${shortenMeaning(w.meaning)}<br><small class="text-muted">焦らずいきましょう</small></div>`;
    } else {
      resultHtml = `<div class="quiz-result wrong">不正解。正しくは「${w.word}」=${shortenMeaning(w.meaning)}</div>`;
    }
    const btnLabel = (!quizState.isCorrect && !settings.showDetailOnWrong) ? '次 へ' : '詳 細 を 見 る';
    continueHtml = `<button class="quiz-continue" onclick="finishQuiz()" type="button">${btnLabel}</button>`;
  }

  area.innerHTML = `
    <div class="card">
      ${cardHeaderHtml(c, wordIdx(w), {badge: c.phase === 'new' ? '初出 4択' : '再確認 4択', mb8: true})}
      <div class="word-pos">${w.pos}</div>
      <div class="word-jp">${w.word}</div>
      <div class="quiz-prompt">意 味 は ど れ か</div>
      <div class="quiz-options">
        ${optsHtml}
        ${dontKnowHtml}
      </div>
      ${resultHtml}
      ${continueHtml}
    </div>
  `;
}

function answerQuiz(idx) {
  if (!quizState) return;
  if (idx === -1) {
    quizState.dontKnow = true;
    quizState.isCorrect = false;
    sfxAgain();
  } else {
    quizState.answeredIdx = idx;
    quizState.isCorrect = (idx === quizState.correctIdx);
    if (quizState.isCorrect) sfxGood(); else sfxAgain();
  }
  renderQuizFace();
}

function finishQuiz() {
  if (!currentCard || !quizState) return;
  const c = state.cards[currentCard.id];
  const wasNew = c.phase === 'new';
  const wasReview = c.phase === 'review' || c.phase === 'mastered';
  const wasCorrect = !!quizState.isCorrect;
  c.quizPassed = wasCorrect;
  const q = wasCorrect ? 2 : 0;
  applyRating(c, q);
  c.lastReviewedAt = Date.now();
  state.lastShownId = currentCard.id;
  if (wasNew) state.daily.newDone += 1;
  else if (wasReview) state.daily.reviewDone += 1;
  recordReview(wasNew);
  saveState();
  quizState = null;

  if (!wasCorrect && !settings.showDetailOnWrong) {
    currentCard = null;
    cardStage = 0;
    render();
    return;
  }

  renderQuizDetail();
}

function renderQuizDetail() {
  const area = document.getElementById('card-area');
  const w = currentCard;
  const c = state.cards[w.id];

  area.innerHTML = `
    <div class="stage-card" id="quiz-detail">
      ${cardHeaderHtml(c, wordIdx(w), {})}
      <div class="word-pos">${w.pos}</div>
      <div class="word-jp">${w.word}</div>
      <div class="meaning-block mt-14">
        <div class="meaning-label">意　味</div>
        <div class="meaning-text">${w.meaning}</div>
      </div>
      <div class="mt-14">${wordInfoHtml(w)}</div>
      <button class="quiz-continue mt-auto" onclick="advanceFromDetail()" type="button">次 へ</button>
    </div>
  `;
}

function advanceFromDetail() {
  currentCard = null;
  cardStage = 0;
  render();
}


// Stage-based card state (Lexicon-style)
let cardStage = 0; // 0=word only, 1=full reveal
const STAGE_COUNT = 2;

function renderCardFace() {
  const area = document.getElementById('card-area');
  const w = currentCard;
  const c = state.cards[w.id];

  if (!c.quizPassed) {
    renderQuizFace();
    return;
  }

  const dirTag = currentDirection === 'word2meaning' ? 'word → meaning' : 'meaning → word';
  const fullyOpen = cardStage >= 1;

  // Stage progress dots (2 dots)
  const dots = Array.from({length: STAGE_COUNT}, (_, i) =>
    `<div class="stage-dot ${i < cardStage ? 'passed' : i === cardStage ? 'active' : ''}"></div>`
  ).join('');

  // === Stage 0: prompt ===
  let stage0;
  if (currentDirection === 'word2meaning') {
    stage0 = `
      <div class="stage-section">
        <div class="word-pos">${w.pos}</div>
        <div class="word-jp">${w.word}</div>
      </div>
    `;
  } else {
    stage0 = `
      <div class="stage-section">
        <div class="word-pos">${w.pos}</div>
        <div class="meaning-prompt">${w.meaning}</div>
      </div>
    `;
  }

  // === Stage 1: full reveal ===
  let stage1 = '';
  if (cardStage >= 1) {
    let revealTop;
    if (currentDirection === 'word2meaning') {
      revealTop = `
        <div class="meaning-block">
          <div class="meaning-label">意　味</div>
          <div class="meaning-text">${w.meaning}</div>
        </div>
      `;
    } else {
      revealTop = `
        <div class="text-center">
          <div class="word-back">${w.word}</div>
          <div class="word-back-pos">${w.pos}</div>
        </div>
      `;
    }

    stage1 = `
      <div class="stage-section mt-14">
        ${revealTop}
        <div class="mt-14">${wordInfoHtml(w)}</div>
      </div>
    `;
  }

  // Footer
  let footer;
  if (!fullyOpen) {
    footer = `<div class="tap-hint mt-auto">tap / space to reveal</div>`;
  } else {
    footer = `
      <div class="ratings two-btn mt-auto" role="group" aria-label="評価">
        <button class="rate-btn" data-q="0" onclick="rate(0)" aria-label="あし(忘れた)、次回は${previewInterval(c,0)}後" type="button"><span class="jp" aria-hidden="true">あし</span><span class="interval" aria-hidden="true">${previewInterval(c,0)}</span></button>
        <button class="rate-btn" data-q="2" onclick="rate(2)" aria-label="よし、次回は${previewInterval(c,2)}後" type="button"><span class="jp" aria-hidden="true">よし</span><span class="interval" aria-hidden="true">${previewInterval(c,2)}</span></button>
      </div>
    `;
  }

  area.innerHTML = `
    <div class="stage-card" id="stage-card">
      <span class="swipe-indicator left" id="swipe-left">あし</span>
      <span class="swipe-indicator right" id="swipe-right">よし</span>
      ${cardHeaderHtml(c, wordIdx(w), {dirTag})}
      <div class="stage-progress" aria-hidden="true">${dots}</div>
      ${stage0}
      ${stage1}
      ${footer}
    </div>
  `;

  attachStageInteractions();
}

let swipeAbort = null; // AbortController for document-level swipe listeners

function attachStageInteractions() {
  const card = document.getElementById('stage-card');
  if (!card) return;

  // Clean up previous document-level listeners
  if (swipeAbort) { swipeAbort.abort(); swipeAbort = null; }

  // Tap-to-advance (only on the card surface, not on rate buttons / chips)
  card.addEventListener('click', (e) => {
    if (e.target.closest('.rate-btn')) return;
    if (e.target.closest('.chip')) return;
    if (cardStage < STAGE_COUNT - 1) {
      advanceStage();
    }
  });

  // Swipe handling (only when fully open)
  if (cardStage < STAGE_COUNT - 1) return;

  swipeAbort = new AbortController();
  const signal = swipeAbort.signal;

  let startX = 0, startY = 0, currentX = 0, dragging = false;
  const SWIPE_THRESHOLD = 90;

  function onStart(e) {
    if (e.target.closest('.rate-btn') || e.target.closest('.chip')) return;
    const t = e.touches ? e.touches[0] : e;
    startX = t.clientX;
    startY = t.clientY;
    currentX = 0;
    dragging = true;
    card.classList.add('dragging');
  }
  function onMove(e) {
    if (!dragging) return;
    const t = e.touches ? e.touches[0] : e;
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;
    if (Math.abs(dy) > Math.abs(dx) * 1.4 && Math.abs(dy) > 10) {
      dragging = false;
      card.classList.remove('dragging');
      card.style.transform = '';
      const sl = document.getElementById('swipe-left');
      const sr = document.getElementById('swipe-right');
      if (sl) sl.classList.remove('show');
      if (sr) sr.classList.remove('show');
      return;
    }
    if (e.cancelable && Math.abs(dx) > 8) e.preventDefault();
    currentX = dx;
    const rot = dx * 0.05;
    card.style.transform = `translateX(${dx}px) rotate(${rot}deg)`;
    const sl = document.getElementById('swipe-left');
    const sr = document.getElementById('swipe-right');
    if (sl) sl.classList.toggle('show', dx < -30);
    if (sr) sr.classList.toggle('show', dx > 30);
  }
  function onEnd() {
    if (!dragging) return;
    dragging = false;
    card.classList.remove('dragging');
    if (currentX < -SWIPE_THRESHOLD) {
      card.classList.add('swipe-left');
      setTimeout(() => rate(0), 180);
    } else if (currentX > SWIPE_THRESHOLD) {
      card.classList.add('swipe-right');
      setTimeout(() => rate(2), 180);
    } else {
      card.style.transform = '';
      const sl = document.getElementById('swipe-left');
      const sr = document.getElementById('swipe-right');
      if (sl) sl.classList.remove('show');
      if (sr) sr.classList.remove('show');
    }
  }

  card.addEventListener('touchstart', onStart, { passive: true });
  card.addEventListener('touchmove', onMove, { passive: false });
  card.addEventListener('touchend', onEnd);
  card.addEventListener('mousedown', onStart);
  document.addEventListener('mousemove', onMove, { signal });
  document.addEventListener('mouseup', onEnd, { signal });
}

function advanceStage() {
  if (cardStage >= STAGE_COUNT - 1) return;
  cardStage += 1;
  sfxFlip();
  renderCardFace();
}

function rate(q) {
  if (!currentCard) return;
  const c = state.cards[currentCard.id];
  const wasNew = c.phase === 'new';
  const wasReview = c.phase === 'review' || c.phase === 'mastered';

  if (q === 0) sfxAgain();
  else if (q === 1) sfxHard();
  else if (q === 2) sfxGood();
  else if (q === 3) sfxEasy();

  applyRating(c, q);
  if (q === 0) c.quizPassed = false;
  c.lastReviewedAt = Date.now();
  state.lastShownId = currentCard.id;

  if (wasNew) state.daily.newDone += 1;
  else if (wasReview) state.daily.reviewDone += 1;

  recordReview(wasNew);

  saveState();
  currentCard = null;
  render();
}

function resetProgress() {
  if (!confirm('学習履歴をすべてリセットしますか?')) return;
  localStorage.removeItem(STORAGE_KEY);
  state = defaultState();
  render();
}

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
  if (document.querySelector('.modal-overlay')) return;

  // Tab arrow navigation when focus is on a tab
  if (e.target.getAttribute('role') === 'tab') {
    const tabs = ['tab-study','tab-list','tab-stats'];
    const idx = tabs.indexOf(e.target.id);
    if (idx === -1) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      e.preventDefault();
      const next = e.key === 'ArrowRight' ? (idx + 1) % tabs.length : (idx - 1 + tabs.length) % tabs.length;
      const view = next === 0 ? 'study' : next === 1 ? 'list' : 'stats';
      switchView(view);
      document.getElementById(tabs[next]).focus();
      return;
    }
    if (e.key === 'Home') { e.preventDefault(); switchView('study'); document.getElementById('tab-study').focus(); return; }
    if (e.key === 'End')  { e.preventDefault(); switchView('stats'); document.getElementById('tab-stats').focus(); return; }
  }

  if (currentView !== 'study') return;
  if (!currentCard) return;
  if (cardStage < 1) {
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); advanceStage(); }
  } else {
    if (e.key === '1') rate(0);
    else if (e.key === '2') rate(2);
  }
});

loadTheme();
render();
</script>
