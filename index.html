  { id:71, word:"のたまふ", pos:"動ハ四", meaning:"おっしゃる(「言ふ」の尊敬語)", etym:"「宣(の)り給ふ」の縮約。貴人が言葉を発する動作の尊敬語。", example:"かくなむのたまふ。", translation:"このようにおっしゃる。", highlight:"のたまふ", source:"源氏物語", trivia:"「のたまはす」(id:72)はさらに高い尊敬。日常的に最も使われる「言ふ」の尊敬語。", related:[{id:72,type:"類"},{id:75,type:"対"}] },
  { id:72, word:"のたまはす", pos:"動サ下二", meaning:"おっしゃる(「のたまふ」より高い尊敬)", etym:"「のたまふ」+使役・尊敬「す」。最高敬語。", example:"院、しかのたまはす。", translation:"院が、そのようにおっしゃる。", highlight:"のたまはす", source:"源氏物語", trivia:null, related:[{id:71,type:"類"}] },
  { id:73, word:"きこゆ", pos:"動ヤ下二", meaning:"①聞こえる ②申し上げる(「言ふ」の謙譲) ③評判だ・有名だ", etym:"「聞こ+ゆ(自発)」。聞こえてくる→評判になる、また謙譲にも転用。", example:"鐘の音のきこゆるなり。｜うけたまはりきこゆ。｜世にきこゆる人。", translation:"鐘の音が聞こえる。｜承り申し上げる。｜世に評判の人。", highlight:"きこゆる｜きこゆ｜きこゆる", source:"枕草子｜源氏物語｜源氏物語", trivia:null, related:[{id:75,type:"類"},{id:268,type:"類"},{id:74,type:"類"},{id:217,type:"対"}] },
  { id:74, word:"きこえさす", pos:"動サ下二", meaning:"申し上げる(「きこゆ」より高い謙譲)", etym:"「きこゆ」+「さす」。最高謙譲。", example:"宮にきこえさせ給ふ。", translation:"宮に申し上げなさる。", highlight:"きこえさせ", source:"源氏物語", trivia:null, related:[{id:75,type:"類"},{id:73,type:"類"}] },
  { id:75, word:"まうす", pos:"動サ四", meaning:"①申し上げる(「言ふ」の謙譲語) ②〜し申し上げる(謙譲補助動詞)", etym:"「申(まう)す」。「言ふ」の謙譲語。自分の発言を低める。", example:"かくなむとまうし給ひぬ。｜御供にまうす。", translation:"このようにと申し上げなさった。｜お供をいたす。", highlight:"まうし｜まうす", source:"源氏物語｜源氏物語", trivia:"補助動詞としての用法(②)が古文では圧倒的多数。「読みまうす」=読み申し上げる。本動詞の「いたす(す の謙譲)」の意は限定的。", related:[{id:74,type:"類"},{id:71,type:"対"},{id:73,type:"類"},{id:215,type:"参"},{id:498,type:"参"}] },
  { id:76, word:"はべり", pos:"動ラ変", meaning:"①あります・おります(丁寧) ②お仕えする(謙譲)", etym:"「侍(はべ)り」。貴人のそば近くに仕える意から、丁寧語へ。", example:"昔、男ありはべりけり。｜御前にはべる女房たち。", translation:"昔、男がおりました。｜御前にお仕えする女房たち。", highlight:"はべり｜はべる", source:"伊勢物語｜枕草子", trivia:"古文の最重要丁寧語。", related:[{id:77,type:"類"}] },
  { id:77, word:"さぶらふ", pos:"動ハ四", meaning:"①お仕えする(謙譲) ②あります(丁寧)", etym:"「候(さぶら)ふ」=身分の高い人のそばに控える。", example:"御前にさぶらふ女房。｜さぶらふ人あまたあり。", translation:"御前にお仕えする女房。｜お仕えしている人が大勢いる。", highlight:"さぶらふ｜さぶらふ", source:"枕草子｜源氏物語", trivia:"中世以降「さうらふ」と発音。", related:[{id:76,type:"類"},{id:322,type:"類"},{id:371,type:"類"}] },
  { id:78, word:"まゐる", pos:"動ラ四", meaning:"①参上する(謙譲) ②差し上げる ③召し上がる(尊敬)", etym:"「参(まゐ)る」。本来「行く・来」の謙譲だが、「食ふ・飲む」の尊敬にも。", example:"内裏にまゐる。｜御薬をまゐらす。｜御粥などまゐれ。", translation:"宮中に参上する。｜お薬を差し上げる。｜お粥などを召し上がれ。", highlight:"まゐる｜まゐらす｜まゐれ", source:"源氏物語｜源氏物語｜枕草子", trivia:"文脈で謙譲か尊敬か判断する語。", related:[{id:81,type:"類"},{id:79,type:"対"},{id:70,type:"対"},{id:491,type:"類"}] },
  { id:79, word:"まかる", pos:"動ラ四", meaning:"①退出する(謙譲) ②出かける・参る(丁重語=聞き手への敬意)", etym:"「罷(まか)る」=高貴な場から下がる。", example:"宮よりまかで給ひぬ。｜東国にまかる人。", translation:"宮中から退出なさった。｜東国に下る人。", highlight:"まかで｜まかる", source:"源氏物語｜源氏物語", trivia:"「まゐる」の対義語。①は主君の前からの退出、②は相手に敬意を示す丁重語(=「参ります/出かけます」)。", related:[{id:78,type:"対"},{id:491,type:"参"},{id:532,type:"参"}] },
  { id:80, word:"たまふ", pos:"動ハ四・下二", meaning:"①お与えになる(四段・尊敬) ②〜なさる(四段・尊敬補助動詞) ③〜ております(下二段・謙譲丁重)", etym:"「賜ふ」。神仏や貴人が下々に与える意。", example:"御衣一かさね賜ひたり。｜読み給ひし御文。｜つかうまつらせ給ひて。", translation:"お召し物を一重ねお与えになった。｜お読みになったお手紙。｜お仕え申し上げさせて。", highlight:"賜ひ｜給ひ｜給ひ", source:"枕草子｜源氏物語｜源氏物語", trivia:"四段(尊敬)と下二段(謙譲丁重)で意味が逆。下二段「たまふ」は「思ひたまふ=思っております」のように話し手が自分の動作をへりくだる。", related:[{id:321,type:"対"},{id:550,type:"類"}] },
  { id:81, word:"たてまつる", pos:"動ラ四", meaning:"①差し上げる(謙譲) ②〜し申し上げる(謙譲補助動詞) ③お召しになる・召し上がる・お乗りになる(尊敬)", etym:"「奉る」。神仏に物を捧げる原義から。", example:"御文たてまつる。｜見たてまつりて涙ぐむ。｜御衣たてまつる帝。", translation:"お手紙を差し上げる。｜拝見して涙ぐむ。｜お召し物をお召しになる帝。", highlight:"たてまつる｜たてまつり｜たてまつる", source:"源氏物語｜源氏物語｜(作例)", trivia:"謙譲語が基本だが、貴人を主語として「着る・食べる」の意でも使われる(例:「御衣たてまつる」=お召しになる)。文脈で謙譲か尊敬かを判断。", related:[{id:321,type:"参"},{id:78,type:"類"}] },
  { id:82, word:"おぼす", pos:"動サ四", meaning:"お思いになる(「思ふ」の尊敬語)", etym:"「思(おも)ほす」の縮約。「思ふ」の尊敬語で、貴人の心理を表す。", example:"いとあはれとおぼす。", translation:"たいそうしみじみとお思いになる。", highlight:"おぼす", source:"源氏物語", trivia:null, related:[{id:83,type:"類"},{id:217,type:"参"}] },
  { id:83, word:"おぼしめす", pos:"動サ四", meaning:"お思いになる(「おぼす」より高い尊敬)", etym:"「おぼす」+「めす」。最高敬語。", example:"君、いかにおぼしめすにか。", translation:"あなたは、どのようにお思いになるか。", highlight:"おぼしめす", source:"源氏物語", trivia:null, related:[{id:82,type:"類"}] },
  { id:84, word:"おもほゆ", pos:"動ヤ下二", meaning:"自然と思われる・思い出される", etym:"「思(おも)ふ」+自発「ゆ」。", example:"昔のことぞおもほゆる。", translation:"昔のことが自然と思い出される。", highlight:"おもほゆる", source:"万葉集", trivia:null, related:[{id:85,type:"類"},{id:213,type:"参"}] },
  { id:85, word:"おぼゆ", pos:"動ヤ下二", meaning:"①自然と思われる ②思い出される ③似ている", etym:"「思ふ」+自発「ゆ」。自然に心にわき上がる感覚を表す。", example:"いとあはれにおぼゆ。｜昔のことぞおぼゆる。｜父君によくおぼえたり。", translation:"たいそうしみじみと感じられる。｜昔のことが思い出される。｜父君によく似ている。", highlight:"おぼゆ｜おぼゆる｜おぼえ", source:"源氏物語｜伊勢物語｜源氏物語", trivia:null, related:[{id:84,type:"類"},{id:213,type:"類"}] },
  { id:86, word:"ながむ", pos:"動マ下二", meaning:"①物思いにふける ②じっと見つめる", etym:"「眺む」。「長雨(ながめ)」とかけ詞になることが多い。", example:"いたづらにながめせしまに。｜月をながめたまふ。", translation:"むなしく物思いにふけっている間に。｜月をじっとご覧になる。", highlight:"ながめ｜ながめ", source:"古今集・小野小町｜源氏物語", trivia:"小野小町歌の「ながめ」は「眺め」と「長雨」の掛詞。", related:[{id:25,type:"類"}] },
  { id:87, word:"あく", pos:"動カ四", meaning:"①満足する・堪能する ②飽きる・嫌になる", etym:"「飽く」=十分に満たされる。和歌では「あかず」(=いつまでも見飽きない)の形で頻出。", example:"見れど飽かぬかも。｜世に飽きにけり。", translation:"見ても見ても満足しないことよ。｜世の中に嫌気がさしてしまった。", highlight:"飽か｜飽き", source:"万葉集｜源氏物語", trivia:"「飽く」と書く。「飽かず」=満足しない、いつまでも見ていたい、の意で和歌に頻出。", related:[{id:89,type:"参"}] },
  { id:88, word:"あふ", pos:"動ハ四", meaning:"①出会う ②結婚する ③(下二段で)合致する", etym:"「会ふ・逢ふ・合ふ」。和歌では「逢ふ」は男女が結ばれる意で使われることが多い。", example:"夢にあひ見し人ぞ。｜この女とあひにけり。｜思ひとこころとあひて。", translation:"夢で出会った人よ。｜この女性と結婚した。｜思いと心とが合致して。", highlight:"あひ｜あひ｜あひ", source:"古今集｜伊勢物語｜源氏物語", trivia:"和歌では「逢ふ」=男女の関係。", related:[{id:551,type:"類"},{id:515,type:"参"},{id:156,type:"類"}] },
  { id:89, word:"あく", pos:"動カ下二", meaning:"①夜が明ける・明るくなる ②(門・戸などが)開く・空く", etym:"「明く」。四段活用。「夜が明く」「門(かど)を明く」など。「飽く」(id:87)とは別語。", example:"東の空明けゆく。｜門をあけて出づ。", translation:"東の空が明けていく。｜門を開いて出る。", highlight:"明け｜あけ", source:"枕草子｜源氏物語", trivia:"①夜の明けは「明く」、②門・戸を開くは「開く」と書き分けるが、読み(あく)は同じ。文脈で判断。「飽く(id:87)」とも同音異義。", related:[{id:87,type:"参"},{id:90,type:"対"}] },
  { id:90, word:"くる", pos:"動ラ下二", meaning:"①(日が)暮れる ②(心が)暮れる・途方に暮れる", etym:"「暮る」。一日や季節の終わり。", example:"やうやう日くれて。｜思ひくるることあり。", translation:"だんだん日が暮れて。｜途方に暮れることがある。", highlight:"くれ｜くるる", source:"源氏物語｜源氏物語", trivia:null, related:[{id:89,type:"対"}] },
  { id:91, word:"おどろかす", pos:"動サ四", meaning:"①知らせる・気づかせる(手紙を出す・声をかける) ②目を覚まさせる ③驚かせる", etym:"「おどろく」(id:14)の他動詞形(使役的)。相手の注意を引く・目を覚まさせる。", example:"さるべき人をおどろかし給へ。｜夜の明けぐれにおどろかされて。｜雷に人おどろかす。", translation:"しかるべき人にお知らせなさいませ。｜夜明けの薄暗いころに目を覚まさせられて。｜雷が人をびっくりさせる。", highlight:"おどろかし｜おどろかさ｜おどろかす", source:"源氏物語｜枕草子｜(作例)", trivia:"「驚かす」は現代語の意味。古文では「声をかけて注意を引く」「手紙で知らせる」が中心。", related:[{id:14,type:"類"}] },
  { id:92, word:"あくがる", pos:"動ラ下二", meaning:"①魂が体から離れさまよう ②心がうわの空になる", etym:"「あく(離)」+「かる(離)」。", example:"もの思へばさはの蛍もわが身よりあくがれいづる魂かとぞみる。｜心あくがれてものも手につかず。", translation:"物思いにふければ沢の蛍も我が身から抜け出した魂かと見える。｜心がうわの空で何も手につかない。", highlight:"あくがれ｜あくがれ", source:"後拾遺集・和泉式部｜源氏物語", trivia:"和泉式部の名歌。", related:[{id:309,type:"類"},{id:202,type:"参"}] },
  { id:93, word:"ふ", pos:"動ハ下二", meaning:"①(月日が)経過する ②(場所を)通り過ぎる", etym:"「経(ふ)」。下二段活用。時間の経過・場所の通過を表す基本語。", example:"月日のふるままに。｜年ふれば。", translation:"月日が経つにつれて。｜年が経てば。", highlight:"ふる｜ふれ", source:"源氏物語｜万葉集", trivia:"古今集の「ふる」は「経る」と「降る」の掛詞によく使われる。", related:[{id:228,type:"参"},{id:57,type:"類"},{id:318,type:"類"}] },
  { id:94, word:"ためらふ", pos:"動ハ四", meaning:"①(感情を)抑える・こらえる・落ち着ける ②(病が)快方に向かう", etym:"「タムル」と関連。気持ちを抑制する。", example:"涙をためらひてのたまふ。｜御ここちためらひ給ひて。", translation:"涙をこらえておっしゃる。｜ご気分が落ち着かれて。", highlight:"ためらひ｜ためらひ", source:"源氏物語｜源氏物語", trivia:"現代語「ためらう(躊躇する)」とは全く別義。古文では「コントロールする・抑える」が中心。", related:[{id:278,type:"類"},{id:509,type:"類"}] },
  { id:95, word:"おこたる", pos:"動ラ四", meaning:"①病が治る・回復する ②怠ける", etym:"「怠る」。本来「気がゆるむ」で、病気の文脈では「峠を越える」。", example:"やうやうおこたり給ひて。｜おこたらず勤行す。", translation:"だんだん快方に向かわれて。｜怠ることなく勤行する。", highlight:"おこたり｜おこたら", source:"源氏物語｜徒然草", trivia:"古文では「治る」が頻出。", related:[{id:436,type:"対"}] },
  { id:96, word:"こころざす", pos:"動サ四", meaning:"①意図する ②愛情を寄せる ③贈り物をする", etym:"「心+差す」=心を特定の方向に向ける。意志・愛情・贈り物の三義がある。", example:"思ひのほかのこころざしとぞ見ゆる。｜女のもとにこころざし深し。｜こころざしの物奉る。", translation:"思いがけない愛情と見える。｜女性のもとへの愛情が深い。｜贈り物を差し上げる。", highlight:"こころざし｜こころざし｜こころざし", source:"源氏物語｜伊勢物語｜竹取物語", trivia:null, related:[{id:201,type:"類"}] },
  { id:97, word:"したたむ", pos:"動マ下二", meaning:"①整える・準備する ②食べる ③書きしるす", etym:"「したためる」=きちんと整える意の下二段動詞。漢字「認」を当てることも。", example:"旅立ちのしたくをしたたむ。｜強飯などしたためて。｜ふみをしたためて遣はす。", translation:"旅立ちの支度を整える。｜強飯などを食べて。｜手紙を書き記して送る。", highlight:"したたむ｜したため｜したため", source:"徒然草｜竹取物語｜源氏物語", trivia:null, related:[{id:214,type:"類"},{id:415,type:"類"}] },
  { id:98, word:"いとし", pos:"形シク", meaning:"①いとしい・かわいい ②つらい・切ない", etym:"動詞「いとふ(厭)」と同根。心が痛むほど大切。", example:"いとしと思す御子なり。｜いとしき人の別れかな。", translation:"いとしいとお思いになるお子だ。｜いとしい人との別れだなあ。", highlight:"いとし｜いとしき", source:"源氏物語｜(作例)", trivia:"「いとし(愛し)」は中世後期以降の語。平安期は「かなし」「らうたし」が同義。近世的な「切ない」の意もある。", related:[{id:31,type:"類"},{id:17,type:"類"}] },
  { id:99, word:"やんごとなし", pos:"形ク", meaning:"高貴だ・並々でない・捨てておけない", etym:"「止(や)む事無し」=放っておけない。", example:"やんごとなき御身。", translation:"高貴なお身分。", highlight:"やんごとなき", source:"源氏物語", trivia:"『源氏物語』冒頭「いとやんごとなき際にはあらぬが」。", related:[{id:168,type:"類"}] },
  { id:100, word:"いやしからず", pos:"連語", meaning:"身分が低くない・上品だ", etym:"「卑(いや)しからず」=「卑しくない」の連語。身分・品位が一定以上であることを婉曲に表す。", example:"いやしからぬ人の住む所。", translation:"上品な人が住む所。", highlight:"いやしからぬ", source:"枕草子", trivia:null, related:[{id:50,type:"対"},{id:417,type:"参"},{id:437,type:"参"},{id:463,type:"参"},{id:523,type:"参"}] },
  { id:101, word:"はかなし", pos:"形ク", meaning:"①ちょっとした ②頼りない ③むなしい", etym:"「果(はか)無し」=区切り・成果がない。", example:"はかなきことを言ひ立てて。｜はかなき御命なり。｜はかなく散る花。", translation:"ちょっとしたことを言い立てて。｜頼りないお命だ。｜むなしく散る花。", highlight:"はかなき｜はかなき｜はかなく", source:"枕草子｜源氏物語｜古今集", trivia:null, related:[{id:102,type:"対"},{id:250,type:"類"},{id:25,type:"類"},{id:267,type:"類"},{id:421,type:"類"},{id:503,type:"類"}] },
  { id:102, word:"はかばかし", pos:"形シク", meaning:"しっかりしている・きちんとしている", etym:"「果(はか)」を重ねた語。きちんとした成果。", example:"はかばかしき後見もなく。", translation:"しっかりした後見人もなく。", highlight:"はかばかしき", source:"源氏物語", trivia:"「はかなし」の対。", related:[{id:101,type:"対"},{id:504,type:"類"}] },
  { id:103, word:"いそぎ", pos:"名", meaning:"①準備・支度 ②急ぎ・急いですること", etym:"動詞「急ぐ」の名詞形。事を進める準備。", example:"御いそぎのことにて。｜いそぎまゐりたり。", translation:"ご準備のことで。｜急いで参上した。", highlight:"いそぎ｜いそぎ", source:"源氏物語｜源氏物語", trivia:"現代の「急ぐ」と意味が違う。「準備」が中心義。", related:[{id:362,type:"類"}] },
  { id:104, word:"ありさま", pos:"名", meaning:"①様子・状態 ②身の上・境遇 ③容姿", etym:"「在り様」=あること(存在)の様相。人の様子から事件の顛末まで幅広く使う。", example:"御ありさまをつぶさに見たてまつる。｜ありさまよき人の娘。｜かかるありさまにて過ぐす。", translation:"ご様子を詳しく拝見する。｜容姿のよい人の娘。｜このような境遇で過ごす。", highlight:"ありさま｜ありさま｜ありさま", source:"源氏物語｜源氏物語｜源氏物語", trivia:null, related:[{id:105,type:"類"},{id:117,type:"類"},{id:340,type:"類"}] },
  { id:105, word:"けしき", pos:"名", meaning:"①様子・態度 ②機嫌", etym:"「気色」。気配・雰囲気。現代の「景色」とは違う。", example:"人の御けしきをうかがふ。｜御けしきあしくなりぬ。", translation:"人の様子をうかがう。｜ご機嫌が悪くなった。", highlight:"けしき｜けしき", source:"源氏物語｜源氏物語", trivia:"古文では「気持ち・様子」、現代の自然風景の意は中世以降。", related:[{id:106,type:"類"},{id:178,type:"類"},{id:104,type:"類"},{id:107,type:"類"},{id:340,type:"類"}] },
  { id:106, word:"けはひ", pos:"名", meaning:"①気配・雰囲気 ②感じ・様子 ③人柄", etym:"「気配(けはひ)」。五感で総合的に捉えた場の空気感・人の気配。", example:"人のけはひして立ち止まる。｜なつかしきけはひの人。｜御けはひやむごとなき。", translation:"人の気配がして立ち止まる。｜親しみのある様子の人。｜お人柄が高貴だ。", highlight:"けはひ｜けはひ｜けはひ", source:"源氏物語｜源氏物語｜源氏物語", trivia:null, related:[{id:105,type:"類"}] },
  { id:107, word:"心ばへ", pos:"名", meaning:"①心遣い ②趣・風情", etym:"「心+延(は)へ」=心の広がり。心遣い・情趣の両義を持つ。", example:"心ばへあるさまに侍り。｜心ばへある御住まひ。", translation:"心がけのある様子でございます。｜趣のあるご住まい。", highlight:"心ばへ｜心ばへ", source:"枕草子｜源氏物語", trivia:null, related:[{id:105,type:"類"},{id:201,type:"類"},{id:203,type:"類"}] },
  { id:108, word:"うし", pos:"名", meaning:"主君・敬うべき方。(同音の「憂し(つらい)」とは別語)", etym:"「主(うし)」。上代から、主人・主君を敬って呼ぶ語。形容詞「憂し」とは別語。", example:"わがうしの仰せ。", translation:"わが主君の仰せ。", highlight:"うし", source:"万葉集", trivia:"上代の敬称「大人(うし)」。形容詞「憂し」(id:32)とは無関係。", related:[{id:32,type:"参"}] },
  { id:109, word:"いまそかり", pos:"動ラ変", meaning:"いらっしゃる(尊敬)", etym:"「今+そ(強意)+かり(あり)」。上代の尊敬語。中古以降「おはす」に取って代わられた。", example:"昔、男いまそかりけり。", translation:"昔、男がいらっしゃった。", highlight:"いまそかり", source:"伊勢物語", trivia:null, related:[{id:69,type:"類"}] },
  { id:110, word:"おとど", pos:"名", meaning:"大臣・貴人の敬称", etym:"「大殿(おほとの)」の音便。太政大臣・左大臣・右大臣といった最高位者への敬称。", example:"左のおとどの御むすめ。", translation:"左大臣のお嬢様。", highlight:"おとど", source:"源氏物語", trivia:null, related:[{id:111,type:"類"},{id:112,type:"参"}] },
  { id:111, word:"うへ", pos:"名", meaning:"①帝・天皇 ②奥様", etym:"「上(うへ)」=最高の位にいる方。帝・中宮・女院など文脈で指す人が変わる。", example:"うへの御けしきいかに。｜北の方のうへはいかに。", translation:"帝のご様子はいかに。｜正妻の奥方はいかに。", highlight:"うへ｜うへ", source:"源氏物語｜源氏物語", trivia:null, related:[{id:112,type:"類"},{id:389,type:"参"},{id:407,type:"参"},{id:110,type:"類"},{id:423,type:"参"}] },
  { id:112, word:"みかど", pos:"名", meaning:"①天皇 ②朝廷", etym:"「御門(みかど)」=皇居の門→天皇。", example:"みかど姫君を召す。｜みかどに仕へまつる。", translation:"天皇が姫君をお召しになる。｜天皇(=朝廷)にお仕え申し上げる。", highlight:"みかど｜みかど", source:"竹取物語｜源氏物語", trivia:null, related:[{id:111,type:"類"},{id:110,type:"参"},{id:273,type:"参"}] },
  { id:113, word:"ぐす", pos:"動サ変", meaning:"①伴う・連れる ②備える", etym:"漢語「具(ぐ)す」。サ変動詞として「伴う」「備える」の意で幅広く使う。", example:"妻子をぐして山に入る。｜才もぐしたる人にて。", translation:"妻子を連れて山に入る。｜才能も備えている人で。", highlight:"ぐして｜ぐし", source:"今昔物語集｜源氏物語", trivia:null, related:[{id:377,type:"参"}] },
  { id:114, word:"あそぶ", pos:"動バ四", meaning:"①詩歌・管弦を楽しむ ②遊ぶ", etym:"平安貴族にとっての「遊び」は詩歌管弦が中心。現代語より高雅な行為を指す。", example:"管弦あそびにて夜を明かす。｜子どものあそぶ声聞こゆ。", translation:"管弦の遊びをして夜を明かす。｜子どもが遊ぶ声が聞こえる。", highlight:"あそび｜あそぶ", source:"源氏物語｜源氏物語", trivia:null, related:[{id:243,type:"参"},{id:244,type:"参"}] },
  { id:115, word:"ことわり", pos:"名・形動", meaning:"①道理・筋道 ②もっともなこと", etym:"「事+割り」=物事を道理に沿って分けること。転じて「当然の筋道」「もっともなこと」。", example:"げに、ことわりなることなり。｜ことわりをも申す。", translation:"なるほど、もっともなことだ。｜道理も申し上げる。", highlight:"ことわり｜ことわり", source:"徒然草｜源氏物語", trivia:null, related:[{id:116,type:"参"},{id:505,type:"参"},{id:477,type:"参"},{id:351,type:"類"}] },
  { id:116, word:"ためし", pos:"名", meaning:"①前例・先例 ②試し", etym:"「試(ため)し」。過去に行われた事例を参照する語。「前例」が古文での中心義。", example:"古きためしを引きていはく。｜ためしにただひと枝折りたる。", translation:"古い前例を引いて言うには。｜試みにただ一枝折ってみた。", highlight:"ためし｜ためし", source:"源氏物語｜伊勢物語", trivia:null, related:[{id:115,type:"参"},{id:508,type:"参"},{id:540,type:"参"}] },
  { id:117, word:"やうす", pos:"名", meaning:"様子・事情", etym:"漢語「様子(やうす)」。「けしき」「けはひ」「ありさま」と類義だが、より具体的な事情を含む。", example:"そのやうすを問ひ給ふ。", translation:"その事情をお尋ねになる。", highlight:"やうす", source:"源氏物語", trivia:null, related:[{id:104,type:"類"}] },
  { id:118, word:"やま", pos:"名", meaning:"①山 ②(特に)比叡山 ③山寺・寺", etym:"上代から。歌語ではしばしば男性原理。", example:"山の端にかかる月。｜山の座主とて参れる。｜山に入りて行ひしける。", translation:"山の端に月がかかる。｜比叡山の座主として参上した。｜山寺に入って修行した。", highlight:"山の端｜山の｜山に", source:"伊勢物語｜枕草子｜今昔物語集", trivia:null, related:[{id:124,type:"参"},{id:119,type:"参"}] },
  { id:119, word:"はる", pos:"名", meaning:"春", etym:"「張る」由来説は有力だが定説なし。草木の芽がふくらむ生命力の季節。", example:"春は、あけぼの。", translation:"春は明け方がよい。", highlight:"春", source:"枕草子", trivia:null, related:[{id:120,type:"参"},{id:121,type:"参"},{id:118,type:"参"},{id:122,type:"対"}] },
  { id:120, word:"なつ", pos:"名", meaning:"夏", etym:"「熱(なつ)」由来説。暑さの季節を表す上代からの基本語。", example:"夏は、夜。月のころはさらなり。", translation:"夏は夜がよい。月の出る頃は言うまでもない。", highlight:"夏", source:"枕草子", trivia:null, related:[{id:119,type:"参"},{id:121,type:"参"},{id:122,type:"対"}] },
  { id:121, word:"あき", pos:"名", meaning:"秋", etym:"「あ(明)く」=空気が澄む説、「飽(あ)く」=実りが満ちる説。", example:"秋は、夕暮れ。", translation:"秋は、夕暮れがよい。", highlight:"秋", source:"枕草子", trivia:null, related:[{id:119,type:"参"},{id:120,type:"参"},{id:184,type:"参"},{id:190,type:"参"}] },
  { id:122, word:"ふゆ", pos:"名", meaning:"冬", etym:"「殖(ふ)ゆ」=生命を内に殖やす、「冷(ひ)ゆ」由来説。", example:"冬は、つとめて。", translation:"冬は、早朝がよい。", highlight:"冬", source:"枕草子", trivia:null, related:[{id:119,type:"対"},{id:120,type:"対"},{id:185,type:"参"}] },
  { id:123, word:"つき", pos:"名", meaning:"①月(天体) ②月日・歳月", etym:"上代から。和歌では秋の月が最も多く詠まれ、無常・美・恋の象徴として機能する。", example:"月のいと明かき夜に。｜月日の過ぐるに従ひて。", translation:"月がとても明るい夜に。｜月日が過ぎるのに従って。", highlight:"月｜月日", source:"竹取物語｜源氏物語", trivia:null, related:[{id:411,type:"参"},{id:353,type:"参"},{id:535,type:"参"}] },
  { id:124, word:"はな", pos:"名", meaning:"①花(古文では特に桜) ②華やかさ・盛り", etym:"上代から。平安以降「花」と言えば桜。", example:"花の色は移りにけりな。｜花やかなる宴を開く。", translation:"桜の花の色はあせてしまったなあ。｜華やかな宴を開く。", highlight:"花｜花やか", source:"古今集・小野小町｜源氏物語", trivia:"奈良時代までは梅、平安以降は桜。", related:[{id:118,type:"参"},{id:238,type:"参"},{id:176,type:"参"}] },
  { id:125, word:"あきつ", pos:"名", meaning:"トンボ", etym:"古名「秋津」。日本(大和)の古名「秋津島」の語源とも。", example:"あきつ飛ぶ。", translation:"トンボが飛ぶ。", highlight:"あきつ", source:"万葉集", trivia:null, related:[{id:176,type:"参"}] },
  { id:126, word:"うぐひす", pos:"名", meaning:"鶯", etym:"鳴き声に由来する名。「ウグイス」の語源は不詳だが、奈良以前から記録がある。", example:"梅にうぐひす。", translation:"梅に鶯。", highlight:"うぐひす", source:"古今集", trivia:null, related:[{id:127,type:"類"}] },
  { id:127, word:"ほととぎす", pos:"名", meaning:"ホトトギス", etym:"鳴き声に由来。「ほととぎす」は夏の到来を告げる鳥として和歌で頻出。待ち望む対象として詠まれることが多い。", example:"ほととぎす鳴きつる方をながむればただ有明の月ぞ残れる。", translation:"ホトトギスが鳴いた方角を眺めると、ただ有明の月だけが空に残っているばかりだ。", highlight:"ほととぎす", source:"千載集・後徳大寺左大臣", trivia:"百人一首81番。後徳大寺実定の代表歌。", related:[{id:126,type:"類"}] },
  { id:128, word:"ひと", pos:"名", meaning:"①人 ②(特に)恋人・想い人", etym:"上代から。和歌では多く「恋人」を指す。", example:"人あまたある中に。｜忘らるる身をば思はずちかひてし人の命の惜しくもあるかな。", translation:"人が大勢いる中に。｜忘れられる我が身は思わない、誓った人の命が惜しいことだ。", highlight:"人｜人", source:"源氏物語｜拾遺集・右近", trivia:null, related:[{id:476,type:"参"},{id:202,type:"参"},{id:478,type:"参"},{id:480,type:"参"}] },
  { id:129, word:"をとこ", pos:"名", meaning:"①男 ②夫・恋人", etym:"「をとこ(男子)」。「を(雄)」+「と(人)」+「こ(子)」。成年男性を広く指し、特に恋人・夫の意で和歌に頻出。", example:"昔、をとこありけり。｜をとこの、通ひける女のもとに。", translation:"昔、男がいた。｜男(=恋人)が通っていた女のもとに。", highlight:"をとこ｜をとこ", source:"伊勢物語｜伊勢物語", trivia:"『伊勢物語』冒頭の定型句。", related:[{id:130,type:"対"}] },
  { id:130, word:"をうな", pos:"名", meaning:"女", etym:"「を(雌)+な(女)」。「をんな」とも。", example:"色好みなるをうな。", translation:"恋愛好みの女。", highlight:"をうな", source:"伊勢物語", trivia:null, related:[{id:129,type:"対"}] },
  { id:131, word:"わらは", pos:"名", meaning:"①子ども ②召使いの少年少女", etym:"「童(わらは)」。成人の儀礼(元服・裳着)を経る前の子ども全般を指す。", example:"わらはにてありし時。｜わらはべどもあまた来たり。", translation:"子どもであった時。｜召使いの子どもたちが大勢来た。", highlight:"わらは｜わらはべ", source:"土佐日記｜枕草子", trivia:null, related:[{id:134,type:"類"},{id:48,type:"類"}] },
  { id:132, word:"おきな", pos:"名", meaning:"老人(男性)", etym:"上代から。「翁(おきな)」は老齢の男を表す総称で、物語の導入で語り手として多用。", example:"今は昔、竹取の翁といふものありけり。", translation:"今となっては昔、竹取の翁という者がいた。", highlight:"翁", source:"竹取物語", trivia:"『竹取物語』冒頭。", related:[{id:133,type:"対"}] },
  { id:133, word:"おうな", pos:"名", meaning:"老女", etym:"「おきな」に対する「おうな」で、老齢の女。竹取物語の「媼(おうな)」が代表例。", example:"おうな、嬉しがりて。", translation:"老女は、喜んで。", highlight:"おうな", source:"竹取物語", trivia:null, related:[{id:132,type:"対"}] },
  { id:134, word:"ちご", pos:"名", meaning:"①幼児・赤ん坊 ②(寺の)稚児", etym:"「乳子(ちご)」=乳を飲む子。幼児の意から、寺院に仕える少年(稚児)の意にも派生。", example:"瓜にかきたるちごのかほ。｜寺のちごの遊ぶを見て。", translation:"瓜に描いた幼児の顔。｜寺の稚児が遊ぶのを見て。", highlight:"ちご｜ちご", source:"枕草子｜今昔物語集", trivia:null, related:[{id:131,type:"類"}] },
  { id:135, word:"うへびと", pos:"名", meaning:"宮中に仕える人・殿上人", etym:"「上(うへ)+人(びと)」=宮中の上(殿上の間)に昇ることを許された人。殿上人の別称。", example:"うへびとあまた集ふ。", translation:"殿上人が大勢集まる。", highlight:"うへびと", source:"源氏物語", trivia:"殿上人(うへびと)は四位・五位で昇殿を許された貴族。「地下(じげ)」(id:384)との身分差が、文中の敬語の「向き」(誰が誰に敬語を使うか)を判断する根拠になる。", related:[{id:384,type:"対"},{id:386,type:"参"},{id:417,type:"参"},{id:385,type:"参"},{id:387,type:"参"}] },
  { id:136, word:"まらうど", pos:"名", meaning:"客・来客", etym:"「稀人(まれびと)」が音変化。", example:"まらうど迎へに出でたり。", translation:"客を迎えに出てきた。", highlight:"まらうど", source:"竹取物語", trivia:null, related:[{id:137,type:"類"},{id:225,type:"類"}] },
  { id:137, word:"ともがら", pos:"名", meaning:"仲間・同類の人々", etym:"「友・輩(ともがら)」。同じ立場・志を共有する者の集まりを指す。", example:"同じともがらにてぞありける。", translation:"同じ仲間であったのだ。", highlight:"ともがら", source:"伊勢物語", trivia:null, related:[{id:136,type:"類"},{id:480,type:"類"}] },
  { id:138, word:"ものす", pos:"動サ変", meaning:"①ある・いる ②行く・来る ③する(代動詞)", etym:"「物+す」。具体的な動作をぼかして言う婉曲表現。", example:"いづちかものし給ふ。｜かくものしたる人あり。｜日々ものし給ふ。", translation:"どちらへいらっしゃるのか。｜このようにしている人がいる。｜日々お過ごしになる。", highlight:"ものし｜ものし｜ものし", source:"源氏物語｜徒然草｜源氏物語", trivia:"代動詞として「言ふ・書く・食ふ・見る」など様々な動詞の代わりをする。「かくものし給へ」=このようにお書きになれ。婉曲・丁寧な表現として用いられる。", related:[{id:376,type:"類"},{id:495,type:"類"}] },
  { id:139, word:"ふす", pos:"動サ四", meaning:"①横になる ②寝る", etym:"「伏(ふ)す」。横たわる動作を広く表す。病臥にも休息にも使う。", example:"日ごろ床にふし給ひて。｜ふして夜を明かしけり。", translation:"このごろ床に伏していらっしゃって。｜横になって夜を明かした。", highlight:"ふし｜ふし", source:"源氏物語｜伊勢物語", trivia:null, related:[{id:490,type:"類"}] },
  { id:140, word:"おく", pos:"動カ四", meaning:"①起きる ②(露・霜が)降りる", etym:"「起(お)く」。四段活用。人が起き上がることと、露や霜が降りること(置く)の二義。", example:"朝ぼらけにおきて見れば。｜露おく秋の野べかな。", translation:"夜明けに起きて見ると。｜露が置く秋の野辺だなあ。", highlight:"おき｜おく", source:"枕草子｜古今集", trivia:null, related:[{id:350,type:"参"}] },
  { id:141, word:"つく", pos:"動カ下二", meaning:"①(目に)つく・触れる ②気づく", etym:"「付(つ)く」。下二段。何かに接触する・気づく。目に付く・手に付くなど広義。", example:"目につく花の色かな。｜ことの心につきておもしろし。", translation:"目に入る花の色よ。｜物事の真意を理解してみると趣深い。", highlight:"につく｜につき", source:"源氏物語｜徒然草", trivia:null, related:[{id:551,type:"参"},{id:320,type:"参"}] },
  { id:142, word:"かづく", pos:"動カ四・下二", meaning:"①(下二)褒美として衣を与える・かけてやる ②(四段)頭にかぶる・いただく", etym:"「被(かづ)く」。頭にかぶる動作から、衣服を褒美として肩に掛けてやる意にも派生。", example:"御衣をかづけ給ふ。｜衣をかづきて泣き臥す。", translation:"お召し物を褒美としてお与えになる。｜衣を頭からかぶって泣き伏す。", highlight:"かづけ｜かづき", source:"伊勢物語｜源氏物語", trivia:"他動詞(与える)=下二段、自動詞(かぶる)=四段。活用の違いで意味が変わる重要語。たのむ(id:306)と同じパターン。", related:[{id:321,type:"参"}] },
  { id:143, word:"そす", pos:"動サ四", meaning:"①密かに言う・そっと伝える ②けしかける・そそのかす", etym:"「添(そ)す」。耳元でそっと言い添える動作。密かに伝える意。", example:"耳にそするやうにて。｜人をそそのかしそす。", translation:"耳元でそっと言うようにして。｜人をそそのかしけしかける。", highlight:"そするやう｜そそのかし", source:"源氏物語｜(作例)", trivia:null, related:[{id:315,type:"類"}] },
  { id:144, word:"のぼる", pos:"動ラ四", meaning:"①(地方から京へ)上京する ②上る", etym:"「登る」。京を中心とした方向感覚。", example:"都にのぼり給ひぬ。｜山にのぼりて行ふ。", translation:"京へ上京なさった。｜山に登って修行する。", highlight:"のぼり｜のぼり", source:"源氏物語｜徒然草", trivia:"古文では「上る」=都へ向かう。地理的高低ではない。", related:[{id:145,type:"対"}] },
  { id:145, word:"くだる", pos:"動ラ四", meaning:"(京から地方へ)下る・下向する", etym:"「下(くだ)る」。都を中心とした上下関係で、地方へ向かうこと。物理的高低ではない。", example:"東国にくだる。", translation:"東国に下向する。", highlight:"くだる", source:"伊勢物語", trivia:null, related:[{id:144,type:"対"}] },
  { id:146, word:"わたる", pos:"動ラ四", meaning:"①移動する・行く ②(時を)経る ③ずっと〜し続ける(補助動詞)", etym:"「渡る」。空間・時間どちらにも使う。", example:"内裏にわたり給ふ。｜月日のわたるままに。｜思ひわたるころ。", translation:"宮中へお移りになる。｜月日が過ぎるにつれて。｜ずっと思い続けるころ。", highlight:"わたり｜わたる｜わたる", source:"源氏物語｜源氏物語｜源氏物語", trivia:null, related:[{id:263,type:"類"},{id:275,type:"類"}] },
  { id:147, word:"いづ", pos:"動ダ下二", meaning:"①出る・現れる ②(涙・声が)出る ③抜きん出る", etym:"「出(い)づ」。下二段活用。屋内から屋外へ、また何かが現れる動きを表す。", example:"月いでて雲隠れにし。｜涙いでてとまらず。｜いでたる才を惜しむ。", translation:"月が出て雲に隠れてしまった。｜涙が出て止まらない。｜抜きん出た才能を惜しむ。", highlight:"いで｜いで｜いで", source:"伊勢物語｜源氏物語｜徒然草", trivia:null, related:[{id:263,type:"参"},{id:380,type:"類"}] },
  { id:148, word:"あふぐ", pos:"動ガ四", meaning:"①敬う・尊敬する ②あおぐ", etym:"「仰(あふ)ぐ」。四段活用。上を見上げる動作から、尊敬・信頼の意が派生。", example:"御仏を仰ぎ奉る。｜空をあふぎてなきたまふ。", translation:"仏様を仰ぎ申し上げる。｜空を仰いでお泣きになる。", highlight:"仰ぎ｜あふぎ", source:"源氏物語｜源氏物語", trivia:null, related:[{id:218,type:"参"}] },
  { id:149, word:"いつく", pos:"動カ四", meaning:"大切に育てる・かしずく", etym:"「斎(いつ)く」=神聖なものとして大切に扱う。神仏に仕える意から、子を大切に育てる意へ。", example:"姫君を、いつきかしづき給ふ。", translation:"姫君を大切にお育てになる。", highlight:"いつき", source:"源氏物語", trivia:null, related:[{id:288,type:"類"}] },
  { id:150, word:"いとふ", pos:"動ハ四", meaning:"嫌う・避ける・(世を)厭う", etym:"「厭(いと)ふ」。嫌悪・忌避の感情。仏教思想と結びつき「世を厭ふ」=出家する、が定型表現に。", example:"世をいとふ人。", translation:"世間を厭う人(出家者)。", highlight:"いとふ", source:"徒然草", trivia:"「世を厭う」=出家する、の婉曲表現。", related:[{id:155,type:"類"},{id:400,type:"類"},{id:376,type:"類"},{id:312,type:"類"},{id:397,type:"類"},{id:429,type:"類"}] },
  { id:151, word:"うつる", pos:"動ラ四", meaning:"①(色が)あせる ②(場所が)移る ③(心が)変わる", etym:"「移(うつ)る・遷る」。色あせる(衰退)・場所が変わる(移動)・心変わりする(変心)の三義。", example:"花の色はうつりにけりな。｜大和の国にうつりて。｜心のうつりやすきを嘆く。", translation:"花の色はあせてしまったなあ。｜大和の国に移って。｜心が変わりやすいことを嘆く。", highlight:"うつり｜うつり｜うつり", source:"古今集・小野小町｜伊勢物語｜源氏物語", trivia:null, related:[{id:496,type:"類"},{id:377,type:"参"}] },
  { id:152, word:"ねんず", pos:"動サ変", meaning:"①祈る ②念じる・我慢する", etym:"漢語「念(ねん)ず」。サ変動詞。仏に祈念する、苦痛を我慢するの二義がある。", example:"御仏にねんじ申す。｜心をねんじて堪ふ。", translation:"仏様に祈り申し上げる。｜心を落ち着けて堪える。", highlight:"ねんじ｜ねんじ", source:"源氏物語｜源氏物語", trivia:null, related:[{id:153,type:"類"}] },
  { id:153, word:"いのる", pos:"動ラ四", meaning:"祈る・神仏に願う", etym:"「祈(いの)る」。神仏に心をこめて願をかける動作。「念ず」より和語的で切実な語感。", example:"いのる験(しるし)もなし。", translation:"祈っても効果がない。", highlight:"いのる", source:"枕草子", trivia:null, related:[{id:152,type:"類"}] },
  { id:154, word:"あやまつ", pos:"動タ四", meaning:"①間違える・しくじる ②言い誤る・失言する", etym:"「過(あやま)つ」。判断・行動を誤る。失敗した結果に焦点がある。", example:"歌をあやまつ。｜御前にてあやまちぬ。", translation:"歌を誤る。｜御前で失敗した。", highlight:"あやまつ｜あやまち", source:"(作例)｜(作例)", trivia:null, related:[{id:309,type:"参"}] },
  { id:155, word:"おこなふ", pos:"動ハ四", meaning:"①仏道修行をする ②する・実行する", etym:"「行(おこな)ふ」。古文では仏道修行・読経がほぼ中心義。世俗の「する」は近世以降。", example:"山にこもりておこなふ。｜まつりごとをおこなひ給ふ。", translation:"山に籠もって修行する。｜政治をお行いになる。", highlight:"おこなふ｜おこなひ", source:"今昔物語集｜源氏物語", trivia:"古文では「修行する」が中心義。", related:[{id:150,type:"類"},{id:212,type:"類"},{id:312,type:"類"},{id:376,type:"類"},{id:397,type:"類"},{id:400,type:"類"},{id:429,type:"類"}] },
  { id:156, word:"よばふ", pos:"動ハ四", meaning:"求婚する・言い寄る", etym:"「呼(よ)ばふ」=継続して呼びかける。", example:"よばふ人あまたありけり。", translation:"求婚する人が大勢いた。", highlight:"よばふ", source:"竹取物語", trivia:null, related:[{id:88,type:"類"},{id:478,type:"参"}] },
  { id:157, word:"げに", pos:"副", meaning:"なるほど・本当に・いかにも", etym:"「実(げ)に」。相手の言葉や目前の事実に接して「なるほどその通り」と納得する気持ち。", example:"げに、さもあるべき事なり。", translation:"なるほど、そうであるべきことだ。", highlight:"げに", source:"徒然草", trivia:null, related:[{id:270,type:"類"},{id:43,type:"類"}] },
  { id:158, word:"いと", pos:"副", meaning:"①とても・たいそう ②(打消で)それほど〜ない", etym:"上代から続く程度副詞。「いとをかし」「いとあはれ」など、核心となる語を強調する。", example:"いとをかし。｜いと見苦しからずきよげなり。", translation:"とても趣深い。｜それほど見苦しくなく清らかだ。", highlight:"いと｜いと", source:"枕草子｜源氏物語", trivia:"古文最頻出の副詞。", related:[{id:159,type:"類"},{id:61,type:"類"},{id:501,type:"参"},{id:536,type:"類"}] },
  { id:159, word:"いとど", pos:"副", meaning:"いっそう・ますます", etym:"「いと」を強めた副詞。すでに程度が高い状態がさらに増す感覚。", example:"いとどあはれにおぼゆ。", translation:"いっそうしみじみと感じられる。", highlight:"いとど", source:"源氏物語", trivia:null, related:[{id:158,type:"類"}] },
  { id:160, word:"なほ", pos:"副", meaning:"①やはり・依然として ②さらに・もっと", etym:"「直(なほ)」=変わらず真っ直ぐ。", example:"なほこのこと思ひ止まるまじ。｜なほ優りたる方こそよけれ。", translation:"やはりこのことは諦めることはできまい。｜やはり(さらに)優れた方がよい。", highlight:"なほ｜なほ", source:"源氏物語｜枕草子", trivia:null, related:[{id:59,type:"参"}] },
  { id:161, word:"さらなり", pos:"形動ナリ", meaning:"言うまでもない・もちろんだ", etym:"「更なり」=改めて言うまでもない。", example:"月のころはさらなり。", translation:"月の出る頃は言うまでもない。", highlight:"さらなり", source:"枕草子", trivia:null, related:[{id:162,type:"類"}] },
  { id:162, word:"いはむや", pos:"副", meaning:"まして・なおさら", etym:"「言はむや」=言うまでもなく。前件を受けて「なおさら」と強調する呼応表現。", example:"いはむや、心さなき人をや。｜大人だにかなし、いはむや子をや。", translation:"まして、心がけのない人はなおさらだ。｜大人でさえ悲しい、まして子どもはなおさらだ。", highlight:"いはむや｜いはむや", source:"徒然草｜源氏物語", trivia:null, related:[{id:163,type:"類"},{id:161,type:"類"}] },
  { id:163, word:"ましてや", pos:"副", meaning:"なおさら・いっそう", etym:"「まして+や」。前件より程度が高いことを示す強調の副詞。「いはむや」と類義。", example:"ましてや、女は何かせむ。｜ましてや、身分の低き者は。", translation:"なおさら、女にどうすることができようか。｜なおさら、身分の低い者は。", highlight:"ましてや｜ましてや", source:"徒然草｜(作例)", trivia:null, related:[{id:162,type:"類"}] },
  { id:164, word:"さて", pos:"副", meaning:"①そのままで ②ところで", etym:"指示副詞「然(さ)て」。先行する状況を受けた上で、次の話題・動作に転じる接続機能。", example:"さてもやは、ながらへ居るべき。｜さて、いかがし給ふべき。", translation:"それにしてもまあ、このまま生き長らえていられようか。｜さて、どうなさるべきか。", highlight:"さて｜さて", source:"徒然草｜源氏物語", trivia:null, related:[{id:231,type:"類"},{id:232,type:"類"},{id:346,type:"類"},{id:347,type:"類"},{id:348,type:"類"},{id:364,type:"類"},{id:365,type:"類"},{id:401,type:"類"},{id:403,type:"類"},{id:383,type:"類"}] },
  { id:165, word:"しか", pos:"副", meaning:"そう・そのように", etym:"指示副詞「然(しか)」。相手の発言や直前の事態を「そのように」と受ける。", example:"しか言ひしものを。", translation:"そう言ったのに。", highlight:"しか", source:"伊勢物語", trivia:null, related:[{id:229,type:"類"},{id:230,type:"類"}] },
  { id:166, word:"にほふ", pos:"動ハ四", meaning:"①美しく咲く・色が映える ②香る", etym:"「丹(に)+秀(ほ)」=赤色が映える。視覚→嗅覚へ転義。", example:"梅の花にほふ春べに。｜にほひやかなる御衣。", translation:"梅の花が美しく映える春に。｜かぐわしい(つやのある)お召し物。", highlight:"にほふ｜にほひ", source:"万葉集｜源氏物語", trivia:"古文では視覚的「映え」が中心義。香りは中世以降。", related:[{id:167,type:"類"}] },
  { id:167, word:"におひ", pos:"名", meaning:"①色つや・つややかな美しさ ②香り", etym:"動詞「にほふ」の名詞形。古文では視覚的な「色つや」が第一義で、嗅覚は後世の転義。", example:"花のにほひ移ろひて。｜梅のにほひたつる朝かな。", translation:"花の色つやが移ろって。｜梅の香りが立ちのぼる朝よ。", highlight:"にほひ｜にほひ", source:"源氏物語｜古今集", trivia:null, related:[{id:166,type:"類"}] },
  { id:168, word:"あてなり", pos:"形動ナリ", meaning:"①高貴だ ②上品だ", etym:"「貴(あて)なり」。外見・立ち居振る舞いに表れた上品さ・高貴さを形容する。", example:"あてなる人の御娘なり。｜いとあてやかなる御さま。", translation:"高貴な方のお嬢様だ。｜たいそう上品なお姿。", highlight:"あてなる｜あてやかなる", source:"源氏物語｜源氏物語", trivia:null, related:[{id:99,type:"類"},{id:440,type:"参"},{id:457,type:"類"}] },
  { id:169, word:"きよげなり", pos:"形動ナリ", meaning:"美しい・清らかだ・小奇麗だ", etym:"「清(きよ)げ」。整って美しい様子。「きよらなり」(id:170)より一段低い美。", example:"いときよげなる若き人。", translation:"とても美しい若い人。", highlight:"きよげなる", source:"源氏物語", trivia:null, related:[{id:170,type:"類"},{id:5,type:"類"},{id:28,type:"類"}] },
  { id:170, word:"きよらなり", pos:"形動ナリ", meaning:"光り輝くように美しい・最高に美しい", etym:"「清(きよ)ら」。「きよげ」より一段上の美。", example:"いときよらなる玉の男御子。", translation:"とても光り輝くように美しい玉のような皇子。", highlight:"きよらなる", source:"源氏物語", trivia:"『源氏物語』で光源氏の美しさに使われる最高級の語。", related:[{id:5,type:"類"},{id:28,type:"類"},{id:169,type:"類"},{id:439,type:"参"},{id:457,type:"類"}] },
  { id:171, word:"あらたし", pos:"形シク", meaning:"新しい", etym:"上代語「あらたし(新)」と「あたらし(惜)」は本来別語だったが、後世に音が混同され、現代の「あたらしい(新しい)」が成立した。", example:"あらたしき年。", translation:"新しい年。", highlight:"あらたしき", source:"万葉集", trivia:"現代語「新しい」は本来「あらたし」だった。古文の「あたらし」は「惜しい」(id:178)で別の語。", related:[{id:173,type:"対"}] },
  { id:172, word:"あたらし", pos:"形シク", meaning:"①惜しい・もったいない ②(立派なのに)残念だ", etym:"「惜(あたら)し」。価値あるものを失う・損なうことを惜しむ気持ち。「あらたし(新)」とは別語で、後世に同音衝突した。", example:"あたら才ある人のと惜しまれぬ。｜あたら御命かな。", translation:"惜しいことに才能ある人なのにと惜しまれる。｜もったいないお命だなあ。", highlight:"あたら｜あたら", source:"徒然草｜源氏物語", trivia:"現代語「新しい」と同音だが意味が違う要注意語。", related:[{id:35,type:"類"}] },
  { id:173, word:"ふる", pos:"連体", meaning:"古い・昔の。(形容詞「ふるし」の語幹が連体詞化)", etym:"「古る」。動詞「ふる(経る)」と同根。", example:"ふる京は荒れゆくままに。", translation:"旧都はすさんでいくばかりで。", highlight:"ふる", source:"古今集・紀貫之", trivia:null, related:[{id:171,type:"対"}] },
  { id:174, word:"うひうひし", pos:"形シク", meaning:"初々しい・慣れていない・気恥ずかしい", etym:"「初々(うひうひ)し」。経験がなく不慣れな状態を表す。気恥ずかしさを含む。", example:"うひうひしき宮仕へ。", translation:"初々しい(慣れない)宮仕え。", highlight:"うひうひしき", source:"源氏物語", trivia:null, related:[{id:27,type:"類"}] },
  { id:175, word:"あなかま", pos:"連語・感", meaning:"静かに・しっ", etym:"「あな(感嘆)+かま(喧し)」=「ああうるさい」が原義。静粛を命じる決まり文句。", example:"あなかま、と制す。", translation:"「静かに」と制する。", highlight:"あなかま", source:"源氏物語", trivia:null, related:[{id:64,type:"類"}] },
  { id:176, word:"あふひ", pos:"名", meaning:"葵(賀茂祭の象徴)", etym:"「逢ふ日」と掛け詞になることが多い。", example:"あふひ草神のしるしのあればこそ。", translation:"葵草(あふひ)、神のご利益があるからこそ。", highlight:"あふひ", source:"古今集", trivia:"『源氏物語』「葵」巻はこの花にちなむ。", related:[{id:125,type:"参"},{id:238,type:"参"},{id:124,type:"参"}] },
  { id:177, word:"ほい", pos:"名", meaning:"①本来の意志・本意 ②出家の志", etym:"漢語「本意(ほんい)」の音便。元来の志・出家の本願など、根本的な意思を指す。", example:"ほいにもあらぬことにて。｜本意とげてのち、山に入りぬ。", translation:"本意でないことで。｜出家の志を遂げた後、山に入った。", highlight:"ほい｜本意", source:"源氏物語｜今昔物語集", trivia:null, related:[{id:201,type:"類"}] },
  { id:178, word:"ここち", pos:"名", meaning:"①気持ち ②病気・気分", etym:"「心地(ここち)」。心の状態を幅広く指すが、古文では「体調」の意味で頻出する。", example:"うれしきここちしてまゐる。｜ここち例ならずなり給ひて。", translation:"うれしい気持ちがして参上する。｜ご気分がいつもと違って(=ご病気になって)。", highlight:"ここち｜ここち", source:"枕草子｜源氏物語", trivia:"「ここち例ならず」「ここちあし」=病気がち、の慣用。", related:[{id:105,type:"類"}] },
  { id:179, word:"つみ", pos:"名", meaning:"①罪 ②(仏教の)悪業", etym:"「罪(つみ)」。仏教では前世の悪業を指し、現世の不幸の原因と考えた。", example:"罪を犯して流されける人。｜前の世の罪業深きゆゑ。", translation:"罪を犯して流刑になった人。｜前世の罪業が深いゆえに。", highlight:"罪｜罪業", source:"今昔物語集｜源氏物語", trivia:null, related:[{id:180,type:"類"},{id:398,type:"類"},{id:396,type:"類"},{id:426,type:"参"},{id:460,type:"参"}] },
  { id:180, word:"いんぐわ", pos:"名", meaning:"因果・宿縁・前世からの結果", etym:"漢語「因果」。仏教の重要概念。", example:"これも前の世のいんぐわなり。", translation:"これも前世の因果である。", highlight:"いんぐわ", source:"平家物語", trivia:null, related:[{id:395,type:"類"},{id:179,type:"類"}] },
  { id:181, word:"せち", pos:"形動ナリ", meaning:"切実だ・はなはだしい・大切だ", etym:"漢語「切(せち)」。差し迫っている様子。古文では「強く」「しきりに」の副詞的用法が多い。", example:"せちに思し嘆く。", translation:"切実にお嘆きになる。", highlight:"せちに", source:"源氏物語", trivia:null, related:[{id:280,type:"類"},{id:524,type:"類"}] },
  { id:182, word:"ことごとし", pos:"形シク", meaning:"おおげさだ・仰々しい", etym:"「事々(ことごと)し」=何事にも仰々しい。", example:"ことごとしうのしりたり。", translation:"おおげさに威張っている。", highlight:"ことごとしう", source:"枕草子", trivia:"「ことごとしき心」=大げさな心。過剰な形式主義への批判的なニュアンスを含む。", related:[{id:279,type:"類"},{id:446,type:"類"}] },
  { id:183, word:"あきらかなり", pos:"形動ナリ", meaning:"はっきりしている・明白だ", etym:"「明(あきら)か」。物事の状態がはっきりとしていて曖昧さがないこと。", example:"御心あきらかにのたまふ。", translation:"お心をはっきりさせておっしゃる。", highlight:"あきらかに", source:"源氏物語", trivia:null, related:[{id:251,type:"類"}] },
  { id:184, word:"しぐれ", pos:"名", meaning:"時雨(晩秋〜初冬の通り雨)", etym:"「過(し)ぐれ」=通り過ぎる雨。", example:"神無月のころ、しぐれのふること。", translation:"十月頃、時雨が降ること。", highlight:"しぐれ", source:"枕草子", trivia:"和歌の冬の代表的な季語。", related:[{id:121,type:"参"},{id:185,type:"参"}] },
  { id:185, word:"あられ", pos:"名", meaning:"霰(あられ)", etym:"上代から。氷の粒が降る気象現象。和歌では冬のイメージとして詠まれる。", example:"あられ降るまがきが島の。", translation:"霰が降るまがきが島の。", highlight:"あられ", source:"千載集", trivia:null, related:[{id:184,type:"参"},{id:122,type:"参"}] },
  { id:186, word:"きり", pos:"名", meaning:"霧", etym:"上代から。水蒸気が低く漂う気象現象。和歌では「霧=秋」「霞=春」と季節を分ける。", example:"秋の夜の月に霧こそ。", translation:"秋の夜の月に霧がかかることよ。", highlight:"霧", source:"後撰集", trivia:null, related:[{id:187,type:"対"},{id:441,type:"参"}] },
  { id:187, word:"かすみ", pos:"名", meaning:"霞", etym:"上代から。春に山野にたなびく水蒸気。和歌では「霞=春」の約束で「霧=秋」と対。", example:"かすみ立つ春。", translation:"霞のたつ春。", highlight:"かすみ", source:"古今集", trivia:"古今集の歌で「霞は春、霧は秋」と使い分けられる。", related:[{id:186,type:"対"}] },
  { id:188, word:"あかつき", pos:"名", meaning:"夜明け前・明け方", etym:"「明(あ)+時(とき)」。日の出前の暗い時間帯。", example:"あかつきに起き出でて、御文書き給ふ。", translation:"明け方に起き出して、お手紙をお書きになる。", highlight:"あかつき", source:"源氏物語", trivia:"「後朝(きぬぎぬ)の別れ」の時間帯。", related:[{id:191,type:"類"},{id:195,type:"類"},{id:189,type:"類"},{id:8,type:"類"},{id:442,type:"参"}] },
  { id:189, word:"よは", pos:"名", meaning:"夜中・夜半", etym:"「夜(よ)+半(は)」=一夜の中間。深夜の時間帯を指し、月や虫の声と結びつく。", example:"よはの月、さやかに見えて。", translation:"夜中の月が、くっきり見えて。", highlight:"よは", source:"源氏物語", trivia:null, related:[{id:188,type:"類"},{id:191,type:"類"},{id:195,type:"類"},{id:190,type:"類"}] },
  { id:190, word:"ゆふべ", pos:"名", meaning:"夕方・夕暮れ", etym:"「夕(ゆふ)+辺(へ)」。日が沈む前後の時間帯。和歌では秋の夕暮れが特に重んじられた。", example:"秋のゆふべ。", translation:"秋の夕暮れ。", highlight:"ゆふべ", source:"新古今集", trivia:null, related:[{id:189,type:"類"},{id:192,type:"類"},{id:531,type:"参"},{id:121,type:"参"},{id:345,type:"参"}] },
  { id:191, word:"あけぼの", pos:"名", meaning:"夜明け。空がほのかに白み始める頃(まだ暗い)", etym:"「明け+ほの(仄か)」。夜明け前、空がかすかに白み始める一瞬の時間帯。", example:"春は、あけぼの。", translation:"春は、明け方がよい。", highlight:"あけぼの", source:"枕草子", trivia:"『枕草子』冒頭「春はあけぼの」で有名。「あさぼらけ」より早い時刻。空の色のグラデーションに焦点がある語。", related:[{id:188,type:"類"},{id:192,type:"類"},{id:189,type:"類"}] },
  { id:192, word:"あさぼらけ", pos:"名", meaning:"明け方。辺りがほんのりと明るくなる頃(あけぼのより明るい)", etym:"「朝+ほのらけ」。あけぼのよりやや明るい時刻。", example:"あさぼらけ宇治の川霧たえだえに。", translation:"夜明け、宇治の川霧が途切れ途切れに。", highlight:"あさぼらけ", source:"千載集", trivia:"「あけぼの」=空の色が変わり始める段階、「あさぼらけ」=周囲がぼんやり見え始める段階。和歌で頻出。", related:[{id:191,type:"類"},{id:8,type:"類"},{id:190,type:"類"}] },
  { id:193, word:"うちき", pos:"名", meaning:"袿(平安貴族女性の衣服)", etym:"「打ち着(き)」。袿は平安貴族女性の重ね着の中間に位置する衣。色の組み合わせが重視された。", example:"紅のうちき。", translation:"紅色の袿。", highlight:"うちき", source:"源氏物語", trivia:null, related:[{id:194,type:"参"}] },
  { id:194, word:"なほし", pos:"名", meaning:"直衣(貴族男性の平服)", etym:"「直(なほ)し+衣」。略式の上着。", example:"白きなほし着給へる。", translation:"白い直衣をお召しになっている。", highlight:"なほし", source:"源氏物語", trivia:null, related:[{id:193,type:"参"}] },
  { id:195, word:"きぬぎぬ", pos:"名", meaning:"衣々・後朝(共寝した男女が翌朝別れること)", etym:"「衣々」=互いの衣を重ねて寝た翌朝。", example:"きぬぎぬの別れ。", translation:"後朝の別れ。", highlight:"きぬぎぬ", source:"古今集", trivia:"恋愛文学の重要シーン。", related:[{id:189,type:"類"},{id:188,type:"類"}] },
  { id:196, word:"とばり", pos:"名", meaning:"帳・几帳の垂れ幕", etym:"「と(戸)+ばり(張り)」。室内を仕切る垂れ布。プライバシーの重要な道具。", example:"とばりを上げて。", translation:"帳を上げて。", highlight:"とばり", source:"源氏物語", trivia:null, related:[{id:445,type:"参"},{id:388,type:"参"},{id:197,type:"参"}] },
  { id:197, word:"みす", pos:"名", meaning:"御簾(貴人の前にかける簾)", etym:"「御(み)+簾(す)」。貴人のいる空間と外部を隔てる簾。内と外の境界を象徴する調度品。", example:"みすの内より。", translation:"御簾の内から。", highlight:"みす", source:"源氏物語", trivia:null, related:[{id:388,type:"参"},{id:21,type:"類"},{id:474,type:"参"},{id:196,type:"参"}] },
  { id:198, word:"あふぎ", pos:"名", meaning:"扇", etym:"動詞「あふぐ(扇ぐ)」由来。平安文化では扇は意思伝達・贈答にも用いられた重要な道具。", example:"あふぎを広げたるやうに。", translation:"扇を広げたように。", highlight:"あふぎ", source:"枕草子", trivia:null, related:[{id:199,type:"参"}] },
  { id:199, word:"すずり", pos:"名", meaning:"硯", etym:"「墨(すみ)+磨(す)り」由来。文房具の中心。「硯にむかふ」=文章を書こうとすること。", example:"硯にむかひて、心にうつりゆくよしなしごとを。", translation:"硯に向かって、心に浮かぶとりとめないことを。", highlight:"硯", source:"徒然草", trivia:null, related:[{id:198,type:"参"},{id:200,type:"参"}] },
  { id:200, word:"ふみ", pos:"名", meaning:"①手紙 ②書物・漢籍・学問", etym:"「文(ふみ)」。手紙(恋文を含む)と書物(漢籍)の両義を持つ重要な基本語。", example:"御文を書きて遣はす。｜漢籍のふみを読む。", translation:"お手紙を書いて送る。｜漢籍の書物を読む。", highlight:"御文｜ふみ", source:"源氏物語｜徒然草", trivia:"平安貴族の男性にとって「ふみ(漢学・漢詩)」の才は最重要の評価基準。「ざえ(才)」と並ぶ。", related:[{id:239,type:"類"},{id:199,type:"参"},{id:462,type:"類"}] },
  { id:201, word:"こころざし", pos:"名", meaning:"①意志・志 ②愛情 ③贈り物", etym:"動詞「心ざす」の名詞形。意志・愛情・贈り物と、対象に心を向ける行為全般を含む。", example:"こころざしを発して出家す。｜女のもとにこころざし深し。｜こころざしのしなを奉る。", translation:"志を立てて出家する。｜女性のもとへの愛情が深い。｜贈り物の品を差し上げる。", highlight:"こころざし｜こころざし｜こころざし", source:"今昔物語集｜伊勢物語｜竹取物語", trivia:null, related:[{id:96,type:"類"},{id:107,type:"類"},{id:177,type:"類"}] },
  { id:202, word:"おもひ", pos:"名", meaning:"①思い ②(特に)恋心", etym:"「思ひ」。和歌で「火」と掛詞。", example:"おもひあまりてうち泣きぬ。｜おもひに焦がれてやつれたり。", translation:"思いあまって泣いてしまった。｜恋心に焦がれてやつれた。", highlight:"おもひ｜おもひ", source:"源氏物語｜源氏物語", trivia:null, related:[{id:421,type:"参"},{id:92,type:"参"},{id:128,type:"参"},{id:476,type:"類"},{id:412,type:"参"},{id:203,type:"参"},{id:276,type:"参"},{id:342,type:"類"},{id:345,type:"参"},{id:360,type:"参"}] },
  { id:203, word:"こころ", pos:"名", meaning:"①心 ②情趣 ③(歌・物事の)真意", etym:"上代から。心情・意味・趣の三義を持つ最基本語。「歌の心」は和歌の真意を指す。", example:"こころに深く思ふこと。｜物のこころを知る人。｜歌のこころを解す。", translation:"心に深く思うこと。｜情趣のわかる人。｜歌の真意を解する。", highlight:"こころ｜こころ｜こころ", source:"源氏物語｜源氏物語｜古今集", trivia:null, related:[{id:107,type:"類"},{id:202,type:"参"}] },
  { id:204, word:"ゆめ", pos:"名", meaning:"①夢 ②(下に打消で)決して", etym:"上代から。眠りの中の幻覚・無意識の意。副詞「ゆめ」(=決して)は別義。", example:"夢のごとしと見ゆ。｜ゆめ忘れたまふな。", translation:"夢のようだと見える。｜決してお忘れになるな。", highlight:"夢｜ゆめ", source:"源氏物語｜源氏物語", trivia:null, related:[{id:205,type:"対"},{id:29,type:"参"},{id:235,type:"参"}] },

  { id:206, word:"いにしへ", pos:"名", meaning:"①昔・古代 ②亡くなった人(=故人)", etym:"「往(い)に+し+へ」=過ぎ去った時。", example:"いにしへの人の跡を尋ねて。｜いにしへにおはせし人を偲ぶ。", translation:"昔の人の跡を尋ねて。｜亡くなった方を偲ぶ。", highlight:"いにしへ｜いにしへ", source:"徒然草｜源氏物語", trivia:null, related:[{id:207,type:"類"},{id:208,type:"対"},{id:481,type:"類"},{id:482,type:"参"},{id:361,type:"参"}] },
  { id:207, word:"むかし", pos:"名", meaning:"昔・以前", etym:"上代から。「いにしへ」より時代が浅め。", example:"昔、男ありけり。", translation:"昔、男がいた。", highlight:"昔", source:"伊勢物語", trivia:null, related:[{id:206,type:"類"},{id:208,type:"参"},{id:410,type:"参"},{id:481,type:"類"},{id:528,type:"参"}] },
  { id:208, word:"ゆくすゑ", pos:"名", meaning:"将来・行く末", etym:"「行く+末」=これから進む先。将来・末の世を指す。「いにしへ」の対。", example:"ゆくすゑの世。", translation:"将来の世。", highlight:"ゆくすゑ", source:"源氏物語", trivia:null, related:[{id:207,type:"参"},{id:206,type:"対"}] },
  { id:209, word:"よ", pos:"名", meaning:"①世の中 ②時代 ③男女の仲 ④寿命", etym:"「世(よ)」。①世の中 ②時代 ③男女の仲 ④寿命。文脈で判別する最重要多義語。", example:"世の定めなり。｜いにしへの世のことを語る。｜世を恨みて泣きたまふ。｜世の短きことを嘆く。", translation:"世の中のならわしだ。｜昔の時代のことを語る。｜男女の仲を恨んでお泣きになる。｜寿命が短いことを嘆く。", highlight:"世｜世｜世｜世", source:"徒然草｜伊勢物語｜源氏物語｜源氏物語", trivia:"古文の最重要多義語。", related:[{id:248,type:"参"},{id:507,type:"参"}] },
  { id:210, word:"あらはす", pos:"動サ四", meaning:"①現わす・示す ②書き表す", etym:"「現(あらは)す」。目に見える形にする・文章に書き記すなど、表出の動作全般。", example:"心をあらはして語りぬ。｜書きてあらはすべき事。", translation:"心を打ち明けて語った。｜書いて書き表すべきこと。", highlight:"あらはし｜あらはす", source:"源氏物語｜枕草子", trivia:null, related:[{id:211,type:"類"}] },
  { id:211, word:"あらはる", pos:"動ラ下二", meaning:"現れる・露わになる", etym:"「現(あらは)る」。下二段。隠れていたものが自然に目に見えるようになる。「あらはす」の自動詞。", example:"心のうちあらはれぬ。", translation:"心の内が露わになった。", highlight:"あらはれ", source:"源氏物語", trivia:null, related:[{id:210,type:"類"},{id:216,type:"参"}] },
  { id:212, word:"こもる", pos:"動ラ四", meaning:"①(神社・寺に)籠る ②引きこもる", etym:"「籠(こも)る」。四段活用。神社仏閣に泊まり込んで祈願する「参籠」が古文での中心義。", example:"長谷にこもりて祈り申す。｜家にこもりゐてふさぎたり。", translation:"長谷寺に参籠して祈り申し上げる。｜家に引きこもって塞ぎ込んでいる。", highlight:"こもり｜こもり", source:"更級日記｜源氏物語", trivia:null, related:[{id:155,type:"類"},{id:397,type:"類"}] },
  { id:213, word:"うかぶ", pos:"動バ四", meaning:"①浮かぶ ②思い浮かぶ", etym:"「浮(う)かぶ」。水面に浮く物理的動作から、心に思い浮かぶ心理的用法まで。", example:"御目に涙うかびて。｜昔のことうかびて悲し。", translation:"目に涙が浮かんで。｜昔のことが思い浮かんで悲しい。", highlight:"うかび｜うかび", source:"源氏物語｜源氏物語", trivia:null, related:[{id:85,type:"類"},{id:84,type:"参"}] },
  { id:214, word:"とどむ", pos:"動マ下二", meaning:"①とどめる ②書き残す", etym:"「留(とど)む」。下二段。物事の進行を止める・心に留める・記録として残す。", example:"心にとどめてわすれじ。｜日記にかきとどめける。", translation:"心にとめて忘れまい。｜日記に書き記した。", highlight:"とどめ｜とどめ", source:"源氏物語｜土佐日記", trivia:null, related:[{id:97,type:"類"}] },
  { id:215, word:"あぐ", pos:"動ガ下二", meaning:"①(声を)上げる ②差し上げる", etym:"「上(あ)ぐ」。下二段。物を上方へ移す動作。声を上げる・物を差し上げるなど。", example:"声を上げてをめきさけぶ。｜御前にあげたてまつれ。", translation:"声を上げてわめき叫ぶ。｜御前に差し上げ申せ。", highlight:"上げ｜あげ", source:"平家物語｜源氏物語", trivia:null, related:[{id:75,type:"参"}] },
  { id:216, word:"うづむ", pos:"動マ下二", meaning:"埋める・隠す", etym:"「埋(うづ)む」。下二段。灰の中に火種を埋めるなど、物を隠す動作。", example:"灰の中にうづめたる火おこして。", translation:"灰の中に埋めた火を起こして。", highlight:"うづめ", source:"枕草子", trivia:null, related:[{id:211,type:"参"}] },
  { id:217, word:"きこしめす", pos:"動サ四", meaning:"①お聞きになる(尊敬) ②召し上がる(尊敬)", etym:"「聞(き)こし+召(め)す」。最高敬語。", example:"帝きこしめして驚き給ふ。｜御酒をきこしめす。", translation:"帝がお聞きになって驚かれる。｜お酒を召し上がる。", highlight:"きこしめし｜きこしめす", source:"竹取物語｜源氏物語", trivia:null, related:[{id:82,type:"参"},{id:73,type:"対"},{id:283,type:"類"},{id:373,type:"類"},{id:535,type:"参"}] },
  { id:218, word:"ごらんず", pos:"動サ変", meaning:"ご覧になる(「見る」の尊敬)", etym:"「御覧(ごらん)+ず(す)」。サ変。「見る」の最高敬語。帝・上皇に用いる。", example:"帝、御前にて月をごらんず。", translation:"帝が御前で月をご覧になる。", highlight:"ごらんず", source:"源氏物語", trivia:null, related:[{id:551,type:"参"},{id:383,type:"対"},{id:148,type:"参"}] },
  { id:219, word:"めす", pos:"動サ四", meaning:"①お呼びになる ②お召しになる(着る) ③召し上がる(食べる・飲む) ④お乗りになる(乗る)", etym:"「召(め)す」。四段。上位者が下位者を呼び寄せる原義から、着る・食べるの尊敬語に派生。", example:"姫君を御前にめす。｜御衣をめし給ふ。｜御酒をめして酔ひたまふ。｜御車にめさる。", translation:"姫君を御前にお呼びになる。｜お召し物をお召しになる。｜お酒を召し上がって酔われる。｜御車にお乗りになる。", highlight:"めす｜めし｜めし｜めさ", source:"竹取物語｜源氏物語｜源氏物語｜源氏物語", trivia:null, related:[{id:68,type:"参"},{id:373,type:"類"}] },
  { id:220, word:"いかが", pos:"副", meaning:"どうして・どのように・どうだろうか", etym:"「如何(いかが)」。事態の程度や方法を問う疑問副詞。反語的にも使う。", example:"いかが思さるる。", translation:"どのようにお思いになるか。", highlight:"いかが", source:"源氏物語", trivia:null, related:[{id:221,type:"類"},{id:487,type:"類"}] },
  { id:221, word:"いかで", pos:"副", meaning:"①どうして・なぜ ②なんとかして〜したい", etym:"「如何で」。願望にも疑問にも。", example:"いかでかくおはしけむ。｜いかで月を見む。", translation:"どうしてこのようにいらっしゃったのか。｜なんとかして月を見たい。", highlight:"いかで｜いかで", source:"竹取物語｜竹取物語", trivia:null, related:[{id:220,type:"類"},{id:66,type:"参"},{id:368,type:"類"}] },
  { id:222, word:"いづれ", pos:"代名", meaning:"①どれ・どちら(疑問) ②いずれも(=どれも皆) ③いずれにせよ(=結局)", etym:"「何(いづ)れ」。複数の中から一つを選ぶ問いかけ。『源氏物語』冒頭の語としても有名。", example:"いづれの御時にか。｜いづれもいとめでたし。｜いづれかを選ばむ。", translation:"どの帝の御代であったか。｜どれもたいそうすばらしい。｜どれを選ぼうか。", highlight:"いづれ｜いづれ｜いづれ", source:"源氏物語｜枕草子｜徒然草", trivia:"『源氏物語』冒頭。", related:[{id:223,type:"類"},{id:224,type:"参"}] },
  { id:223, word:"いづこ", pos:"代名", meaning:"どこ", etym:"「何処(いづこ)」。場所を問う疑問代名詞。やや改まった文語的な響きを持つ。", example:"いづこへかおはする。", translation:"どちらへいらっしゃるのか。", highlight:"いづこ", source:"源氏物語", trivia:null, related:[{id:222,type:"類"},{id:224,type:"参"}] },
  { id:224, word:"そなた", pos:"代名", meaning:"①そちら ②あなた", etym:"「其(そ)+方(なた)」。空間の方向→あなた(二人称)への転義。親しみと敬意の中間。", example:"そなたへ行きたまふ。｜そなたの御心こそ知りたけれ。", translation:"そちらへいらっしゃる。｜あなたのお心こそ知りたい。", highlight:"そなた｜そなた", source:"源氏物語｜源氏物語", trivia:null, related:[{id:222,type:"参"},{id:223,type:"参"}] },
  { id:225, word:"ぬし", pos:"名", meaning:"①主(あるじ) ②あなた(対等の二人称)", etym:"「主(ぬし)」。家や土地の持ち主、また対等な相手への親しい二人称として使う。", example:"家のぬしにまゐりあひて。｜ぬしはいかに思す。", translation:"家の主に出くわして。｜あなたはどのようにお思いか。", highlight:"ぬし｜ぬし", source:"竹取物語｜源氏物語", trivia:null, related:[{id:136,type:"類"}] },
  { id:226, word:"おのれ", pos:"代名", meaning:"①自分 ②おまえ(目下への二人称)", etym:"「己(おのれ)」。自分自身を指す再帰代名詞。また目下への二人称にも転用される。", example:"おのれを恥ぢて立ちにけり。｜おのれ、何をか言ふぞ。", translation:"自分を恥じて立ち去った。｜おまえ、何を言うのか。", highlight:"おのれ｜おのれ", source:"徒然草｜今昔物語集", trivia:null, related:[{id:227,type:"類"}] },
  { id:227, word:"まろ", pos:"代名", meaning:"わたし・私(対等または目下)", etym:"「麻呂(まろ)」。男女問わず使った一人称代名詞。平安貴族の日常語。", example:"まろが言ふことを聞きたまへ。", translation:"私の言うことを聞いてください。", highlight:"まろ", source:"枕草子", trivia:null, related:[{id:226,type:"類"}] },
  { id:228, word:"つひに", pos:"副", meaning:"①とうとう・ついに ②結局・最終的に", etym:"「終(つひ)に」。長い過程の末に最終的な結果に到ること。「果たして」に近い。", example:"つひに本意とげずなりにけり。｜つひにうせ給ひにけり。", translation:"結局本意を遂げられずに終わった。｜ついにお亡くなりになった。", highlight:"つひに｜つひに", source:"更級日記｜源氏物語", trivia:null, related:[{id:93,type:"参"}] },
  { id:229, word:"かく", pos:"副", meaning:"こう・このように", etym:"指示副詞「然(か)く」。目前の事態・自分側の事態を指す「こう・このように」。", example:"かくてぞ暮らし給ひける。", translation:"こうして日々を過ごされた。", highlight:"かく", source:"源氏物語", trivia:null, related:[{id:165,type:"類"}] },
  { id:230, word:"さ", pos:"副", meaning:"そう・そのように", etym:"指示副詞「然(さ)」。「かく」が自分側を指すのに対し、「さ」は相手・三人称側を指す。", example:"さのみはあらじ。", translation:"そうばかりではあるまい。", highlight:"さのみ", source:"源氏物語", trivia:null, related:[{id:165,type:"類"}] },
  { id:231, word:"しからば", pos:"接続", meaning:"それならば・そうであるならば", etym:"「然(しか)らば」=「そうであるならば」。条件を受ける接続詞。", example:"しからば、まゐらむとて。", translation:"それならば参りましょうとのことで。", highlight:"しからば", source:"徒然草", trivia:null, related:[{id:232,type:"類"},{id:164,type:"類"},{id:346,type:"類"},{id:347,type:"類"},{id:348,type:"類"},{id:364,type:"類"},{id:365,type:"類"},{id:401,type:"類"},{id:403,type:"類"},{id:383,type:"類"},{id:402,type:"参"}] },
  { id:232, word:"さらば", pos:"接続", meaning:"それでは・では", etym:"「さ(然)+あらば」の縮約。条件を受けて「それならば」。別れの挨拶の語源でもある。", example:"さらば、参らむ。", translation:"それでは、参上しよう。", highlight:"さらば", source:"伊勢物語", trivia:"別れの挨拶「さらば」の語源。", related:[{id:231,type:"類"},{id:164,type:"類"},{id:346,type:"類"},{id:347,type:"類"},{id:348,type:"類"},{id:364,type:"類"},{id:365,type:"類"},{id:401,type:"類"},{id:403,type:"類"},{id:383,type:"類"}] },
  { id:233, word:"ふと", pos:"副", meaning:"ふいに・急に・たちまち", etym:"擬態語。突然・不意に起こる動作を表す。「ふと思ひ出づ」が定型表現。", example:"ふと思ひ出でたることあり。", translation:"ふと思い出したことがある。", highlight:"ふと", source:"徒然草", trivia:null, related:[{id:372,type:"類"}] },
  { id:234, word:"ふつに", pos:"副", meaning:"(打消で)まったく〜ない", etym:"「ふつ(=断つ)」の強調。下に打消を伴い完全否定を作る呼応の副詞。", example:"ふつに知らず。", translation:"まったく知らない。", highlight:"ふつに", source:"(作例)", trivia:"呼応の副詞。", related:[{id:59,type:"類"}] },
  { id:235, word:"よもや", pos:"副", meaning:"(下に打消推量を伴って)まさか〜まい", etym:"「よも(=まさか)」の強調形。下に打消推量を伴い「まさか〜まい」の呼応を作る。", example:"よもや忘れじ。", translation:"まさか忘れまい。", highlight:"よもや", source:"平家物語", trivia:"呼応の副詞。", related:[{id:62,type:"類"},{id:63,type:"参"},{id:204,type:"参"}] },
  { id:236, word:"あへて", pos:"副", meaning:"(打消で)まったく〜ない・あえて〜しない", etym:"「敢(あ)へて」。打消とともに「全く〜ない」、肯定で「あえて」の二通りの用法。", example:"あへてわたるまじき。", translation:"決して渡ることができないような。", highlight:"あへて", source:"竹取物語", trivia:null, related:[{id:59,type:"類"}] },
  { id:237, word:"よく", pos:"副", meaning:"①よく・上手に ②しばしば・たびたび", etym:"形容詞「よし」の連用形が副詞化したもの。「上手に・適切に・しばしば」の意。", example:"よく書き給へり。｜よく訪れ来たる人。", translation:"よくお書きになった。｜しばしば訪ねて来る人。", highlight:"よく｜よく", source:"枕草子｜徒然草", trivia:null, related:[{id:41,type:"類"},{id:61,type:"類"}] },
  { id:238, word:"うた", pos:"名", meaning:"和歌・歌", etym:"上代から。文学の中心ジャンル。", example:"うたをよみて遣はしたりければ。", translation:"和歌を詠んで送ったところ。", highlight:"うた", source:"伊勢物語", trivia:null, related:[{id:240,type:"類"},{id:241,type:"類"},{id:239,type:"参"},{id:124,type:"参"},{id:176,type:"参"}] },
  { id:239, word:"ものがたり", pos:"名", meaning:"①物語 ②話・会話", etym:"「物+語り」。人と語り合う行為から、虚構の散文作品のジャンル名へ発展した語。", example:"竹取のものがたりを読む。｜夜もすがらものがたりし給ふ。", translation:"竹取物語を読む。｜一晩中お話しなさる。", highlight:"ものがたり｜ものがたり", source:"更級日記｜源氏物語", trivia:null, related:[{id:238,type:"参"},{id:200,type:"類"}] },
  { id:240, word:"ことのは", pos:"名", meaning:"①言葉 ②和歌", etym:"「言の葉」=言葉を木の葉に見立てた美称。", example:"ことのはを尽くして申す。｜やまと歌はことのははなり。", translation:"言葉を尽くして申し上げる。｜和歌は言葉の花だ。", highlight:"ことのは｜ことのは", source:"源氏物語｜古今集・仮名序", trivia:"『古今和歌集仮名序』に「やまと歌は人の心を種として、よろづのことのはとぞなれりける」。", related:[{id:238,type:"類"},{id:529,type:"参"}] },
  { id:241, word:"よむ", pos:"動マ四", meaning:"①(歌を)詠む ②声を出して読む ③数える", etym:"「詠む」は和歌を作ること。「読む」は声に出して読み上げること。", example:"歌をよみて遣はす。｜ふみをよみ習ふ。｜数をよみ数ふ。", translation:"和歌を詠んで送る。｜書物を読んで学ぶ。｜数を数える。", highlight:"よみ｜よみ｜よみ", source:"伊勢物語｜徒然草｜今昔物語集", trivia:null, related:[{id:238,type:"類"}] },
  { id:242, word:"こと", pos:"名", meaning:"①琴 ②楽器の総称", etym:"上代から。弦楽器(琴・琵琶など)の総称。「琴の音(ね)」は風雅の象徴。", example:"ことをかき鳴らす。｜あまたのことの音聞こゆ。", translation:"琴をかき鳴らす。｜多くの楽器の音が聞こえる。", highlight:"こと｜こと", source:"源氏物語｜源氏物語", trivia:null, related:[{id:243,type:"類"},{id:244,type:"参"}] },
  { id:243, word:"ふえ", pos:"名", meaning:"笛", etym:"「笛(ふえ)」。上代から。管楽器の総称。横笛(おうてき)が代表的。", example:"ふえの音にひかれて。", translation:"笛の音に引かれて。", highlight:"ふえ", source:"源氏物語", trivia:null, related:[{id:114,type:"参"},{id:242,type:"類"},{id:244,type:"参"}] },
  { id:244, word:"まひ", pos:"名", meaning:"舞", etym:"「舞(まひ)」。神楽や雅楽で行われる芸能。宮廷文化の重要な要素。", example:"まひをすこしまひて。", translation:"舞を少し舞って。", highlight:"まひ", source:"平家物語", trivia:null, related:[{id:114,type:"参"},{id:242,type:"参"},{id:243,type:"参"},{id:466,type:"参"}] },
  { id:245, word:"おとなし", pos:"形シク", meaning:"①大人びている・分別がある ②年配だ", etym:"「大人(おとな)+し」=大人びている。年長で分別がある人を指す。現代語とは違い肯定的な語。", example:"おとなしき御後見なり。｜おとなしき人のいふこと。", translation:"分別のある御後見人だ。｜年配の人が言うこと。", highlight:"おとなしき｜おとなしき", source:"源氏物語｜徒然草", trivia:"現代語「おとなしい(穏やか)」とは違う。", related:[{id:357,type:"類"},{id:512,type:"参"},{id:355,type:"参"}] },
  { id:246, word:"ほどなく", pos:"副", meaning:"まもなく・すぐに", etym:"「程(ほど)+無く」=時間の隔たりなく。「まもなく・すぐに」の意。", example:"ほどなく日も暮れぬ。", translation:"まもなく日も暮れた。", highlight:"ほどなく", source:"源氏物語", trivia:null, related:[{id:57,type:"類"},{id:56,type:"類"}] },
  { id:247, word:"ほど", pos:"名", meaning:"①程度 ②時間・間 ③身分・年齢", etym:"上代から。程度・分量・時間・身分・距離と多義。文脈で判断する重要語。", example:"そのほどに過ぎにけり。｜ほどなく日暮れぬ。｜ほどほどにつけて。", translation:"その程度を過ぎてしまった。｜まもなく日が暮れた。｜身分相応にして。", highlight:"ほど｜ほど｜ほど", source:"源氏物語｜源氏物語｜源氏物語", trivia:null, related:[{id:424,type:"類"},{id:477,type:"参"},{id:539,type:"類"}] },
  { id:248, word:"あたり", pos:"名", meaning:"①あたり・付近 ②人(婉曲)", etym:"「辺(あた)り」=周辺。場所の近辺から、人を婉曲に指す用法に派生。「あの方のあたり」=あの方。", example:"御あたりにさぶらふ人々。｜君のあたりにのみぞ。", translation:"お側にお仕えする人々。｜あなたのおそばにのみ。", highlight:"あたり｜あたり", source:"源氏物語｜伊勢物語", trivia:null, related:[{id:209,type:"参"},{id:540,type:"参"}] },
  { id:249, word:"ことに", pos:"副", meaning:"とりわけ・特に", etym:"「殊(こと)に」=他と異なって・格別に。程度の高さを強調する副詞。", example:"ことに、月のころは。", translation:"とりわけ、月の出る頃は。", highlight:"ことに", source:"徒然草", trivia:null, related:[{id:53,type:"類"}] },
  { id:250, word:"あへなし", pos:"形ク", meaning:"あっけない・どうしようもない", etym:"「敢(あ)へ無し」。抵抗できない・呆気ない。結果が瞬く間に決まってしまう無力感。", example:"あへなく攻め落とされぬ。", translation:"あっけなく攻め落とされてしまった。", highlight:"あへなく", source:"平家物語", trivia:null, related:[{id:101,type:"類"},{id:489,type:"参"},{id:519,type:"参"}] },
  { id:251, word:"あきらむ", pos:"動マ下二", meaning:"①明らかにする・はっきりさせる ②(中世以降)諦める", etym:"「明らむ」=明らかにする、原義。", example:"心をあきらめてのたまふ。｜世をあきらめて山に入りぬ。", translation:"心を決めておっしゃる。｜世を見切って山に入った。", highlight:"あきらめ｜あきらめ", source:"源氏物語｜徒然草", trivia:"「心をあきらむ」=心を決める・はっきりさせる。「世をあきらめて」=世を見切って出家する。「諦める」の意は中世以降。", related:[{id:183,type:"類"}] },
  { id:252, word:"おどろおどろし", pos:"形シク", meaning:"①恐ろしい・気味が悪い ②大げさだ", etym:"「おどろ+おどろし」=「おどろく」の畳語形容詞。異様で身の毛がよだつ感覚が原義。", example:"おどろおどろしくなり渡る雷。｜おどろおどろしうのしりたつ。", translation:"気味悪く鳴り渡る雷。｜おおげさに威張り立てる。", highlight:"おどろおどろしく｜おどろおどろしう", source:"源氏物語｜枕草子", trivia:null, related:[{id:393,type:"類"},{id:325,type:"類"},{id:468,type:"参"}] },
  { id:253, word:"あらまし", pos:"名・副", meaning:"①予定・計画 ②だいたい・あらまし", etym:"「あらまし」=「あらむ(あるだろう)」+「し(過去)」の連語が名詞化。予定・計画の意。", example:"あらましを思ひ立ちたる人。｜あらましをだに語れよ。", translation:"計画を思い立てた人。｜だいたいの見通しだけでも語れよ。", highlight:"あらまし｜あらまし", source:"徒然草｜伊勢物語", trivia:null, related:[{id:46,type:"類"},{id:298,type:"類"}] },
  { id:254, word:"をさなし", pos:"形ク", meaning:"①幼い ②思慮が浅い・未熟だ", etym:"「幼(をさな)し」。年齢的に幼いことと、精神的に未熟なことの二義を持つ。", example:"いとをさなき御心なり。｜をさなきことをいふ人。", translation:"たいそう幼いお心だ。｜思慮の浅いことを言う人。", highlight:"をさなき｜をさなき", source:"源氏物語｜徒然草", trivia:null, related:[{id:48,type:"類"}] },
  { id:255, word:"なべて", pos:"副", meaning:"①一般に ②並一通り", etym:"「並(な)べて」=並べた全体。一般的に・全部ひっくるめての意。", example:"なべての人にはあらず。｜なべてならぬ御けはひ。", translation:"一般の人ではない。｜並一通りでないご様子。", highlight:"なべて｜なべて", source:"源氏物語｜源氏物語", trivia:null, related:[{id:256,type:"類"},{id:542,type:"参"},{id:404,type:"類"}] },
  { id:256, word:"おほかた", pos:"副・名", meaning:"①一般に・大体 ②(打消で)全く〜ない", etym:"「大方(おほかた)」。全体を大づかみに見る語。打消文で「全く〜ない」に転じる。", example:"おほかた月のころはさらなり。｜おほかた、物のあはれ知らぬ人。", translation:"だいたい月の出る頃は言うまでもない。｜全く、もののあはれのわからない人。", highlight:"おほかた｜おほかた", source:"枕草子｜源氏物語", trivia:null, related:[{id:255,type:"類"}] },
  { id:257, word:"ひがこと", pos:"名", meaning:"間違い・心得違い・悪事", etym:"「僻(ひが)+事」=ねじけたこと。", example:"ひがことのたまふ。", translation:"的外れなことをおっしゃる。", highlight:"ひがこと", source:"源氏物語", trivia:null, related:[{id:258,type:"類"}] },
  { id:258, word:"ひがめ", pos:"名", meaning:"見間違い・まなざしのねじれ", etym:"「僻(ひが)+目」。見方がずれていること。実際とは違う印象を受けること。", example:"ひがめのみせられたる人。", translation:"見間違いばかりさせられた人。", highlight:"ひがめ", source:"枕草子", trivia:null, related:[{id:257,type:"類"},{id:542,type:"参"}] },
  { id:259, word:"あへしらふ", pos:"動ハ四", meaning:"あしらう・取り合う・もてなす・相手にする", etym:"「饗(あ)へ+す」。客に食事や酒をふるまう・対処するの意。", example:"人をよくあへしらひて。", translation:"人をうまくあしらって。", highlight:"あへしらひ", source:"(作例)", trivia:"「あへ(=十分に)+しらふ(=取り扱う)」の複合語。「あへす」は非標準形であり、正しくは「あへしらふ」。", related:[{id:313,type:"類"}] },
  { id:260, word:"そぞろ", pos:"形動ナリ", meaning:"①わけもなく・なんとなく ②無性に・そぞろに", etym:"擬態語「すずろ/そぞろ」由来。心当たりのない動機で何かが起こる感覚。", example:"そぞろに涙のこぼるる。｜そぞろにゆきなやみて。", translation:"わけもなく涙がこぼれる。｜なんとなく進み悩んで。", highlight:"そぞろに｜そぞろに", source:"源氏物語｜源氏物語", trivia:null, related:[{id:286,type:"類"}] },
  { id:261, word:"ゆゆしく", pos:"副", meaning:"①不吉に ②非常に・たいそう", etym:"形容詞「ゆゆし」(id:22)の連用形。副詞的に用いて「はなはだしく・不吉に」の意。", example:"ゆゆしきこと言ふな。｜ゆゆしくあはれなり。", translation:"不吉なことを言うな。｜たいそうしみじみと感じる。", highlight:"ゆゆしき｜ゆゆしく", source:"源氏物語｜源氏物語", trivia:"形容詞「ゆゆし」(id:22)の連用形。副詞的に用いる。", related:[{id:22,type:"類"},{id:501,type:"類"},{id:536,type:"類"}] },
  { id:262, word:"うつし", pos:"形シク", meaning:"現実だ・正気だ", etym:"「現(うつ)し」。現実世界に属する・正気であるの意。「夢」「まぼろし」の対。", example:"うつしごころのなき人。", translation:"正気でない人。", highlight:"うつし", source:"源氏物語", trivia:null, related:[{id:205,type:"類"}] },
  { id:263, word:"ゆく", pos:"動カ四", meaning:"①行く ②(時が)過ぎる", etym:"上代から。時間の経過にも空間の移動にも使う最基本の動詞。", example:"東へゆく人に伝へよ。｜年ゆけば。", translation:"東へ行く人に伝えよ。｜年が経てば。", highlight:"ゆく｜ゆけ", source:"伊勢物語｜万葉集", trivia:null, related:[{id:264,type:"対"},{id:146,type:"類"},{id:275,type:"類"},{id:147,type:"参"},{id:416,type:"参"}] },
  { id:264, word:"きたる", pos:"動ラ四", meaning:"来る・やって来る", etym:"「来(き)+至(いた)る」。ラ変活用。「来る」のやや古風な表現。", example:"春来にけらし白妙の。", translation:"春が来たらしい、白い布の。", highlight:"来に", source:"古今集・持統天皇", trivia:null, related:[{id:263,type:"対"}] },
  { id:265, word:"あなづらはし", pos:"形シク", meaning:"軽蔑できる・見下せる", etym:"「侮(あなづ)らはし」=見くびることができる・軽んじてよい。", example:"あなづらはしき人にはあらず。", translation:"軽くあしらえる人ではない。", highlight:"あなづらはし", source:"源氏物語", trivia:null, related:[{id:366,type:"類"},{id:471,type:"参"}] },
  { id:266, word:"おぼろけなり", pos:"形動ナリ", meaning:"①並一通りだ ②(打消で)並々でない・尋常でない", etym:"「朧(おぼろ)け」=ぼんやりした・普通の程度。打消と呼応して「並々でない」の意になる。", example:"おぼろけの人にはあらず。｜おぼろけならず悲しとぞ思す。", translation:"並の人ではない。｜並々でなく悲しいとお思いになる。", highlight:"おぼろけ｜おぼろけならず", source:"源氏物語｜源氏物語", trivia:"打消とともに使うと「特別だ」の意。", related:[{id:54,type:"類"},{id:331,type:"類"}] },
  { id:267, word:"つたなし", pos:"形ク", meaning:"①下手だ ②運が悪い", etym:"「拙(つたな)し」。技術・運の不足。「つたなき身の上」=不運な自分。", example:"つたなき歌をよみて。｜つたなき身の上かな。", translation:"下手な歌を詠んで。｜運の悪い身の上だなあ。", highlight:"つたなき｜つたなき", source:"古今集｜源氏物語", trivia:null, related:[{id:101,type:"類"},{id:444,type:"類"},{id:520,type:"類"},{id:354,type:"類"}] },
  { id:268, word:"うけたまはる", pos:"動ラ四", meaning:"承る・お聞きする(「聞く」の謙譲)", etym:"「受(う)け+賜(たまは)る」。目上からの言葉をいただく謙譲表現。", example:"仰せのことをうけたまはる。", translation:"おっしゃることを謹んで承る。", highlight:"うけたまはる", source:"源氏物語", trivia:null, related:[{id:73,type:"類"}] },
  { id:269, word:"そらごと", pos:"名", meaning:"嘘・作り話", etym:"「空(そら)+事」=実体のない事。", example:"そらごとをおほせらるること。", translation:"嘘をおっしゃること。", highlight:"そらごと", source:"竹取物語", trivia:null, related:[{id:270,type:"対"}] },
  { id:270, word:"まこと", pos:"名・形動", meaning:"①真実 ②本当に", etym:"「真(ま)+事」=嘘のない事実。「そらごと(空事)」の対。誠実さの基本語。", example:"まことのことかと疑ふ。｜まことに、いとあはれなり。", translation:"本当のことかと疑う。｜本当に、たいそうしみじみする。", highlight:"まこと｜まことに", source:"竹取物語｜源氏物語", trivia:null, related:[{id:43,type:"参"},{id:269,type:"対"},{id:157,type:"類"}] },
  { id:271, word:"すなはち", pos:"副", meaning:"①すぐに ②つまり・とりもなおさず", etym:"「即(すなは)ち」。原義は「直接に」。前件から間を置かず後件が生じる。", example:"すなはち走り出でぬ。｜すなはち、これこそ道理なれ。", translation:"すぐに走り出た。｜つまり、これこそが道理だ。", highlight:"すなはち｜すなはち", source:"平家物語｜徒然草", trivia:null, related:[{id:427,type:"類"}] },
  { id:272, word:"あさまし", pos:"形シク", meaning:"①驚きあきれる・意外だ ②情けない", etym:"動詞「あさむ(=驚き呆れる)」の形容詞化。良い驚きにも悪い驚きにも使う中立的な語。", example:"あさましう思ひの外なることかな。｜あさましきことどもを見聞きぬ。", translation:"驚きあきれるほど意外なことよ。｜情けないことを見聞きした。", highlight:"あさましう｜あさましき", source:"源氏物語｜源氏物語", trivia:"現代語「あさましい(卑しい)」よりも広く、単に「驚く」の意でも使う。", related:[{id:443,type:"類"},{id:475,type:"類"}] },
  { id:273, word:"おぼえ", pos:"名", meaning:"①評判 ②寵愛・引き立て ③記憶", etym:"動詞「おぼゆ」の名詞形。人からどう思われているか(=評判・寵愛)が中心義。", example:"世のおぼえいとやむごとなし。｜御おぼえやむごとなき方々。｜おぼえにとどめて忘れず。", translation:"世間の評判がたいそう高い。｜ご寵愛の厚い方々。｜記憶にとどめて忘れない。", highlight:"おぼえ｜おぼえ｜おぼえ", source:"源氏物語｜源氏物語｜徒然草", trivia:"平安宮廷文学の最重要語の一つ。「人のおぼえ」=世間の評判、「君のおぼえ」=帝の寵愛。", related:[{id:112,type:"参"},{id:424,type:"参"}] },
  { id:274, word:"おとなふ", pos:"動ハ四", meaning:"①音をたてる ②訪れる", etym:"「音(おと)+なふ」=音を立てる、転じて「訪問する」。", example:"風のおとなふ音を聞く。｜いづくよりおとなひ来けむ。", translation:"風が音をたてる音を聞く。｜どこから訪ねてきたのだろう。", highlight:"おとなふ｜おとなひ", source:"源氏物語｜伊勢物語", trivia:null, related:[{id:497,type:"類"},{id:319,type:"類"}] },
  { id:275, word:"ありく", pos:"動カ四", meaning:"①歩き回る ②あちこちで〜する(補助動詞)", etym:"「歩(あり)く」。四段活用。あちこち歩き回る動作。補助動詞「〜ありく」にもなる。", example:"野山にまじりてありく。｜ものまうでなどにありきける。", translation:"野山に分け入って歩き回る。｜参詣などに出歩いた。", highlight:"ありく｜ありき", source:"徒然草｜源氏物語", trivia:"動詞の連用形について「〜してまわる」の意の補助動詞にもなる。", related:[{id:146,type:"類"},{id:263,type:"類"},{id:420,type:"参"}] },
  { id:276, word:"しのぶ", pos:"動バ四・上二", meaning:"①(忍ぶ・四段)隠れる・こっそり〜する ②(忍ぶ・上二段)我慢する・耐え忍ぶ ③(偲ぶ・上二段)慕う・恋い焦がれる・思い出す", etym:"「忍ぶ」。四段「人目を忍ぶ」、上二段「昔を偲ぶ」で意味を分ける。", example:"しのびやかに通ひける。｜しのぶれど色に出でにけり。｜昔の人を偲びて涙ぐむ。", translation:"こっそり通っていた。｜耐えていたが(恋心が)顔色に出てしまった。｜昔の人を慕って涙ぐむ。", highlight:"しのび｜しのぶれど｜偲び", source:"伊勢物語｜拾遺集・平兼盛｜源氏物語", trivia:"「忍ぶ」は四段(隠れる)・上二段(耐える)の両方あり。「偲ぶ」は上二段のみ。「しのぶれど」=上二段已然形が証拠。「しのべど」なら四段。入試頻出の活用識別問題。", related:[{id:202,type:"参"}] },
  { id:277, word:"かたはらいたし", pos:"形ク", meaning:"①(他人を見て)気の毒だ ②(自分が)きまり悪い・はずかしい", etym:"「傍(かたはら)+痛し」=見ているこちらが心痛む。", example:"かたはらいたきもの。よく知らぬ人の前にて内輪のこと語る。｜人の前にて、かたはらいたく思ふ。", translation:"見ていてはらはらするもの。よく知らない人の前で内輪のことを語ること。｜人前で、きまり悪く思う。", highlight:"かたはらいたき｜かたはらいたく", source:"枕草子｜源氏物語", trivia:"清少納言「かたはらいたきもの」段の冒頭。", related:[{id:27,type:"類"}] },
  { id:278, word:"わづらふ", pos:"動ハ四", meaning:"①病む ②思い悩む ③〜しかねる(補助動詞)", etym:"「煩(わづら)ふ」。病気になる・思い悩む。補助動詞「〜わづらふ」=〜しかねる。", example:"いたうわづらひて月日を経たり。｜いかにせむと思ひわづらふ。｜言ひわづらひてやみぬ。", translation:"ひどく病んで月日を過ごした。｜どうしようかと思い悩む。｜言いかねてやめてしまった。", highlight:"わづらひ｜わづらふ｜わづらひ", source:"源氏物語｜源氏物語｜源氏物語", trivia:null, related:[{id:513,type:"類"},{id:436,type:"類"},{id:94,type:"類"},{id:511,type:"参"},{id:534,type:"参"}] },
  { id:279, word:"こちたし", pos:"形ク", meaning:"①おおげさだ・仰々しい ②わずらわしい・うるさい", etym:"「言痛(ことい)たし」=言葉が痛いほど多い。", example:"こちたく言ひ立てて。｜こちたき物の音にて。", translation:"おおげさに言い立てて。｜うるさい物音がして。", highlight:"こちたく｜こちたき", source:"枕草子｜源氏物語", trivia:null, related:[{id:182,type:"類"},{id:294,type:"類"}] },
  { id:280, word:"ねんごろなり", pos:"形動ナリ", meaning:"①親密だ・心がこもっている ②丁寧だ", etym:"「懇(ねんごろ)」。心を込めた丁寧で親密な態度。中古の人間関係の基本語。", example:"ねんごろに語らひ給ふ。｜ねんごろにもてなし給ふ。", translation:"親しく語らいなさる。｜丁寧にもてなしなさる。", highlight:"ねんごろに｜ねんごろに", source:"源氏物語｜源氏物語", trivia:null, related:[{id:454,type:"類"},{id:181,type:"類"},{id:456,type:"参"}] },
  { id:281, word:"ものから", pos:"接助", meaning:"〜のに・〜けれども(逆接)", etym:"形式名詞「もの」+「から」。逆接を表す接続助詞。「〜けれども」に相当。", example:"よろづのことどもしのびぬるものから、人目もつつましう。", translation:"いろいろなことを我慢したものの、人目もはばかられて。", highlight:"ものから", source:"源氏物語", trivia:"逆接の接続助詞。「ものゆゑ」「ものを」も同類。", related:[{id:282,type:"類"}] },
  { id:282, word:"ものゆゑ", pos:"接助", meaning:"〜のに・〜けれども(逆接)", etym:"「もの+ゆゑ」。「ものから」と同じく逆接。", example:"かかることのあるものゆゑ。", translation:"このようなことがあるので。", highlight:"ものゆゑ", source:"伊勢物語", trivia:null, related:[{id:281,type:"類"}] },
  { id:283, word:"ます", pos:"動サ四", meaning:"いらっしゃる・〜なさる(尊敬)", etym:"上代からの尊敬補助動詞。「おはします」「たてまつる」の「ます」。単独でも尊敬語。", example:"天つ神もろもろ集ひます。", translation:"天の神々がいろいろ集まっていらっしゃる。", highlight:"ます", source:"古事記", trivia:"「おはします」「のたまはす」の「ます」。単独でも尊敬語。", related:[{id:70,type:"類"},{id:217,type:"類"}] },
  { id:284, word:"おとろふ", pos:"動ハ下二", meaning:"衰える・弱る", etym:"「衰(おとろ)ふ」。下二段。力・容姿・権勢が時とともに弱まっていく。", example:"おとろへゆく身を知る。", translation:"衰えていく身を自覚する。", highlight:"おとろへ", source:"源氏物語", trivia:null, related:[{id:500,type:"類"}] },
  { id:285, word:"おもしろし", pos:"形ク", meaning:"①趣深い・風情がある ②美しい", etym:"「面(おも)+白し」=目の前が明るく開ける感じ。", example:"おもしろき桜の下にて。｜月のおもしろき夜に。", translation:"趣深い桜の下で。｜月の美しい夜に。", highlight:"おもしろき｜おもしろき", source:"源氏物語｜枕草子", trivia:"現代語「面白い(滑稽だ)」とは異なり、古文では美的な「趣深さ」が中心義。", related:[{id:2,type:"類"},{id:45,type:"類"},{id:51,type:"参"},{id:4,type:"参"}] },
  { id:286, word:"すずろなり", pos:"形動ナリ", meaning:"①わけもない・なんとなく ②思いがけない", etym:"「漫(すずろ)」。明確な理由がないのに何かが起こる不思議な感覚を表す。", example:"すずろなる涙ぞこぼるる。｜すずろなる目を見ることと思ふに。", translation:"わけもない涙がこぼれる。｜思いがけない目にあうことだと思うと。", highlight:"すずろなる｜すずろなる", source:"源氏物語｜伊勢物語", trivia:null, related:[{id:260,type:"類"}] },
  { id:287, word:"うつくしぶ", pos:"動バ上二", meaning:"かわいがる・愛する", etym:"形容詞「うつくし」を動詞化したもの。対象を愛でて世話する行為を表す。", example:"拾ひてうつくしびて養ふ。", translation:"拾って可愛がって育てる。", highlight:"うつくしび", source:"竹取物語", trivia:null, related:[{id:4,type:"類"}] },
  { id:288, word:"かしづく", pos:"動カ四", meaning:"①大切に育てる ②大切にもてなす・世話をする", etym:"「傅(かしづ)く」。子や主君のそばに付き添う。", example:"いつきかしづき給ふ。｜旅人をかしづきもてなす。", translation:"大切にお育てになる。｜旅人を大切にもてなす。", highlight:"かしづき｜かしづき", source:"源氏物語｜今昔物語集", trivia:null, related:[{id:149,type:"類"}] },
  { id:289, word:"やつる", pos:"動ラ下二", meaning:"①目立たない姿になる・粗末ななりをする ②やつれる", etym:"「窶(やつ)る」。下二段。あえて粗末な身なりにすること。出家や忍び歩きで用いる。", example:"人目を避けてやつれたまふ。｜思ひにやつれてあはれなり。", translation:"人目を避けてやつれていらっしゃる。｜物思いでやつれてしみじみとする。", highlight:"やつれ｜やつれ", source:"源氏物語｜源氏物語", trivia:null, related:[{id:429,type:"類"}] },
  { id:290, word:"のどかなり", pos:"形動ナリ", meaning:"のどかだ・落ち着いている", etym:"「長閑(のどか)」。急がずゆったりとした時間・空間の感覚。春の季節語としても。", example:"春の日のいとのどかなるに。", translation:"春の日がたいそうのどかなのに。", highlight:"のどかなる", source:"古今集", trivia:null, related:[{id:21,type:"対"}] },
  { id:291, word:"うちつけなり", pos:"形動ナリ", meaning:"突然だ・出し抜けだ・軽率だ", etym:"「打ち付け(うちつけ)なり」。前触れなく唐突に行動する様。深い考えのなさを含む。", example:"うちつけなることのたまふ。", translation:"唐突なことをおっしゃる。", highlight:"うちつけなる", source:"源氏物語", trivia:null, related:[{id:455,type:"類"},{id:521,type:"類"}] },
  { id:292, word:"たより", pos:"名", meaning:"①機会・つて ②便宜 ③手紙", etym:"動詞「頼(たよ)る」の名詞形。", example:"よきたよりにてまゐる。｜たよりある所に宿る。｜たよりに文を遣はす。", translation:"よい機会に参上する。｜便宜のよい所に宿る。｜伝便に手紙を送る。", highlight:"たより｜たより｜たより", source:"徒然草｜源氏物語｜源氏物語", trivia:null, related:[{id:506,type:"類"},{id:462,type:"参"}] },
  { id:293, word:"なめし", pos:"形ク", meaning:"無礼だ・失礼だ", etym:"「無礼(なめ)し」。相手の態度が礼を欠いていること。「なめげなり」とも。", example:"いとなめげなる物言ひ。", translation:"たいそう無礼な物言い。", highlight:"なめげ", source:"枕草子", trivia:null, related:[{id:452,type:"類"}] },
  { id:294, word:"むつかし", pos:"形シク", meaning:"①不快だ・うっとうしい ②気味が悪い ③面倒だ・煩わしい", etym:"「難(むつ)かし」。原義は不快・気味悪さ。現代語「難しい(困難)」の意は近世以降。", example:"むつかしき夢を見たる。｜むつかしき所にはいらず。｜むつかしきことになりにけり。", translation:"不快な夢を見た。｜気味の悪い場所には入らない。｜面倒なことになってしまった。", highlight:"むつかしき｜むつかしき｜むつかしき", source:"源氏物語｜枕草子｜徒然草", trivia:"現代語「難しい(困難だ)」と意味が違う。古文では「うっとうしい」。", related:[{id:279,type:"類"},{id:38,type:"類"}] },
  { id:295, word:"うしろめたし", pos:"形ク", meaning:"気がかりだ・心配だ", etym:"「後ろ目痛し」=後ろが気になる。", example:"幼き人のゆくすゑの。", translation:"幼い人の将来が。", highlight:"幼き", source:"源氏物語", trivia:"現代語「後ろめたい(罪悪感)」とは違う。古文では単に「気がかり」。", related:[{id:21,type:"類"}] },
  { id:296, word:"うしろやすし", pos:"形ク", meaning:"安心だ・後顧の憂いがない", etym:"「後ろ安し」。「うしろめたし」の対。", example:"うしろやすくあそばせ給へ。", translation:"安心してお過ごしください。", highlight:"うしろやすく", source:"源氏物語", trivia:null, related:[{id:516,type:"類"},{id:517,type:"対"}] },
  { id:297, word:"よし", pos:"名", meaning:"①趣・風情 ②理由・由緒 ③手段 ④旨(=趣旨)", etym:"「由(よし)」。形容詞「よし(良し)」とは別。", example:"よしある所に住む。｜その由を申す。｜よしなきことなれ。｜旨をうけたまはる。", translation:"風情のある所に住む。｜その旨を申し上げる。｜方法のないことだ。｜趣旨をお受けする。", highlight:"よし｜由｜よし｜旨", source:"徒然草｜源氏物語｜源氏物語｜源氏物語", trivia:"多義の重要語。「〜のよし、申しける」=「〜という旨を申し上げた」の用法も頻出。", related:[{id:41,type:"参"}] },
  { id:298, word:"なかなか", pos:"副・形動", meaning:"①かえって・むしろ ②なまじっか", etym:"「中々」=中途半端で、転じて「かえって」。", example:"なかなかなることになりて。｜なかなか言はぬぞよき。", translation:"かえって中途半端なことになって。｜なまじっか言わない方がよい。", highlight:"なかなかなる｜なかなか", source:"徒然草｜枕草子", trivia:"現代語「なかなか(=かなり)」と意味が異なる。古文では「かえって」が中心義。", related:[{id:253,type:"類"},{id:549,type:"類"}] },
  { id:299, word:"いまだ", pos:"副", meaning:"(下に打消で)まだ〜ない", etym:"「未(いま)だ」。時間的にまだ到達していないこと。下に打消を伴う呼応の副詞。", example:"いまだきはめず。", translation:"まだ極めていない。", highlight:"いまだ", source:"徒然草", trivia:null, related:[{id:61,type:"参"}] },
  { id:300, word:"やや", pos:"副", meaning:"①しだいに ②少し ③ややもすれば", etym:"上代から。「やうやう」と同根。", example:"やや明けゆく空の色。｜ややありてのたまふ。｜ややもすれば忘れがちなり。", translation:"しだいに明けてゆく空の色。｜少し経っておっしゃる。｜ともすれば忘れがちだ。", highlight:"やや｜やや｜ややもすれば", source:"源氏物語｜源氏物語｜源氏物語", trivia:null, related:[{id:10,type:"類"}] },
  { id:301, word:"あまた", pos:"副", meaning:"たくさん・大勢", etym:"「数多(あまた)」。不定の多量を表す副詞。「人あまた」=大勢の人。", example:"人あまた召して。", translation:"人を大勢お呼びになって。", highlight:"あまた", source:"源氏物語", trivia:null, related:[{id:302,type:"類"},{id:303,type:"類"},{id:507,type:"類"}] },
  { id:302, word:"ここら", pos:"副", meaning:"たくさん・たいそう", etym:"「幾許(ここら)」。数えきれないほどの多さ。「ここらの年月」=長い年月。", example:"ここらの御宝物。", translation:"たくさんの宝物。", highlight:"ここら", source:"竹取物語", trivia:null, related:[{id:301,type:"類"},{id:303,type:"類"},{id:507,type:"類"}] },
  { id:303, word:"そこら", pos:"副", meaning:"たくさん・たいそう", etym:"「ここら」に類する不定多量の副詞。「そこらの宝」=たくさんの宝物。", example:"そこらの人の中に。", translation:"たくさんの人の中に。", highlight:"そこら", source:"伊勢物語", trivia:null, related:[{id:458,type:"参"},{id:301,type:"類"},{id:302,type:"類"}] },
  { id:304, word:"おもふ", pos:"動ハ四", meaning:"①思う・考える ②恋い慕う ③心配する・案じる", etym:"「思ふ」。上代から最頻出の心理動詞。和歌では「思ひ」が「火」と掛詞になる。", example:"思ふことを言ひ出でず。｜あなたをぞ思ふ。｜子を思ふ親の心。", translation:"思うことを言い出さない。｜あなたのことを恋い慕う。｜子を思う親の心。", highlight:"思ふ｜思ふ｜思ふ", source:"源氏物語｜伊勢物語｜源氏物語", trivia:null, related:[{id:309,type:"類"},{id:317,type:"類"}] },
  { id:305, word:"しる", pos:"動ラ四", meaning:"①知る・わかる ②治める・領有する", etym:"「知る・領る」。知識を得る意と、土地を支配する意の二義がある。", example:"人の心をしりて語る。｜国をしらせ給ふ。", translation:"人の心を理解して語る。｜国をお治めになる。", highlight:"しり｜しら", source:"徒然草｜源氏物語", trivia:null, related:[{id:383,type:"参"}] },
  { id:306, word:"たのむ", pos:"動マ四・下二", meaning:"①(四段)頼りにする・信頼する ②(下二段)頼りにさせる", etym:"「頼む」。四段は自分が頼る、下二段は相手に頼らせる(期待させる)。", example:"この人をぞたのむ。｜言葉巧みにたのめて去りぬ。", translation:"この人を頼りにする。｜言葉巧みに期待させて去った。", highlight:"たのむ｜たのめ", source:"源氏物語｜伊勢物語", trivia:"四段と下二段で意味が変わる重要動詞。", related:[{id:328,type:"参"}] },
  { id:307, word:"かかる", pos:"連体", meaning:"このような・こういう", etym:"指示連体詞「斯(か)かる」。目前の事態を指す。「さる」(=そのような)と対。", example:"かかることは例あらじ。", translation:"このようなことは前例がないだろう。", highlight:"かかる", source:"源氏物語", trivia:null, related:[{id:308,type:"参"},{id:359,type:"参"}] },
  { id:308, word:"さる", pos:"連体", meaning:"①(連体詞)そのような・しかるべき・立派な ②(動詞)去る・過ぎる", etym:"指示連体詞「然(さ)る」。先行文脈を受けて「そのような」。", example:"さるべき人をぞ選ぶ。｜日のさるほどになりて。", translation:"しかるべき人を選ぶ。｜日が過ぎるほどになって。", highlight:"さる｜さる", source:"源氏物語｜源氏物語", trivia:null, related:[{id:307,type:"参"},{id:544,type:"類"}] },
  { id:309, word:"まどふ", pos:"動ハ四", meaning:"心が乱れる・途方に暮れる・夢中になる", etym:"「惑(まど)ふ」。判断力を失って混乱する状態。", example:"悲しさにまどふ。", translation:"悲しさに心が乱れる。", highlight:"まどふ", source:"源氏物語", trivia:null, related:[{id:304,type:"類"},{id:92,type:"類"},{id:154,type:"参"},{id:547,type:"参"}] },
  { id:310, word:"なげく", pos:"動カ四", meaning:"嘆く・ため息をつく・悲しむ", etym:"「嘆く」。深い息(ため息)とともに悲しみを表す動作。", example:"おほきになげかしきことなり。", translation:"たいそう嘆かわしいことだ。", highlight:"なげか", source:"源氏物語", trivia:null, related:[{id:374,type:"類"},{id:513,type:"類"},{id:434,type:"類"}] },
  { id:311, word:"わぶ", pos:"動バ上二", meaning:"つらく思う・困る・わびしく暮らす", etym:"「侘(わ)ぶ」。上二段活用。形容詞「わびし」の動詞形。", example:"世をわびて山に籠もりにける。", translation:"世の中をつらく思って山に籠もってしまった。", highlight:"わびて", source:"古今集", trivia:null, related:[{id:33,type:"類"}] },
  { id:312, word:"すつ", pos:"動タ下二", meaning:"捨てる・見捨てる・(出家して)世を捨てる", etym:"「捨(す)つ」。下二段活用。物を捨てる原義から出家の意にも。", example:"世を捨てて出家せむとおもひたつ。", translation:"世を捨てて出家しようと決心する。", highlight:"捨て", source:"徒然草", trivia:null, related:[{id:150,type:"類"},{id:155,type:"類"},{id:376,type:"類"},{id:397,type:"類"},{id:400,type:"類"},{id:429,type:"類"}] },
  { id:313, word:"もてなす", pos:"動サ四", meaning:"①ふるまう・取り扱う ②もてはやす ③装う", etym:"「持て+為す」=手に持って操る→ふるまい方を定める。", example:"いとなつかしうもてなし給ふ。｜人をもてなすこと巧みなり。｜知らぬさまにもてなして。", translation:"たいそう親しみ深くふるまいなさる。｜人をもてなすことが巧みだ。｜知らないふりをして。", highlight:"もてなし｜もてなす｜もてなし", source:"源氏物語｜徒然草｜源氏物語", trivia:null, related:[{id:259,type:"類"},{id:432,type:"類"}] },

  { id:315, word:"つかはす", pos:"動サ四", meaning:"①遣わす・派遣する ②(手紙を)送る", etym:"「遣(つか)はす」。四段活用。使いを出す・送り届ける。", example:"御文を遣はす。｜使を遣はして求む。", translation:"お手紙を送る。｜使者を派遣して求める。", highlight:"遣はす｜遣はし", source:"源氏物語｜竹取物語", trivia:null, related:[{id:349,type:"類"},{id:322,type:"類"},{id:143,type:"類"}] },

  { id:318, word:"すぐ", pos:"動ガ上二", meaning:"①過ぎる ②優れる ③度が過ぎる", etym:"「過(す)ぐ」。上二段活用。時間の経過・程度の超過・優越の三義。", example:"月日すぐるままに。｜才のすぐれたる人。｜礼すぎたることを言ふ。", translation:"月日が過ぎるにつれて。｜才能の優れた人。｜礼を過ぎたことを言う。", highlight:"すぐる｜すぐれ｜すぎ", source:"源氏物語｜源氏物語｜徒然草", trivia:null, related:[{id:93,type:"類"},{id:57,type:"類"}] },
  { id:319, word:"かたらふ", pos:"動ハ四", meaning:"語り合う・親しく付き合う", etym:"「語(かた)らふ」。継続・反復の接尾辞「ふ」がついた形。", example:"かたらひて後、便りあれば。", translation:"語らい合ってから、機会があれば。", highlight:"かたらひ", source:"徒然草", trivia:null, related:[{id:274,type:"類"},{id:497,type:"類"}] },
  { id:320, word:"みゆ", pos:"動ヤ下二", meaning:"①見える・目に入る ②思われる ③(人に)会う", etym:"「見(み)+ゆ(自発・受身)」。自然に目に入る→「見られる」の受身にも。", example:"山の端にみゆるは月か。｜心細くみゆる御けしき。｜夢にみゆる人の面影。", translation:"山の端に見えるのは月か。｜心細く見えるご様子。｜夢に現れる人の面影。", highlight:"みゆる｜みゆる｜みゆる", source:"伊勢物語｜源氏物語｜源氏物語", trivia:null, related:[{id:551,type:"類"},{id:414,type:"参"},{id:141,type:"参"}] },
  { id:321, word:"たまはる", pos:"動ラ四", meaning:"いただく・頂戴する(「もらふ」の謙譲語)", etym:"「賜(たまは)る」。四段活用。上位者から物を受け取る謙譲語。「たまふ」(四段・尊敬)とは別。", example:"御衣一かさねたまはりたる。", translation:"お召し物を一重ねいただいた。", highlight:"たまはり", source:"枕草子", trivia:"「たまふ」(尊敬)と「たまはる」(謙譲)を混同しないこと。", related:[{id:80,type:"対"},{id:81,type:"参"},{id:142,type:"参"},{id:492,type:"類"}] },
  { id:322, word:"つかまつる", pos:"動ラ四", meaning:"お仕えする・いたす(「す」の謙譲語)", etym:"「仕(つか)まつる」。「仕ふ(つかふ)」+「まつる(奉る)」の複合謙譲語。", example:"御前にてつかうまつる。", translation:"御前でお仕えする。", highlight:"つかうまつる", source:"源氏物語", trivia:"「つかうまつる」(id:371)と同一語。「つかへ+まつる」の音便化で「う」が入ることがある。", related:[{id:77,type:"類"},{id:315,type:"類"},{id:371,type:"類"}] },
  { id:323, word:"あそばす", pos:"動サ四", meaning:"なさる・お作りになる(「す」の尊敬語)", etym:"「遊ばす」。貴人の行為全般を高める尊敬語。近世の女房詞にも残る。", example:"歌をあそばす。", translation:"和歌をお詠みになる。", highlight:"あそばす", source:"源氏物語", trivia:null, related:[{id:70,type:"類"}] },
  { id:324, word:"すごし", pos:"形ク", meaning:"①もの寂しい・ぞっとする ②素晴らしい", etym:"「凄(すご)し」。荒涼として心が寒くなる感覚が原義。後に「凄い(すごい)」の肯定的な意へ。", example:"すごき野辺のけしき。｜すごくをかしき所なり。", translation:"もの寂しい野辺の景色。｜ぞっとするほど趣のある所だ。", highlight:"すごき｜すごく", source:"源氏物語｜枕草子", trivia:null, related:[{id:20,type:"類"}] },
  { id:325, word:"むくつけし", pos:"形ク", meaning:"気味が悪い・無骨だ・恐ろしい", etym:"「むくつけし」。得体の知れないものへの嫌悪・恐怖。", example:"むくつけきものの怪。", translation:"気味の悪い物の怪。", highlight:"むくつけき", source:"源氏物語", trivia:null, related:[{id:252,type:"類"},{id:393,type:"類"}] },
  { id:326, word:"いかめし", pos:"形シク", meaning:"厳かだ・堂々としている・大規模だ", etym:"「厳(いか)めし」。威厳があって近づきがたい様子。", example:"いかめしき御よそほひ。", translation:"厳かな(盛大な)お支度。", highlight:"いかめしき", source:"源氏物語", trivia:null, related:[{id:418,type:"類"}] },
  { id:327, word:"うたてし", pos:"形ク", meaning:"いやだ・ひどい・嘆かわしい・ますます", etym:"「転(うた)て+し」。事態が望まない方向へ進む不快感。", example:"うたてき心地す。", translation:"いやな気持ちがする。", highlight:"うたてき", source:"源氏物語", trivia:null, related:[{id:390,type:"類"},{id:39,type:"類"},{id:453,type:"類"},{id:530,type:"類"}] },
  { id:328, word:"たのもし", pos:"形シク", meaning:"頼もしい・頼りになる・期待できる", etym:"「頼(たの)もし」。動詞「たのむ」の形容詞化。将来への安心感。", example:"たのもしき御後見と思ふ。", translation:"頼りになる後見人とお思いになる。", highlight:"たのもしき", source:"源氏物語", trivia:null, related:[{id:306,type:"参"}] },
  { id:329, word:"さがなし", pos:"形ク", meaning:"意地が悪い・性質が悪い・口が悪い", etym:"「性(さが)+無し」=良い性質がない。特に口さがない(=悪口を言う)の意で頻出。", example:"さがなき人の言ひ散らしたる。", translation:"口の悪い人が言いふらした。", highlight:"さがなき", source:"源氏物語", trivia:null, related:[{id:52,type:"類"},{id:39,type:"類"},{id:422,type:"類"},{id:518,type:"参"}] },
  { id:330, word:"あまねし", pos:"形ク", meaning:"広く行き渡っている・普遍的だ", etym:"「遍(あまね)し」。端から端まで残らず行き渡る様子。", example:"あまねく照らす月の光。", translation:"隅々まで照らす月の光。", highlight:"あまねく", source:"枕草子", trivia:"「あまねく」の形で副詞として使うことが多い。「あまねく照らす」=隅々まで照らす。", related:[{id:332,type:"類"}] },
  { id:331, word:"なのめなり", pos:"形動ナリ", meaning:"①いいかげんだ・平凡だ ②(打消で)並々でない", etym:"「斜(ななめ)なり」が転じた語。斜め=正面でない=いいかげんの意。", example:"なのめならず美しき人。｜なのめなる人にはあらず。", translation:"並一通りでなく美しい人。｜平凡な人ではない。", highlight:"なのめならず｜なのめなる", source:"源氏物語｜源氏物語", trivia:"打消を伴う「なのめならず」が最頻出。", related:[{id:54,type:"類"},{id:266,type:"類"}] },
